<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Centro de control — Parque Grifos Sacyr</title>
<meta name="theme-color" content="#001640">
<link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preload" href="capas-mapa.json" as="fetch" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
<style>
:root{--ink:#001640;--navy:#002359;--cy:#01B3D7;--cy2:#63D1E0;--txt:#E8F0FA;--soft:#9FB3CC;--mute:#6B82A1;
 --dir:#FF4D63;--ind:#FF9A3C;--sen:#FFD83D;--res:#6E85A3;--sin:#2FB8D8;--ok:#36D399;
 --glass:rgba(3,14,36,.78);--glass2:rgba(6,22,52,.72);--borde:rgba(99,209,224,.22);--sombra:0 10px 40px rgba(0,0,0,.45)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#020a1c;color:var(--txt);font:500 13px/1.45 Inter,system-ui,sans-serif;overflow:hidden}
#mapa{position:fixed;inset:0}
#mapa canvas{outline:none}
.maplibregl-ctrl-bottom-right{bottom:14px;right:14px}
.maplibregl-ctrl-group{background:var(--glass);border:1px solid var(--borde);box-shadow:var(--sombra);backdrop-filter:blur(12px)}
.maplibregl-ctrl-group button{width:34px;height:34px;filter:invert(1) hue-rotate(180deg) brightness(1.15)}
.maplibregl-ctrl-group button+button{border-top:1px solid rgba(255,255,255,.08)}
.maplibregl-ctrl-attrib{background:rgba(3,14,36,.6);color:var(--mute);font-size:10px}
.maplibregl-ctrl-attrib a{color:var(--soft)}

/* ---- barra superior ---- */
.top{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;align-items:stretch;gap:14px;padding:12px 16px;pointer-events:none}
.top>*{pointer-events:auto}
.marca{display:flex;flex-direction:column;justify-content:center;background:linear-gradient(120deg,#001640,#002359 55%,#004a78);border:1px solid var(--borde);border-radius:14px;padding:10px 16px;box-shadow:var(--sombra);min-width:250px}
.marca .eye{font:700 9.5px Montserrat,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--cy2)}
.marca h1{margin:2px 0 0;font:800 18px Montserrat,sans-serif;letter-spacing:-.01em;line-height:1.1}
.marca .sub{font-size:11px;color:var(--soft);margin-top:3px;display:flex;align-items:center;gap:6px}
.marca .sub .live{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(54,211,153,.7);animation:live 2s infinite}
@keyframes live{0%{box-shadow:0 0 0 0 rgba(54,211,153,.6)}70%{box-shadow:0 0 0 7px rgba(54,211,153,0)}100%{box-shadow:0 0 0 0 rgba(54,211,153,0)}}
.kpis{flex:1;display:flex;gap:10px;align-items:stretch;min-width:0;overflow-x:auto;scrollbar-width:none}
.kpis::-webkit-scrollbar{display:none}
.kpi{all:unset;cursor:pointer;flex:1;min-width:148px;background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--borde);border-radius:14px;padding:9px 14px;display:flex;flex-direction:column;justify-content:center;gap:2px;box-shadow:var(--sombra);transition:border-color .15s,transform .15s,background .15s;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,var(--cy));opacity:.9}
.kpi:hover{border-color:var(--cy2);transform:translateY(-1px)}
.kpi.on{background:rgba(1,179,215,.14);border-color:var(--cy2);box-shadow:0 0 0 1px rgba(99,209,224,.35),var(--sombra)}
.kpi .n{font:800 26px/1 Montserrat,sans-serif;color:#fff;text-shadow:0 0 18px color-mix(in srgb,var(--c,var(--cy)) 55%,transparent);font-variant-numeric:tabular-nums}
.kpi .l{font:600 10.5px Inter,sans-serif;color:var(--txt);white-space:nowrap}
.kpi .s{font:500 10px Inter,sans-serif;color:var(--soft);white-space:nowrap}
.acciones{display:flex;gap:8px;align-items:center}
.btn{all:unset;cursor:pointer;background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--borde);border-radius:12px;padding:0 13px;height:46px;display:flex;align-items:center;gap:8px;font:700 11.5px Inter,sans-serif;color:var(--txt);box-shadow:var(--sombra);white-space:nowrap;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--cy2)}
.btn.on{background:linear-gradient(120deg,#01B3D7,#0e7fa8);border-color:transparent;color:#001640}
.btn svg{width:16px;height:16px;flex:none}
.btn.on svg *{stroke:#001640}
.busca{display:flex;align-items:center;gap:8px;background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--borde);border-radius:12px;height:46px;padding:0 12px;box-shadow:var(--sombra)}
.busca input{all:unset;width:110px;font:700 12px Inter,sans-serif;color:#fff;text-transform:uppercase;letter-spacing:.03em}
.busca input::placeholder{color:var(--mute);text-transform:none;font-family:Inter}
.busca svg{width:15px;height:15px;color:var(--cy2)}

/* ---- paneles ---- */
.pan{position:fixed;z-index:15;background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--borde);border-radius:16px;box-shadow:var(--sombra);overflow:auto;scrollbar-width:thin;scrollbar-color:rgba(99,209,224,.35) transparent}
.pan.izq{left:16px;top:86px;bottom:16px;width:272px}
.pan.der{right:16px;top:86px;width:300px;max-height:calc(100vh - 102px)}
.sec{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.07)}
.sec:last-child{border-bottom:0}
.tt{font:800 9.5px Montserrat,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--cy2);margin-bottom:9px;display:flex;justify-content:space-between;align-items:center}
.tt .mini{font:600 10px Inter,sans-serif;letter-spacing:0;text-transform:none;color:var(--soft)}
.tt .mini button{all:unset;cursor:pointer;color:var(--cy2);text-decoration:underline}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:rgba(255,255,255,.06);border-radius:11px;padding:4px}
.seg button{all:unset;cursor:pointer;text-align:center;padding:8px 4px;border-radius:8px;font:700 11px Inter,sans-serif;color:var(--soft);line-height:1.15;transition:background .15s,color .15s}
.seg button.on{background:linear-gradient(120deg,#01B3D7,#1088b5);color:#001640}
.sw{display:flex;align-items:center;gap:9px;padding:6px 0;cursor:pointer;color:var(--txt)}
.sw input{appearance:none;width:30px;height:17px;border-radius:9px;background:rgba(255,255,255,.14);position:relative;flex:none;cursor:pointer;transition:background .15s;margin:0}
.sw input::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:left .15s}
.sw input:checked{background:var(--cy)}
.sw input:checked::after{left:15px}
.sw .t{flex:1;font-weight:600;font-size:12px}
.sw small{color:var(--mute);font-size:10px}
.sw em{font-style:normal;color:var(--soft);font-variant-numeric:tabular-nums;font-size:11px}
.sw .ic{width:18px;height:18px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.sw .ic svg{width:12px;height:12px}
.gr{font:700 10px Inter,sans-serif;color:var(--soft);margin:8px 0 1px;letter-spacing:.04em;text-transform:uppercase}
.radio{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:10px;font-weight:600;font-size:12px}
.radio span{display:flex;gap:4px}
.radio button{all:unset;cursor:pointer;padding:5px 8px;border:1px solid var(--borde);border-radius:8px;font:700 10.5px Inter,sans-serif;color:var(--soft)}
.radio button.on{background:rgba(1,179,215,.18);border-color:var(--cy2);color:#fff}
.ley div{display:flex;align-items:center;gap:8px;padding:2px 0;font-size:11.5px;color:var(--soft)}
.ley i{display:inline-block;width:11px;height:11px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}
.ley i.h{background:#0b1b33 !important;border:2.5px solid currentColor;box-shadow:none}
.fuente{padding:10px 14px 12px;font-size:10px;color:var(--mute);line-height:1.5}

/* comunas y prioridades */
.com{all:unset;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 12px;border:1px solid rgba(255,255,255,.08);border-radius:12px;margin-bottom:8px;background:rgba(255,255,255,.03);transition:border-color .15s,background .15s;width:100%}
.com:hover{border-color:var(--cy2);background:rgba(1,179,215,.08)}
.com b{font:800 13px Montserrat,sans-serif;color:#fff;letter-spacing:.02em}
.com .n{font:800 20px/1 Montserrat,sans-serif;color:#fff;grid-row:1/3;align-self:center;text-shadow:0 0 14px rgba(255,77,99,.5)}
.com .d{font-size:10.5px;color:var(--soft);display:flex;gap:8px;flex-wrap:wrap}
.com .d i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:3px;vertical-align:0}
.barra{grid-column:1/3;height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;display:flex;margin-top:4px}
.barra span{height:100%}
.pri{all:unset;cursor:pointer;display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:10px;width:100%;transition:background .15s}
.pri:hover{background:rgba(1,179,215,.1)}
.pri .k{font:700 12px Inter,sans-serif;color:#fff;min-width:66px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.pri .w{flex:1;min-width:0;font-size:11px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pri .p{width:9px;height:9px;border-radius:50%;background:var(--dir);box-shadow:0 0 10px var(--dir);flex:none;animation:pul 1.6s infinite}
@keyframes pul{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
.pri .z{font:600 10px Inter,sans-serif;color:var(--cy2);flex:none}
.pri.grp .w b{color:#fff;font-weight:700}
.pri.grp.on{background:rgba(1,179,215,.18);box-shadow:inset 0 0 0 1px var(--cy2)}
.pri .ic{width:20px;height:20px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.pri .ic svg{width:11px;height:11px}

/* ---- ficha (popup) ---- */
.maplibregl-popup.pop .maplibregl-popup-content{background:var(--glass2);backdrop-filter:blur(16px);color:var(--txt);border:1px solid var(--borde);border-radius:14px;box-shadow:var(--sombra);padding:13px 15px;font:500 12px Inter,sans-serif;min-width:230px}
.maplibregl-popup.pop .maplibregl-popup-tip{border-top-color:rgba(6,22,52,.9);border-bottom-color:rgba(6,22,52,.9)}
.maplibregl-popup.pop .maplibregl-popup-close-button{color:var(--soft);font-size:18px;right:6px;top:4px}
.maplibregl-popup.tip .maplibregl-popup-content{background:rgba(3,14,36,.9);color:#fff;border:1px solid var(--borde);border-radius:9px;padding:6px 10px;font:600 11.5px Inter,sans-serif;box-shadow:var(--sombra)}
.maplibregl-popup.tip .maplibregl-popup-tip{display:none}
.pc{font:800 17px Montserrat,sans-serif;color:#fff;letter-spacing:.01em}
.pm{color:var(--soft);font-size:11px;margin:1px 0 9px}
.pb{font-weight:700;display:flex;align-items:center;gap:7px;color:#fff}
.pb i{width:11px;height:11px;border-radius:50%;flex:none;box-shadow:0 0 10px currentColor}
.pb i.h{background:#0b1b33 !important;border:2.5px solid currentColor;box-shadow:none}
.pt{margin-top:5px;color:var(--soft);font-size:11px;line-height:1.45}
.pl{margin-top:10px;padding-top:8px;border-top:1px solid rgba(255,255,255,.1);font:800 9px Montserrat,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--cy2)}
.pli{margin-top:5px;display:flex;gap:7px;align-items:center}
.pli .ic{width:16px;height:16px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.pli .ic svg{width:10px;height:10px}
.pli .pd{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}
.pli em{font-style:normal;color:var(--mute);font-size:10.5px}
.pli span{margin-left:auto;padding-left:8px;color:var(--soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.pz{margin-top:7px;padding:5px 8px;border-radius:7px;font-size:11px;background:rgba(54,211,153,.14);color:#BFF5DF;border:1px solid rgba(54,211,153,.35)}
.pz.aviso{background:rgba(255,216,61,.14);color:#FFE99A;border-color:rgba(255,216,61,.4)}
.pz.vencido{background:rgba(255,77,99,.16);color:#FFC3CB;border-color:rgba(255,77,99,.5)}
.pz.sin_fecha{background:rgba(255,255,255,.06);color:var(--soft);border-color:rgba(255,255,255,.12)}
.sinl{margin-top:9px;padding-top:7px;border-top:1px solid rgba(255,255,255,.1);color:var(--mute);font-size:11px}
.pacc{display:flex;gap:6px;margin-top:10px}
.pacc button{all:unset;cursor:pointer;flex:1;text-align:center;padding:6px 8px;border-radius:8px;background:rgba(1,179,215,.16);border:1px solid var(--borde);font:700 10.5px Inter,sans-serif;color:#fff}
.pacc button:hover{background:rgba(1,179,215,.3)}

/* ---- recorrido, carga, aviso ---- */
.cap{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:25;background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--borde);border-radius:16px;padding:14px 22px;box-shadow:var(--sombra);max-width:min(760px,92vw);text-align:center;display:none}
.cap.on{display:block;animation:sube .4s ease-out}
@keyframes sube{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
.cap .ct{font:800 9.5px Montserrat,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--cy2)}
.cap .cb{font:800 20px Montserrat,sans-serif;color:#fff;margin:3px 0 2px}
.cap .cs{font-size:12.5px;color:var(--soft)}
.cap .cx{position:absolute;right:8px;top:6px;all:unset;cursor:pointer;color:var(--soft);font-size:16px;padding:2px 6px}
.cap .ck{margin-top:6px;font:600 9.5px Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
body.pausa .cap .ck::before{content:"En pausa · ";color:var(--sen)}
/* modo presentación: durante el recorrido se ocultan los paneles y sólo quedan los indicadores */
body.presentando .pan,body.presentando .busca,body.presentando .mov,body.presentando .maplibregl-ctrl-bottom-right{display:none}
body.presentando .cap{bottom:40px}
.carga{position:fixed;inset:0;z-index:50;background:radial-gradient(1200px 600px at 50% 40%,#0a2a5c,#020a1c 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .6s}
.carga.off{opacity:0;pointer-events:none}
.carga .lg{font:800 10px Montserrat,sans-serif;letter-spacing:.3em;text-transform:uppercase;color:var(--cy2)}
.carga h2{margin:0;font:900 30px Montserrat,sans-serif;letter-spacing:-.01em;color:#fff}
.carga .st{color:var(--soft);font-size:12.5px}
.carga .bar{width:220px;height:3px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
.carga .bar i{display:block;height:100%;width:40%;background:linear-gradient(90deg,transparent,var(--cy2),transparent);animation:bar 1.2s infinite}
@keyframes bar{from{transform:translateX(-100%)}to{transform:translateX(350%)}}
.aviso{position:fixed;left:50%;top:84px;transform:translateX(-50%);z-index:30;background:rgba(255,77,99,.15);border:1px solid rgba(255,77,99,.5);color:#fff;border-radius:10px;padding:8px 14px;font-size:12px;display:none}
.aviso.on{display:block}
.mov{display:none}

/* ---- modo tablero (dentro del tablero ejecutivo) ---- */
body.tablero .marca,body.tablero .pan.der{display:none}
body.tablero .top{padding:10px 12px}
body.tablero .pan.izq{top:72px;left:12px;bottom:12px;width:250px}
body.tablero .kpi{min-width:124px;padding:7px 12px}
body.tablero .kpi .n{font-size:22px}
body.tablero .cap{bottom:18px}
/* ---- móvil ---- */
@media(max-width:1000px){
 .pan.der{display:none}
 .marca{min-width:0}
 .kpi{min-width:112px}
 .busca{display:none}
}
@media(max-width:720px){
 .top{flex-wrap:wrap;gap:8px;padding:8px}
 .marca{width:100%;flex-direction:row;align-items:center;justify-content:space-between;padding:8px 12px}
 .marca h1{font-size:15px}
 .marca .sub{display:none}
 .acciones{width:100%;justify-content:space-between}
 .btn{height:38px;padding:0 10px;font-size:11px}
 .btn .tx{display:none}
 .pan.izq{left:8px;right:8px;top:auto;bottom:8px;width:auto;max-height:46vh;transform:translateY(calc(100% + 8px));transition:transform .25s}
 .pan.izq.on{transform:none}
 .mov{display:flex;position:fixed;right:14px;bottom:14px;z-index:16}
 .maplibregl-ctrl-bottom-right{bottom:70px}
 .cap{bottom:70px}
}
</style></head><body>
<div id="mapa" role="application" aria-label="Mapa del parque de grifos"></div>

<header class="top">
  <div class="marca">
    <div class="eye">Gestión Sacyr · Parque Grifos Sacyr</div>
    <h1>Centro de control</h1>
    <div class="sub"><span class="live" aria-hidden="true"></span><span id="estado">Conectando con el catastro…</span></div>
  </div>
  <div class="kpis" id="kpis" role="group" aria-label="Indicadores"></div>
  <div class="acciones">
    <label class="busca" title="Buscar grifo por código"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg><input id="busca" placeholder="Buscar grifo…" aria-label="Buscar grifo por código" autocomplete="off"></label>
    <button class="btn" id="b3d" title="Relieve y edificios en 3D"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M8 1.5 14 5v6l-6 3.5L2 11V5z"/><path d="M8 8l6-3M8 8 2 5M8 8v6.5"/></svg><span class="tx">3D</span></button>
    <button class="btn" id="bsat" title="Imagen satelital"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="6"/><path d="M2 8h12M8 2c2.5 2.5 2.5 9.5 0 12M8 2c-2.5 2.5-2.5 9.5 0 12"/></svg><span class="tx">Satélite</span></button>
    <button class="btn" id="btour" title="Recorrido automático por el parque"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5v11l9-5.5z"/></svg><span class="tx">Recorrido</span></button>
    <button class="btn" id="bfull" title="Pantalla completa"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg></button>
  </div>
</header>

<aside class="pan izq" id="pizq" aria-label="Vistas y capas"></aside>
<aside class="pan der" id="pder" aria-label="Comunas y prioridades"></aside>
<button class="btn mov" id="bmov" aria-label="Mostrar capas">Capas</button>
<div class="cap" id="cap" role="status"></div>
<div class="aviso" id="aviso"></div>
<div class="carga" id="carga"><div class="lg">Gestión Sacyr</div><h2>Centro de control</h2><div class="st" id="cst">Leyendo el catastro de grifos…</div><div class="bar"><i></i></div></div>

<script>
/* =====================================================================
   Centro de control · Parque Grifos Sacyr
   Mapa vectorial (MapLibre GL) sobre OpenFreeMap, relieve 3D, edificios,
   lugares sensibles, sectores, mapa de calor, concentración 3D y recorrido.
   Sólo lee: nada se escribe en Firestore.
   ===================================================================== */
const ESTILO='https://tiles.openfreemap.org/styles/dark';
const DEM='https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png';
const SAT='https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
const COL={directa:'#FF4D63',indirecta:'#FF9A3C',senaletica:'#FFD83D',resuelto:'#6E85A3',sin:'#2FB8D8'};
const NOMC={directa:'Operatividad directa',indirecta:'Operatividad indirecta',senaletica:'Señalética',resuelto:'Todo resuelto',sin:'Sin hallazgos'};

/* ---------- geometría ---------- */
const RAD=Math.PI/180;
const metros=(a,b,c,d)=>{const x=(d-b)*RAD*Math.cos((a+c)/2*RAD),y=(c-a)*RAD;return Math.sqrt(x*x+y*y)*6371000;};
function indexar(lista,la,ln){const P=.004,ix={};lista.forEach((o,i)=>{const k=Math.floor(la(o)/P)+'|'+Math.floor(ln(o)/P);(ix[k]=ix[k]||[]).push(i);});
 return{cerca(qla,qln,m){const out=[],r=Math.ceil(m/400)+1,a=Math.floor(qla/P),b=Math.floor(qln/P);
  for(let i=-r;i<=r;i++)for(let j=-r;j<=r;j++)(ix[(a+i)+'|'+(b+j)]||[]).forEach(n=>{const o=lista[n],d=metros(qla,qln,la(o),ln(o));if(d<=m)out.push({o,d});});
  return out.sort((x,y)=>x.d-y.d);}};}
function envolvente(pts){const p=pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);if(p.length<3)return p;
 const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]);const lo=[],up=[];
 for(const q of p){while(lo.length>1&&cr(lo[lo.length-2],lo[lo.length-1],q)<=0)lo.pop();lo.push(q);}
 for(let i=p.length-1;i>=0;i--){const q=p[i];while(up.length>1&&cr(up[up.length-2],up[up.length-1],q)<=0)up.pop();up.push(q);}
 return lo.slice(0,-1).concat(up.slice(0,-1));}
function circulo(la,ln,m,n){const out=[];for(let i=0;i<=n;i++){const t=i/n*2*Math.PI;out.push([ln+Math.cos(t)*m/(111320*Math.cos(la*RAD)),la+Math.sin(t)*m/111320]);}return out;}

function horasDesde(f){const t=f?new Date(f).getTime():NaN;return isNaN(t)?null:Math.max(0,(Date.now()-t)/36e5);}
/* plazo SISS del grifo: se mide sobre el hallazgo abierto más antiguo de su peor criticidad */
function plazoDe(crit,ab){const p=PLAZO[crit];if(!p||!ab.length)return null;
 const hs=ab.filter(x=>x.cr===crit).map(x=>horasDesde(x.f)).filter(x=>x!=null);if(!hs.length)return{estado:'sin_fecha',txt:p.txt};
 const h=Math.max(...hs);if(h>p.h)return{estado:'vencido',h,txt:p.txt,exceso:h-p.h};if(p.aviso&&h>p.aviso)return{estado:'aviso',h,txt:p.txt};return{estado:'en_plazo',h,txt:p.txt};}
function peorDe(rs){const ab=rs.filter(x=>x.e!=='resuelto');const b=ab.length?ab:rs;let p='senaletica';b.forEach(x=>{if(ORD.indexOf(x.cr)<ORD.indexOf(p))p=x.cr;});
 const est=ab.length?(ab.some(x=>x.e!=='en_proceso')?'pendiente':'en_proceso'):'resuelto';
 return{crit:ab.length?p:'resuelto',est,abiertos:ab.length,n:rs.length,tipos:[...new Set(ab.flatMap(x=>x.t||[]))].slice(0,4),plazo:ab.length?plazoDe(p,ab):null};}
function lugaresActivos(){return (datos.capas.lug||[]).filter(l=>S.cats.has(l.c));}

 Object.keys(pg).forEach(k=>{const rs=pg[k];const o=G[k]||(G[k]={k,la:rs[0].la,ln:rs[0].ln,co:rs[0].co,loc:'',cat:null,rs:[]});o.rs=rs;o.s=peorDe(rs);});
 const grifos=Object.values(G);

 lug.forEach(l=>{const c=idxG.cerca(l.la,l.ln,S.radio);l.cer=c;l.nab=c.filter(x=>x.o.s&&x.o.s.abiertos).length;l.ndir=c.filter(x=>x.o.s&&x.o.s.abiertos&&x.o.s.crit==='directa').length;});
 const fG={type:'FeatureCollection',features:grifos.map(g=>({type:'Feature',geometry:{type:'Point',coordinates:[g.ln,g.la]},
   properties:{k:g.k,crit:g.s?g.s.crit:'sin',est:g.s?g.s.est:'sin',ab:g.s?g.s.abiertos:0,n:g.s?g.s.n:0,co:g.co,loc:g.loc,sens:g.cer.length?1:0,grp:g.grp.join(','),
     pulso:(g.s&&g.s.crit==='directa'&&g.s.est==='pendiente')?1:0,venc:(g.s&&g.s.plazo&&g.s.plazo.estado==='vencido')?1:0}}))};
 const fL={type:'FeatureCollection',features:lug.map((l,i)=>({type:'Feature',geometry:{type:'Point',coordinates:[l.ln,l.la]},
   properties:{i,n:l.n,c:l.c,g:CATS[l.c].g,nom:CATS[l.c].nom,pri:CATS[l.c].pri,ncer:l.cer.length,nab:l.nab,ndir:l.ndir,riesgo:l.ndir?1:0}}))};
 const fR={type:'FeatureCollection',features:lug.map(l=>({type:'Feature',geometry:{type:'Polygon',coordinates:[circulo(l.la,l.ln,S.radio,40)]},properties:{g:CATS[l.c].g,riesgo:l.ndir?1:0}}))};
 /* sectores del parque: envolvente de los grifos por localidad */

 Object.keys(por).forEach(k=>{const gs=por[k],sin=gs.slice(),grupos=[];
  while(sin.length){const g=[sin.pop()];for(let i=0;i<g.length;i++)for(let j=sin.length-1;j>=0;j--)if(metros(g[i].la,g[i].ln,sin[j].la,sin[j].ln)<900)g.push(sin.splice(j,1)[0]);grupos.push(g);}
  const mayor=Math.max(...grupos.map(x=>x.length));
  grupos.forEach(g=>{const ex=[];g.forEach(p=>{for(let a=0;a<10;a++){const t=a/10*2*Math.PI;ex.push([p.ln+Math.cos(t)*120/(111320*Math.cos(p.la*RAD)),p.la+Math.sin(t)*120/111320]);}});
   const h=envolvente(ex);h.push(h[0]);

   if(g.length===mayor){const la=Math.max(...g.map(p=>p.la))+.0022,ln=g.reduce((s,p)=>s+p.ln/g.length,0);
    fSl.features.push({type:'Feature',geometry:{type:'Point',coordinates:[ln,la]},properties:{n:titulo(k).toUpperCase(),t:gs.length+' grifos'}});}});});
 /* mapa de calor y hexágonos 3D con los hallazgos abiertos */
 const ab=datos.hall.filter(h=>h.e!=='resuelto');
 const fC={type:'FeatureCollection',features:ab.map(h=>({type:'Feature',geometry:{type:'Point',coordinates:[h.ln,h.la]},properties:{w:h.cr==='directa'?3:h.cr==='indirecta'?2:1}}))};

function hexagonos(pts,R){
 if(!pts.length)return{type:'FeatureCollection',features:[]};
 const la0=pts.reduce((s,p)=>s+p.la,0)/pts.length,ln0=pts.reduce((s,p)=>s+p.ln,0)/pts.length,kx=111320*Math.cos(la0*RAD),ky=111320;

 pts.forEach(p=>{const x=(p.ln-ln0)*kx,y=(p.la-la0)*ky;let q=(Math.sqrt(3)/3*x-y/3)/R,r=(2/3*y)/R;let s=-q-r;
  let rq=Math.round(q),rr=Math.round(r),rs=Math.round(s);const dq=Math.abs(rq-q),dr=Math.abs(rr-r),ds=Math.abs(rs-s);
  if(dq>dr&&dq>ds)rq=-rr-rs;else if(dr>ds)rr=-rq-rs;
  const k=rq+'|'+rr;(cel[k]=cel[k]||{q:rq,r:rr,n:0,d:0});cel[k].n++;if(p.cr==='directa')cel[k].d++;});
 const mx=Math.max(...Object.values(cel).map(c=>c.n));
 return{type:'FeatureCollection',features:Object.values(cel).map(c=>{const cx=R*Math.sqrt(3)*(c.q+c.r/2),cy=R*1.5*c.r;const ring=[];
  for(let i=0;i<=6;i++){const t=(30+60*i)*RAD;ring.push([ln0+(cx+R*Math.cos(t))/kx,la0+(cy+R*Math.sin(t))/ky]);}
  return{type:'Feature',geometry:{type:'Polygon',coordinates:[ring]},properties:{n:c.n,d:c.d,h:Math.round(60+c.n*45),t:c.n/mx}};})};}

function pulso(color){const size=120;return{width:size,height:size,data:new Uint8Array(size*size*4),

function mostrarTip(ll,html,fijo){if(tip)tip.remove();tip=new maplibregl.Popup({closeButton:false,closeOnClick:true,className:'tip',offset:12,maxWidth:'300px'}).setLngLat(ll).setHTML(html).addTo(map);if(!fijo)return;}

/* ---------- vistas, capas y filtros ---------- */
function aplicarVista(){
 const v=S.vista,g=S.geo;
 const f=[];
 if(S.comuna!=='todos')f.push(['==',['get','co'],S.comuna]);
 if(v==='hall'&&!MODO_TABLERO)f.push(['!=',['get','crit'],'sin']);
 if(S.filtro==='vencido')f.push(['==',['get','venc'],1]);
 if(S.filtro==='abierta')f.push(v==='hall'?['==',['get','est'],'en_proceso']:['>',['get','ab'],0]);
 if(S.filtro==='directa')f.push(['==',['get','crit'],'directa']);
 if(S.filtro==='sensible')f.push(['all',['>',['get','ab'],0],['==',['get','sens'],1]]);
 if(S.filtro.startsWith('g:'))f.push(['all',['>',['get','ab'],0],['in',S.filtro.slice(2),['get','grp']]]);
 if(S.filtro==='resuelto')f.push(['==',['get','crit'],'resuelto']);
 if(S.filtro==='sin')f.push(['==',['get','crit'],'sin']);
 const filtro=f.length?['all',...f]:null;
 ['grifo-glow','grifo-core','grifo-txt'].forEach(id=>map.setFilter(id,filtro));
 map.setFilter('grifo-pulso',filtro?['all',['==',['get','pulso'],1],filtro]:['==',['get','pulso'],1]);
 const fl=[];
 if(S.filtro==='riesgo')fl.push(['==',['get','riesgo'],1]);
 if(S.filtro==='sinlug')fl.push(['==',['get','ncer'],0]);
 if(S.filtro.startsWith('g:'))fl.push(['==',['get','g'],S.filtro.slice(2)]);
 map.setFilter('lug-ico',fl.length?['all',...fl]:null);
 map.setFilter('radios-f',fl.length?['all',...fl.filter(x=>x[1][1]!=='ncer')]:null);map.setFilter('radios-l',map.getFilter('radios-f'));
 /* en el tablero el parque sano queda como fondo tenue y sólo resaltan las fallas */
 map.setPaintProperty('grifo-core','circle-opacity',MODO_TABLERO&&v==='hall'?['match',['get','crit'],'sin',.28,'resuelto',.4,1]:(v==='lug'?.75:1));
 map.setPaintProperty('grifo-core','circle-stroke-opacity',MODO_TABLERO&&v==='hall'?['match',['get','crit'],'sin',.25,'resuelto',.4,1]:1);
 map.setLayoutProperty('lug-ico','icon-size',['interpolate',['linear'],['zoom'],9,v==='lug'?.6:.42,13,v==='lug'?1:.75,16,v==='lug'?1.15:.95]);
 map.setLayoutProperty('lug-ico','text-field',['step',['zoom'],'',v==='lug'?12.5:13.5,['get','n']]);
 map.setPaintProperty('lug-ico','icon-opacity',v==='hall'?.78:.97);
 ['radios-f','radios-l'].forEach(id=>map.setLayoutProperty(id,'visibility',v==='lug'?'visible':'none'));
 map.setPaintProperty('grifo-glow','circle-opacity',['match',['get','crit'],'sin',v==='parque'?.25:0,'resuelto',MODO_TABLERO?.08:.18,v==='lug'?.3:.5]);
 ['sect-f','sect-l','sect-t'].forEach(id=>map.setLayoutProperty(id,'visibility',S.capas.sect?'visible':'none'));
 ['pobl-f','pobl-l','pobl-t','pobl-t2'].forEach(id=>map.setLayoutProperty(id,'visibility',S.capas.pobl?'visible':'none'));
 map.setLayoutProperty('com-l','visibility',S.capas.com?'visible':'none');
 map.setLayoutProperty('calor','visibility',S.capas.calor?'visible':'none');
 map.setLayoutProperty('hex','visibility',S.capas.hex?'visible':'none');
 map.setLayoutProperty('hill','visibility',S.capas.relieve?'visible':'none');
 map.setLayoutProperty('edif','visibility',S.capas.edif?'visible':'none');
 map.setLayoutProperty('sat','visibility',S.sat?'visible':'none');
 kpis();panelDer();leyenda();}
function recalcular(fit){S.geo=construirGeo();['grifos','lug','radios','sect','sectl','calor','hex'].forEach(k=>{const src=map.getSource(k);if(!src)return;src.setData({grifos:S.geo.fG,lug:S.geo.fL,radios:S.geo.fR,sect:S.geo.fS,sectl:S.geo.fSl,calor:S.geo.fC,hex:S.geo.fH}[k]);});aplicarVista();if(fit)encuadrar();}
function limitesParque(pad){const b=new maplibregl.LngLatBounds();datos.grifos.forEach(g=>b.extend([g.ln,g.la]));datos.hall.forEach(h=>b.extend([h.ln,h.la]));return b;}
function padding(){const w=innerWidth,der=MODO_TABLERO?30:340;return w>1000?{top:100,bottom:40,left:310,right:der}:w>720?{top:100,bottom:40,left:300,right:30}:{top:120,bottom:60,left:20,right:20};}
function encuadrar(anim){map.fitBounds(limitesParque(),{padding:padding(),pitch:S.tres?52:0,bearing:S.tres?-14:0,duration:anim?1800:0,maxZoom:14});}

/* ---------- tarjetas, paneles y leyenda ---------- */
function kpis(){
 const g=S.geo,gs=g.grifos.filter(x=>S.comuna==='todos'||x.co===S.comuna),v=S.vista,el=document.getElementById('kpis');
 const abierto=x=>x.s&&x.s.abiertos>0;
 const card=(id,n,l,s,c)=>'<button class="kpi'+(S.filtro===id?' on':'')+'" data-f="'+id+'" style="--c:'+(c||'#01B3D7')+'" aria-pressed="'+(S.filtro===id)+'"><span class="n">'+fmt(n)+'</span><span class="l">'+l+'</span><span class="s">'+s+'</span></button>';
 let h='';
 if(v==='hall'){const ab=gs.filter(abierto),dir=ab.filter(x=>x.s.crit==='directa'),sen=ab.filter(x=>x.cer.length),res=gs.filter(x=>x.s&&!x.s.abiertos);
  h=card('todos',ab.length,'Grifos con falla abierta',fmt(res.length)+' ya resueltos')+card('directa',dir.length,'Operatividad directa',fmt(dir.filter(x=>x.s.est==='pendiente').length)+' pendientes',COL.directa)
   +card('sensible',sen.length,'Junto a un lugar sensible',fmt(sen.filter(x=>x.s.crit==='directa').length)+' con falla directa',GRUPOS.educ.col);
  const venc=ab.filter(x=>x.s.plazo&&x.s.plazo.estado==='vencido'),vd=venc.filter(x=>x.s.crit==='directa').length;
  h+=card('vencido',venc.length,'Fuera de plazo SISS',vd+' directa (> 48 h) · '+(venc.length-vd)+' > 3 meses',COL.senaletica);}
 else if(v==='parque'){const ab=gs.filter(abierto),res=gs.filter(x=>x.s&&!x.s.abiertos),sin=gs.filter(x=>!x.s),sen=gs.filter(x=>x.cer.length);
  h=card('todos',gs.length,'Grifos en el parque',(datos.parque>gs.length?fmt(datos.parque)+' en el catastro · '+(datos.parque-gs.length)+' sin coordenada':'catastro Sacyr'))
   +card('abierta',ab.length,'Con falla abierta',Math.round(100*ab.length/Math.max(1,gs.length))+'% del parque',COL.directa)+card('resuelto',res.length,'Hallazgos resueltos','sin pendientes',COL.resuelto)
   +card('sensible',sen.length,'Junto a un lugar sensible',fmt(sen.filter(abierto).length)+' con falla abierta',GRUPOS.educ.col);}
 else{const ls=g.lug,ri=ls.filter(l=>l.ndir),sl=ls.filter(l=>!l.cer.length);
  h=card('todos',ls.length,'Lugares sensibles','en la zona del parque')+card('riesgo',ri.length,'Con grifo en falla directa','a ≤ '+S.radio+' m',COL.directa)+card('sinlug',sl.length,'Sin grifo a ≤ '+S.radio+' m','pueden estar fuera del parque',COL.resuelto);
  h+=card('g:salud',ls.filter(l=>CATS[l.c].g==='salud').length,'Salud',fmt(ls.filter(l=>CATS[l.c].g==='salud'&&l.nab).length)+' con grifo con falla cerca',GRUPOS.salud.col);}
 el.innerHTML=h;
 el.querySelectorAll('.kpi').forEach(b=>b.onclick=()=>{const f=b.dataset.f;S.filtro=(S.filtro===f&&f!=='todos')?'todos':f;aplicarVista();if(S.filtro!=='todos')encuadrarFiltro();});}
function encuadrarFiltro(){
 const ids=S.vista==='lug'?S.geo.lug.filter(l=>pasaLugar(l)):S.geo.grifos.filter(x=>pasaGrifo(x));
 if(!ids.length)return;const b=new maplibregl.LngLatBounds();ids.forEach(o=>b.extend([o.ln,o.la]));map.fitBounds(b,{padding:padding(),duration:1400,maxZoom:15.5});}
function pasaGrifo(x){const f=S.filtro,ab=x.s&&x.s.abiertos>0;if(S.comuna!=='todos'&&x.co!==S.comuna)return false;if(S.vista==='hall'&&!x.s&&!MODO_TABLERO)return false;
 if(f==='todos')return true;if(f==='vencido')return !!(x.s&&x.s.plazo&&x.s.plazo.estado==='vencido');if(f==='abierta')return S.vista==='hall'?(ab&&x.s.est==='en_proceso'):ab;if(f==='directa')return x.s&&x.s.crit==='directa';if(f==='sensible')return ab&&x.cer.length>0;
 if(f.startsWith('g:'))return ab&&x.grp.includes(f.slice(2));if(f==='resuelto')return x.s&&!ab;if(f==='sin')return !x.s;return true;}
function pasaLugar(l){const f=S.filtro;if(f==='riesgo')return l.ndir>0;if(f==='sinlug')return !l.cer.length;if(f.startsWith('g:'))return CATS[l.c].g===f.slice(2);return true;}

  const n=S.vista==='lug'?ls.filter(l=>CATS[l.c].g===k):ab.filter(x=>x.grp.includes(k));if(!n.length)return '';
  const sub=S.vista==='lug'?fmt(n.filter(l=>l.nab).length)+' con grifo con falla cerca':fmt(n.filter(x=>x.s.crit==='directa').length)+' con falla directa';
  return '<button class="pri grp'+(S.filtro==='g:'+k?' on':'')+'" data-f="g:'+k+'"><span class="ic" style="background:'+GRUPOS[k].col+'">'+svgIco(Object.keys(CATS).find(c=>CATS[c].g===k),11)+'</span><span class="k" style="min-width:34px">'+fmt(n.length)+'</span><span class="w"><b>'+GRUPOS[k].nom+'</b> · '+sub+'</span></button>';}).join('')+'</div>';
 const venc=x=>x.s.plazo&&x.s.plazo.estado==='vencido'?1:0;
 const pri=gs.filter(x=>x.s&&x.s.crit==='directa'&&x.s.est==='pendiente').sort((a,b)=>venc(b)-venc(a)||(b.cer.length?1:0)-(a.cer.length?1:0)||b.s.abiertos-a.s.abiertos).slice(0,8);
 h+='<div class="sec"><div class="tt">Prioridad hoy <span class="mini">directa pendiente · plazo SISS 48 h</span></div>'+(pri.length?pri.map(x=>'<button class="pri" data-k="'+esc(x.k)+'"><span class="p"></span><span class="k">'+esc(x.k)+'</span><span class="w">'+(venc(x)?'<b style="color:#FFC3CB">vencido</b> · ':'')+esc(x.cer.length?x.cer[0].o.n+' · '+Math.round(x.cer[0].d)+' m':titulo(x.loc||x.co))+'</span><span class="z">ver</span></button>').join(''):'<div style="color:#9FB3CC;font-size:11.5px">Sin fallas directas pendientes.</div>')+'</div>';
 p.innerHTML=h;
 p.querySelectorAll('.com').forEach(b=>b.onclick=()=>{const c=com[b.dataset.c];map.fitBounds(c.b,{padding:padding(),pitch:50,bearing:-16,duration:2200,maxZoom:14.5});});
 p.querySelectorAll('.pri:not(.grp)').forEach(b=>b.onclick=()=>irAGrifo(b.dataset.k));
 p.querySelectorAll('.pri.grp').forEach(b=>b.onclick=()=>{const f=b.dataset.f;S.filtro=S.filtro===f?'todos':f;aplicarVista();if(S.filtro!=='todos')encuadrarFiltro();});}
function irAGrifo(k){const g=S.geo.grifos.find(x=>x.k===k);if(!g)return;map.flyTo({center:[g.ln,g.la],zoom:17,pitch:58,bearing:-20,duration:2400,essential:true});map.once('moveend',()=>fichaGrifo(k));}

/* ---------- fichas ---------- */
function fichaGrifo(k){
 const g=S.geo.grifos.find(x=>x.k===k);if(!g)return;if(popup)popup.remove();if(tip)tip.remove();
 const s=g.s,c=g.cat,col=!s?COL.sin:COL[s.crit],proc=s&&s.est==='en_proceso';
 let h='<div class="pc">'+esc(g.k)+'</div><div class="pm">'+[titulo(g.co),g.loc?'Sector '+titulo(g.loc):''].filter(Boolean).map(esc).join(' · ')+'</div>';
 h+='<div class="pb"><i style="background:'+col+';color:'+col+'"'+(proc?' class="h"':'')+'></i>'+(!s?'Sin hallazgos registrados':s.abiertos?NOMC[s.crit]+' · '+ESTN[s.est]:'Todo resuelto')+'</div>';
 if(s){h+='<div class="pt">'+s.n+' hallazgo'+(s.n===1?'':'s')+' · '+s.abiertos+' abierto'+(s.abiertos===1?'':'s')+(s.tipos.length?'<br>'+s.tipos.map(esc).join(' · '):'')+'</div>';
  if(s.plazo){const z=s.plazo,d=h2=>h2>=48?Math.round(h2/24)+' d':Math.round(h2)+' h';
   h+='<div class="pz '+z.estado+'">Plazo SISS '+z.txt+(z.estado==='vencido'?' · <b>vencido hace '+d(z.exceso)+'</b>':z.estado==='aviso'?' · abierto hace '+d(z.h)+', revisar magnitud':z.estado==='en_plazo'?' · en plazo ('+d(z.h)+' abierto)':' · sin fecha de registro')+'</div>';}}
 if(c&&(c.mod||c.dia||c.ano))h+='<div class="pt">'+[c.mod,c.dia?'Ø '+c.dia+' mm':'',c.ano?'Instalado '+c.ano:''].filter(Boolean).map(esc).join(' · ')+'</div>';
 if(g.cer.length){h+='<div class="pl">Lugares sensibles a ≤ '+S.radio+' m</div>'+g.cer.slice(0,4).map(x=>'<div class="pli"><span class="ic" style="background:'+colCat(x.o.c)+'">'+svgIco(x.o.c,10)+'</span>'+esc(x.o.n)+'<span>'+Math.round(x.d)+' m</span></div>').join('')+(g.cer.length>4?'<div class="pt">y '+(g.cer.length-4)+' más</div>':'');}
 else h+='<div class="sinl">Sin lugares sensibles a ≤ '+S.radio+' m.</div>';
 h+='<div class="pacc"><button data-a="zoom">Acercar</button><button data-a="sat">Ver satélite</button></div>';
 popup=new maplibregl.Popup({className:'pop',maxWidth:'330px',offset:14}).setLngLat([g.ln,g.la]).setHTML(h).addTo(map);
 popup.getElement().querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{if(b.dataset.a==='zoom')map.flyTo({center:[g.ln,g.la],zoom:18,pitch:60,duration:1800});else{if(!S.sat)toggleSat();map.flyTo({center:[g.ln,g.la],zoom:18.5,pitch:0,duration:1800});}});}
function fichaLugar(i){
 const l=S.geo.lug[i];if(!l)return;if(popup)popup.remove();if(tip)tip.remove();
 const cer=l.cer;
 let h='<div class="pc" style="font-size:14px">'+esc(l.n)+'</div><div class="pm"><span class="ic" style="background:'+colCat(l.c)+';display:inline-flex;width:14px;height:14px;border-radius:4px;align-items:center;justify-content:center;vertical-align:-3px;margin-right:4px">'+svgIco(l.c,9)+'</span>'+esc(CATS[l.c].nom)+'</div>';
 h+='<div class="pb"><i style="background:'+(l.ndir?COL.directa:l.nab?COL.indirecta:cer.length?COL.sin:COL.resuelto)+';color:'+(l.ndir?COL.directa:COL.sin)+'"></i>'+cer.length+' grifo'+(cer.length===1?'':'s')+' a ≤ '+S.radio+' m</div>';
 h+='<div class="pt">'+(l.nab?l.nab+' con falla abierta'+(l.ndir?' · <b style="color:'+COL.directa+'">'+l.ndir+' directa</b>':''):cer.length?'Ninguno con falla abierta':'Puede estar fuera de la zona del parque')+'</div>';
 if(cer.length)h+='<div class="pl">Grifos más cercanos</div>'+cer.slice(0,5).map(x=>{const g=x.o,col=!g.s?COL.sin:COL[g.s.crit];return '<div class="pli"><i class="pd" style="background:'+col+';color:'+col+'"></i>'+esc(g.k)+' <em>'+(!g.s?'sin hallazgos':g.s.abiertos?NOMC[g.s.crit]:'resuelto')+'</em><span>'+Math.round(x.d)+' m</span></div>';}).join('');
 popup=new maplibregl.Popup({className:'pop',maxWidth:'330px',offset:16}).setLngLat([l.ln,l.la]).setHTML(h).addTo(map);}

/* ---------- 3D, satélite, pantalla completa, búsqueda ---------- */
function relieve(on){map.setTerrain(on?{source:'dem',exaggeration:1.35}:null);}
function toggle3D(){S.tres=!S.tres;document.getElementById('b3d').classList.toggle('on',S.tres);
 S.capas.relieve=S.tres;S.capas.edif=S.tres;document.querySelectorAll('input[data-k="cap:relieve"],input[data-k="cap:edif"]').forEach(i=>i.checked=S.tres);
 relieve(S.tres);aplicarVista();map.easeTo({pitch:S.tres?55:0,bearing:S.tres?-14:0,duration:1400});}
function toggleSat(){S.sat=!S.sat;document.getElementById('bsat').classList.toggle('on',S.sat);
 map.getStyle().layers.forEach(l=>{if(l.type==='fill'&&!/^(sect|pobl|radios)/.test(l.id))map.setLayoutProperty(l.id,'visibility',S.sat?'none':'visible');});
 map.setLayoutProperty('sat','visibility',S.sat?'visible':'none');}
function pantalla(){const d=document;if(!d.fullscreenElement)d.documentElement.requestFullscreen&&d.documentElement.requestFullscreen();else d.exitFullscreen();}
function buscar(txt){const k=String(txt||'').trim().toUpperCase();if(!k)return;const g=S.geo.grifos.find(x=>x.k===k)||S.geo.grifos.find(x=>x.k.startsWith(k));
 if(g)irAGrifo(g.k);else aviso('No encontré el grifo "'+esc(k)+'".');}
function aviso(t){const a=document.getElementById('aviso');a.innerHTML=t;a.classList.add('on');clearTimeout(a._t);a._t=setTimeout(()=>a.classList.remove('on'),3500);}

/* ---------- recorrido ---------- */
/* dormir() respeta la pausa (barra espaciadora) */
const dormir=async ms=>{const fin=performance.now()+ms;while(true){await new Promise(r=>setTimeout(r,120));if(S.pausa)continue;if(performance.now()>=fin)return;}};
function volar(o){return new Promise(r=>{map.once('moveend',r);map.flyTo(Object.assign({essential:true},o));});}
function caption(t,b,s){const c=document.getElementById('cap');if(!t){c.classList.remove('on');return;}c.innerHTML='<button class="cx" aria-label="Detener">✕</button><div class="ct">'+t+'</div><div class="cb">'+b+'</div><div class="cs">'+s+'</div><div class="ck">Espacio: pausa · Esc: salir</div>';c.classList.add('on');c.querySelector('.cx').onclick=detenerTour;}
async function tour(){
 if(S.tour){detenerTour();return;}
 const id=S.tour={};S.pausa=false;document.getElementById('btour').classList.add('on');document.body.classList.add('presentando');if(popup)popup.remove();
 const g=S.geo,gs=g.grifos,abierto=x=>x.s&&x.s.abiertos>0;
 const vivo=()=>S.tour===id;
 try{
  const ab=gs.filter(abierto),dir=ab.filter(x=>x.s.crit==='directa'),sen=ab.filter(x=>x.cer.length);
  caption('Parque Grifos Sacyr','Colina · Lampa · Lo Barnechea',fmt(datos.parque)+' grifos · '+fmt(ab.length)+' con falla abierta · '+fmt(dir.length)+' de operatividad directa');
  await volar(Object.assign({pitch:50,bearing:-14,duration:3200},map.cameraForBounds(limitesParque(),{padding:padding()})));if(!vivo())return;await dormir(2600);if(!vivo())return;
  const com={};ab.forEach(x=>{const k=(x.co||'').toUpperCase();if(!k)return;(com[k]=com[k]||{ab:0,dir:0,sen:0,b:new maplibregl.LngLatBounds()});com[k].ab++;if(x.s.crit==='directa')com[k].dir++;if(x.cer.length)com[k].sen++;com[k].b.extend([x.ln,x.la]);});
  for(const k of Object.keys(com).sort((a,b)=>com[b].ab-com[a].ab)){if(!vivo())return;const c=com[k];
   caption('Comuna',titulo(k),c.ab+' grifos con falla abierta · '+c.dir+' directa · '+c.sen+' junto a un lugar sensible');
   const cam=map.cameraForBounds(c.b,{padding:padding(),maxZoom:14});await volar(Object.assign({pitch:55,bearing:-24,duration:3000},cam));if(!vivo())return;await dormir(2800);}
  caption('Lugares sensibles','Colegios, salud, emergencias y cárceles',sen.length+' grifos con falla abierta están a menos de '+S.radio+' m de un lugar sensible');
  const antesV=S.vista;S.vista='lug';aplicarVista();await dormir(2600);if(!vivo())return;S.vista=antesV;aplicarVista();
  const pri=gs.filter(x=>x.s&&x.s.crit==='directa'&&x.s.est==='pendiente').sort((a,b)=>(b.cer.length?1:0)-(a.cer.length?1:0)||b.s.abiertos-a.s.abiertos).slice(0,3);
  for(const x of pri){if(!vivo())return;caption('Prioridad',x.k+' · '+titulo(x.co),(x.s.tipos[0]||'Operatividad directa')+(x.cer.length?' · a '+Math.round(x.cer[0].d)+' m de '+x.cer[0].o.n:''));
   await volar({center:[x.ln,x.la],zoom:17,pitch:60,bearing:-30,duration:3200});if(!vivo())return;fichaGrifo(x.k);await dormir(3200);if(popup)popup.remove();}
  caption('Gestión Sacyr','Centro de control','Recorrido terminado · toca cualquier grifo o lugar para ver su ficha');
  await volar(Object.assign({pitch:S.tres?52:0,bearing:S.tres?-14:0,duration:3200},map.cameraForBounds(limitesParque(),{padding:padding()})));await dormir(2500);
 }finally{if(vivo())detenerTour();}}
function detenerTour(){S.tour=null;S.pausa=false;document.getElementById('btour').classList.remove('on');document.body.classList.remove('presentando','pausa');caption(null);map.stop();}
function pausarTour(){if(!S.tour)return;S.pausa=!S.pausa;document.body.classList.toggle('pausa',S.pausa);}

/* ---------- carga ---------- */
const CLAVE='ccCache.v2';
function procesar(h,c){
 const LEG={inmediato:'directa',corto:'indirecta',mediano:'senaletica'};const hall=[];
 h.forEach(d=>{const x=d.data();const det=Array.isArray(x.hallazgos_detalle)?x.hallazgos_detalle:[];
  if(!det.length&&!x.tipo_hallazgo)return;if(typeof x.lat!=='number'||typeof x.lng!=='number')return;
  let cr=LEG[x.prioridad]||x.prioridad||'senaletica';if(det.length&&det.every(d2=>/pintura/i.test(d2.tipo_hallazgo||'')))cr='senaletica';
  const t=det.length?det.map(d2=>d2&&d2.tipo_hallazgo).filter(Boolean).map(String):(x.tipo_hallazgo?[String(x.tipo_hallazgo)]:[]);
  const fc=x.fecha_creacion&&x.fecha_creacion.toDate?x.fecha_creacion.toDate().toISOString():(x.fecha_creacion||null);
  hall.push({id:d.id,c:(x.codigo_grifo||'').toUpperCase(),co:x.comuna||'',cr,e:x.estado||'pendiente',la:x.lat,ln:x.lng,t,f:fc});});
 const grifos=[];c.forEach(d=>{const x=d.data();if(typeof x.lat==='number'&&typeof x.lng==='number')grifos.push({k:String(x.codigo||d.id).toUpperCase(),la:x.lat,ln:x.lng,co:x.comuna||'',loc:x.localidad||'',mod:x.modelo||'',dia:x.diametro_conexion||'',ano:x.ano_instalacion||''});});
 return{hall,parque:c.size,grifos};}
function estado(t){document.getElementById('estado').textContent=t;}
function iniciar(desdeCache){
 document.getElementById('cst').textContent='Preparando el mapa…';
 S.geo=construirGeo();capasBase();panelIzq();aplicarVista();
 estado(desdeCache?'Datos guardados · actualizando con el catastro…':'Catastro al día · '+new Date().toLocaleString('es-CL',{dateStyle:'medium',timeStyle:'short'}));
 document.getElementById('carga').classList.add('off');S.listo=true;
 /* entrada cinematográfica */
 if(MODO_TABLERO&&S.comuna!=='todos'){const b=new maplibregl.LngLatBounds();S.geo.grifos.forEach(g=>{if(g.co===S.comuna)b.extend([g.ln,g.la]);});if(!b.isEmpty()){map.fitBounds(b,{padding:padding(),duration:2600,maxZoom:14.5});return;}}
 const cam=map.cameraForBounds(limitesParque(),{padding:padding()});
 map.flyTo(Object.assign({pitch:0,bearing:0,duration:MODO_TABLERO?2600:3400,essential:true},cam));
}
async function cargar(){
 const pCapas=fetch('capas-mapa.json').then(r=>r.ok?r.json():null).catch(()=>null);
 const pMapa=crearMapa();
 let guardado=null,txtGuardado='';try{guardado=JSON.parse(localStorage.getItem(CLAVE)||'null');if(guardado&&guardado.datos)txtGuardado=JSON.stringify(guardado.datos);}catch(e){guardado=null;}
 const fijarCapas=j=>{datos.capas=j||{comunas:[],sect:[],places:[],lug:[]};datos.capas.lug=(datos.capas.lug||[]).filter(l=>CATS[l.c]);};
 let dibujado=false;
 const pFire=new Promise((res,rej)=>{try{
   firebase.initializeApp({apiKey:"AIzaSyApa-zy4sV8iM1-MNgtIvRcev9j8CAve10",authDomain:"hallazgos-grifos-app.firebaseapp.com",projectId:"hallazgos-grifos-app",storageBucket:"hallazgos-grifos-app.firebasestorage.app",messagingSenderId:"156705018338",appId:"1:156705018338:web:9c35d7983923aaa123e9bb"});
   const db=firebase.firestore();Promise.all([db.collection('hallazgos').get(),db.collection('catalogo_grifos').get()]).then(([h,c])=>res(procesar(h,c))).catch(rej);
  }catch(e){rej(e);}});
 if(guardado&&guardado.datos&&Array.isArray(guardado.datos.hall)){
  datos=guardado.datos;const j=await pCapas;fijarCapas(j);await pMapa;iniciar(true);dibujado=true;}
 try{const nuevo=await pFire;const txt=JSON.stringify(nuevo);try{localStorage.setItem(CLAVE,JSON.stringify({t:Date.now(),datos:nuevo}));}catch(e){}
  if(!dibujado){datos=nuevo;const j=await pCapas;fijarCapas(j);await pMapa;iniciar(false);dibujado=true;}
  else if(txtGuardado!==txt){nuevo.capas=datos.capas;datos=nuevo;recalcular();estado('Catastro al día · '+new Date().toLocaleString('es-CL',{dateStyle:'medium',timeStyle:'short'}));}
  else estado('Catastro al día · '+new Date().toLocaleString('es-CL',{dateStyle:'medium',timeStyle:'short'}));
 }catch(e){if(dibujado)estado('Sin conexión al catastro · mostrando datos guardados');else{document.getElementById('cst').textContent='No se pudo leer el catastro: '+e.message;}}
}
/* Modo tablero: la página vive dentro del tablero (iframe). Se ocultan la marca y el
   panel derecho (el tablero ya los tiene) y se obedecen los mensajes del tablero:
   sector/comuna, ir a un grifo, aplicar un filtro. */
function modoTablero(){
 if(!MODO_TABLERO)return;document.body.classList.add('tablero');
 const c=PARAMS.get('sector');if(c&&c!=='todos')S.comuna=c.toUpperCase();
 window.addEventListener('message',e=>{if(e.origin!==location.origin)return;const m=e.data||{};if(!S.listo)return;
  if(m.accion==='sector'){S.comuna=(m.comuna&&m.comuna!=='todos')?String(m.comuna).toUpperCase():'todos';S.filtro='todos';aplicarVista();encuadrarComuna();}
  if(m.accion==='grifo'&&m.codigo)irAGrifo(String(m.codigo).toUpperCase());
  if(m.accion==='filtro'&&m.filtro){S.filtro=m.filtro;aplicarVista();encuadrarFiltro();}});}
function encuadrarComuna(){if(S.comuna==='todos'){encuadrar(true);return;}const b=new maplibregl.LngLatBounds();let n=0;S.geo.grifos.forEach(g=>{if(g.co===S.comuna){b.extend([g.ln,g.la]);n++;}});if(n)map.fitBounds(b,{padding:padding(),duration:1600,maxZoom:14.5,pitch:S.tres?50:0});}
function enlazar(){modoTablero();
 document.getElementById('b3d').onclick=toggle3D;document.getElementById('bsat').onclick=toggleSat;document.getElementById('btour').onclick=tour;document.getElementById('bfull').onclick=pantalla;
 document.getElementById('bmov').onclick=()=>document.getElementById('pizq').classList.toggle('on');
 const b=document.getElementById('busca');b.onkeydown=e=>{if(e.key==='Enter'){buscar(b.value);b.blur();}};
 document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.tour)detenerTour();if(popup)popup.remove();}
  if(e.key===' '&&S.tour&&document.activeElement.tagName!=='INPUT'){e.preventDefault();pausarTour();}});
 window.addEventListener('resize',()=>{if(map)map.resize();});}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>{enlazar();cargar();});else{enlazar();cargar();}
</script></body></html>
