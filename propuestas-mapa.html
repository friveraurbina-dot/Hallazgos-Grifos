<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Propuestas de mapa — Tablero ejecutivo Gestión Sacyr</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#002359;--paper:#fff;--bg:#EDF3F8;--line:#D6E2EC;--text:#0E2142;--soft:#5A6F8C;--accent:#01B3D7;
 --directa:#C8334D;--indirecta:#D9660A;--senal:#8A6D00;--ok:#2F9E78;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
header{background:linear-gradient(110deg,#001640,#002359 45%,#00507f);color:#fff;padding:18px 24px 16px;box-shadow:0 6px 20px rgba(0,35,89,.25)}
header .eyebrow{font:700 10.5px Montserrat,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#63D1E0}
header h1{margin:5px 0 2px;font:800 23px Montserrat,sans-serif;letter-spacing:-.01em}
header p{margin:0;font-size:12.5px;color:rgba(255,255,255,.75)}
.wrap{max-width:1500px;margin:0 auto;padding:16px 16px 40px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 12px}
.tab{all:unset;cursor:pointer;padding:9px 14px;border:1.5px solid var(--line);border-radius:11px;background:#fff;font:600 12.5px Inter,sans-serif;color:var(--soft);display:flex;gap:8px;align-items:center}
.tab b{font:800 12px Montserrat,sans-serif;color:var(--ink)}
.tab:hover{border-color:var(--accent)}
.tab.on{border-color:var(--accent);background:#E9F6FB;color:var(--ink);box-shadow:inset 2px 0 0 var(--accent)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(0,35,89,.06)}
.card-head{padding:13px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.card-head h2{margin:0;font:700 15px Montserrat,sans-serif;color:var(--ink)}
.card-head .resp{font-size:12px;color:var(--soft);margin-top:3px;max-width:760px;line-height:1.5}
.pros{display:flex;gap:18px;flex-wrap:wrap;font-size:11.5px}
.pros div{max-width:260px}.pros b{display:block;font:700 10px Montserrat,sans-serif;letter-spacing:.09em;text-transform:uppercase;margin-bottom:3px}
.pros .si b{color:var(--ok)}.pros .no b{color:var(--directa)}
#mapa{height:min(68vh,720px);background:#dfeaf2;position:relative}
.leyenda{position:absolute;left:12px;bottom:12px;z-index:800;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:600 11.5px Inter,sans-serif;line-height:1.75;box-shadow:0 4px 14px rgba(0,35,89,.18);max-width:320px}
.leyenda.osc{background:rgba(5,16,40,.92);border-color:rgba(255,255,255,.18);color:#E6EDF7}
.leyenda i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:1.5px solid #17233B}
.leyenda .tt{font:800 10.5px Montserrat,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--ink);display:block;margin-bottom:3px}
.leyenda.osc .tt{color:#8FD6E8}
/* Al acercar más allá del nivel 16 la base gris de Esri no tiene datos en Chile:
   desde el 17 se cambia a la base de calles teñida, para que nunca aparezca
   "Map data not yet available". */
.det-gris{filter:grayscale(1) contrast(.82) brightness(1.07)}
.det-osc{filter:grayscale(1) invert(1) brightness(.78) contrast(.92)}
.kpis{display:none;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:10px;padding:12px 18px;border-bottom:1px solid var(--line);background:#F7FAFD}
.kpis.on{display:grid}
@media(max-width:600px){.kpis{grid-template-columns:1fr 1fr;padding:10px 12px;gap:8px}.kpi .n{font-size:20px}.kpi .l{font-size:11px}}
.kpi{all:unset;box-sizing:border-box;cursor:pointer;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px 10px;display:flex;flex-direction:column;gap:3px;transition:border-color .15s,box-shadow .15s}
.kpi:hover{border-color:var(--accent)}
.kpi.on{border-color:var(--ink);box-shadow:inset 3px 0 0 var(--accent),0 3px 10px rgba(0,35,89,.10)}
.kpi:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kpi .n{font:800 24px Montserrat,sans-serif;color:var(--ink);line-height:1.05}
.kpi .l{font:600 11.5px Inter,sans-serif;color:var(--text);display:flex;align-items:center;gap:6px}
.kpi .s{font:500 11px Inter,sans-serif;color:var(--soft);display:flex;align-items:center;gap:5px}
.kpi .dot{display:inline-block;width:11px;height:11px;border-radius:3px;border:2.5px solid;flex:none}
.kpi .rd{display:inline-block;width:8px;height:8px;border-radius:50%;background:#C8334D;flex:none}
.kpis .ayuda{grid-column:1/-1;font:500 11px Inter,sans-serif;color:var(--soft);margin-top:-2px}
.gcod{font:700 10px Inter,sans-serif;color:#0E2142;letter-spacing:.02em;white-space:nowrap;text-shadow:0 1px 2px #fff,0 0 5px #fff,0 0 5px #fff}
#mapa:not(.cerca) .gcod{display:none}
.popA .leaflet-popup-content-wrapper{border-radius:12px;box-shadow:0 8px 24px rgba(0,35,89,.22)}
.popA .leaflet-popup-content{margin:12px 15px;font:500 12px Inter,sans-serif;color:var(--text);min-width:210px}
.pop .pc{font:800 16px Montserrat,sans-serif;color:var(--ink)}
.pop .pm{color:var(--soft);font-size:11.5px;margin:2px 0 9px}
.pop .pb{font-weight:700;display:flex;align-items:center;gap:7px}
.pop .pb i{width:11px;height:11px;border-radius:50%;flex:none;border:2px solid}
.pop .pt{margin-top:5px;color:var(--soft);font-size:11.5px;line-height:1.45}
.pop .pl{margin-top:10px;padding-top:8px;border-top:1px solid var(--line);font:700 9.5px Montserrat,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--soft)}
.pop .pli{margin-top:5px;display:flex;gap:7px;align-items:center}
.pop .pli s{width:10px;height:10px;border:2.5px solid;border-radius:2px;flex:none;box-sizing:border-box}
.pop .pli span{margin-left:auto;padding-left:8px;color:var(--soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.pop .sin{margin-top:10px;padding-top:8px;border-top:1px solid var(--line);color:var(--soft);font-size:11.5px}
.ctrl{position:absolute;right:12px;top:12px;z-index:800;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font:600 11.5px Inter,sans-serif;box-shadow:0 4px 14px rgba(0,35,89,.18)}
.ctrl label{display:flex;gap:7px;align-items:center;cursor:pointer;color:var(--text)}
.lug{border-radius:3px;background:rgba(255,255,255,.30);opacity:.8;box-shadow:0 0 0 .8px rgba(255,255,255,.75)}
.lugnom{font:700 9.5px Montserrat,sans-serif;color:#1F3B5C;text-shadow:0 1px 2px #fff,0 0 6px #fff,0 0 6px #fff;white-space:nowrap}
#mapa.lejos .lugnom{display:none}
.leyenda s{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-2px;background:transparent}
.leyenda .hueco{background:#fff !important}
.cargando{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(237,243,248,.92);z-index:900;font:600 13px Inter,sans-serif;color:var(--soft)}
table.cmp{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
table.cmp th,table.cmp td{padding:9px 11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.cmp th{font:700 10px Montserrat,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:var(--soft);background:#F7FAFD}
table.cmp td b{color:var(--ink)}
.rec{background:#E9F7F1;border:1px solid #9BD9C2;border-radius:12px;padding:13px 16px;margin-top:18px;font-size:13px;line-height:1.6}
.rec b{font:700 11px Montserrat,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#1F7A5C;display:block;margin-bottom:5px}
</style></head><body>
<header>
  <div class="eyebrow">Gestión Sacyr · Parque Grifos Sacyr</div>
  <h1>Propuestas de mapa para el tablero ejecutivo</h1>
  <p id="sub">Cargando datos reales del catastro…</p>
</header>
<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div class="card">
    <div class="card-head">
      <div><h2 id="tt">—</h2><div class="resp" id="resp"></div></div>
      <div class="pros"><div class="si"><b>A favor</b><span id="si"></span></div><div class="no"><b>En contra</b><span id="no"></span></div></div>
    </div>
    <div class="kpis" id="kpis"></div>
    <div id="mapa"><div class="cargando" id="cargando">Cargando mapa…</div></div>
  </div>
  <table class="cmp"><thead><tr><th>Opción</th><th>Qué responde de un vistazo</th><th>Para quién</th></tr></thead><tbody id="cmp"></tbody></table>
  <div class="rec"><b>Recomendación</b><span id="recomendacion"></span></div>
</div>
<script>
const E='https://server.arcgisonline.com/ArcGIS/rest/services/';
const BASES={
 gris:[E+'Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',E+'Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}'],
 oscuro:[E+'Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',E+'Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}'],
 calle:[E+'World_Street_Map/MapServer/tile/{z}/{y}/{x}',null],
 satelite:[E+'World_Imagery/MapServer/tile/{z}/{y}/{x}',E+'Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}']};
const C={directa:'#C8334D',indirecta:'#D9660A',senaletica:'#8A6D00'};
const CB={directa:'#FF5A6E',indirecta:'#FF9A3C',senaletica:'#FFD83D'};
const ORD=['directa','indirecta','senaletica'];
const TIPOS={educacion:{nom:'Colegio / jardín',col:'#3E6E9E',kpi:'Junto a colegio o jardín'},
 salud:{nom:'Salud',col:'#2F9E78',kpi:'Junto a centro de salud'},
 municipal:{nom:'Municipal',col:'#6B5B95',kpi:'Junto a edificio municipal'},
 carcel:{nom:'Cárcel',col:'#4A4A52',kpi:'Junto a cárcel'}};
const NOMC={directa:'Operatividad directa',indirecta:'Operatividad indirecta',senaletica:'Señalética'};
const ESTN={pendiente:'Pendiente',en_proceso:'En proceso',resuelto:'Todo resuelto'};
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let filtroA='todos';
let map,capas=[],datos=null,capaDatos=null,capaLugares=null,leyendaEl=null,ctrlEl=null;

function base(n){capas.forEach(c=>map.removeLayer(c));capas=[];
 const add=(u,o)=>{const l=L.tileLayer(u,Object.assign({attribution:'© Esri'},o));l.addTo(map);capas.push(l);};
 const [b,r]=BASES[n];
 if(n==='gris'||n==='oscuro'){
   add(b,{maxNativeZoom:16,maxZoom:16});
   add(E+'World_Street_Map/MapServer/tile/{z}/{y}/{x}',{minZoom:17,maxZoom:19,className:n==='gris'?'det-gris':'det-osc'});
   if(r) add(r,{maxNativeZoom:16,maxZoom:16});
 }else{ add(b,{maxZoom:19}); if(r) add(r,{maxZoom:19}); }
}
function limpiar(){map.closePopup();[capaDatos,capaLugares].forEach(c=>{if(c)map.removeLayer(c);});capaDatos=null;capaLugares=null;
 const k=document.getElementById('kpis');k.classList.remove('on');k.innerHTML='';
 if(leyendaEl){leyendaEl.remove();leyendaEl=null;}if(ctrlEl){ctrlEl.remove();ctrlEl=null;}}

/* Capa de lugares sensibles: sale del propio catastro (zona_prioritaria_lugares).
   Los colegios son 113, así que van sólo con tooltip; salud, municipal y cárcel
   llevan el nombre siempre visible porque son pocos y son los que se nombran en reunión. */
function lugares(tipo){
  const g=L.layerGroup();
  (datos.lug||[]).filter(p=>!tipo||p.tipo===tipo).forEach(p=>{const t=TIPOS[p.tipo]||{nom:p.tipo,col:'#5A6F8C'};
    const pocos=p.tipo!=='educacion',lado=pocos?19:16;
    L.marker([p.lat,p.lng],{pane:'lugares',icon:L.divIcon({className:'',iconSize:[lado,lado],iconAnchor:[lado/2,lado/2],
      html:'<div class="lug" style="width:'+lado+'px;height:'+lado+'px;border:'+(pocos?2.5:2)+'px solid '+t.col+'"></div>'})})
     .bindTooltip('<b>'+esc(p.nombre)+'</b><br>'+t.nom,{direction:'top'}).addTo(g);
    if(pocos) L.marker([p.lat,p.lng],{interactive:false,icon:L.divIcon({className:'',iconSize:[1,1],iconAnchor:[-8,6],
      html:'<div class="lugnom">'+esc(p.nombre)+'</div>'})}).addTo(g);});
  return g;
}
function toggleLugares(){
  ctrlEl=document.createElement('div');ctrlEl.className='ctrl';
  ctrlEl.innerHTML='<label><input type="checkbox" id="chkLug" checked> Lugares sensibles ('+(datos.lug||[]).length+')</label>';
  document.getElementById('mapa').appendChild(ctrlEl);
  ctrlEl.querySelector('#chkLug').onchange=e=>{if(!capaLugares)return;
    e.target.checked?capaLugares.addTo(map):map.removeLayer(capaLugares);};
}
function leyenda(html,osc){leyendaEl=document.createElement('div');leyendaEl.className='leyenda'+(osc?' osc':'');leyendaEl.innerHTML=html;document.getElementById('mapa').appendChild(leyendaEl);}
function porGrifo(){const g={};datos.hall.forEach(h=>{(g[h.c||h.id]=g[h.c||h.id]||[]).push(h);});return g;}
function peorDe(rs){const ab=rs.filter(x=>x.e!=='resuelto');const b=ab.length?ab:rs;let p='senaletica';b.forEach(x=>{if(ORD.indexOf(x.cr)<ORD.indexOf(p))p=x.cr;});const est=ab.length?(ab.some(x=>x.e!=='en_proceso')?'pendiente':'en_proceso'):'resuelto';
 return{crit:p,est:est,resuelto:ab.length===0,abiertos:ab.length,n:rs.length};}
function encuadrar(){const pts=datos.hall.map(h=>[h.la,h.ln]);map.fitBounds(L.latLngBounds(pts),{padding:[28,28]});}

/* ---------- Opción A: tarjetas, filtro y ficha ---------- */
function infoGrifo(k){return (datos.cat||{})[k]||null;}
function tiposCerca(k){const c=infoGrifo(k);return c?[...new Set(c.lug.map(l=>l.tipo))]:[];}
function pasaA(k,s){
  if(filtroA==='todos')return true;
  if(s.resuelto)return false;
  const ts=tiposCerca(k);
  if(filtroA==='sensible')return ts.length>0;
  if(filtroA.startsWith('t:'))return ts.includes(filtroA.slice(2));
  return true;}
function popGrifo(k,rs,s){
  const c=infoGrifo(k),ab=rs.filter(x=>x.e!=='resuelto');
  const tipos=[...new Set(ab.flatMap(x=>x.t||[]))].slice(0,4);
  const col=s.resuelto?'#8FA3B8':C[s.crit],proc=s.est==='en_proceso';
  let h='<div class="pop"><div class="pc">'+esc(k)+'</div>'
   +'<div class="pm">'+esc((c&&c.co)||rs[0].co||'')+' · '+s.n+' hallazgo'+(s.n===1?'':'s')+' · '+s.abiertos+' abierto'+(s.abiertos===1?'':'s')+'</div>'
   +'<div class="pb"><i style="background:'+(proc?'#fff':col)+';border-color:'+col+'"></i>'+(s.resuelto?'Todo resuelto':NOMC[s.crit]+' · '+ESTN[s.est])+'</div>';
  if(tipos.length)h+='<div class="pt">'+tipos.map(esc).join(' · ')+'</div>';
  if(c&&c.lug.length){
    h+='<div class="pl">Lugares sensibles cercanos</div>'+c.lug.slice().sort((a,b)=>a.d-b.d).slice(0,3).map(l=>
      '<div class="pli"><s style="border-color:'+((TIPOS[l.tipo]||{}).col||'#5A6F8C')+'"></s>'+esc(l.nombre)+'<span>'+Math.round(l.d)+' m</span></div>').join('');
  }else if(c){h+='<div class="sin">Sin lugares sensibles registrados cerca.</div>';}
  return h+'</div>';}
function pintarA(fit){
  map.closePopup();
  if(capaDatos)map.removeLayer(capaDatos);if(capaLugares)map.removeLayer(capaLugares);
  const g=L.layerGroup(),pg=porGrifo(),pts=[];
  Object.keys(pg).forEach(k=>{const rs=pg[k],s=peorDe(rs),r=rs[0];
   if(!pasaA(k,s))return;
   const sen=s.crit==='senaletica',col=s.resuelto?'#8FA3B8':C[s.crit],proc=s.est==='en_proceso';
   L.circleMarker([r.la,r.ln],{radius:sen?5:7.5,color:col,weight:proc?3:1.6,
     fillColor:proc?'#FFFFFF':(s.resuelto?'#D7E0EA':col),fillOpacity:s.resuelto&&!proc?.75:1})
    .bindTooltip('<b>'+esc(k)+'</b> · '+(s.resuelto?'Todo resuelto':NOMC[s.crit]),{direction:'top',offset:[0,-4]})
    .bindPopup(popGrifo(k,rs,s),{maxWidth:300,className:'popA',autoPanPaddingTopLeft:[60,40],autoPanPaddingBottomRight:[60,30]}).addTo(g);
   L.marker([r.la,r.ln],{interactive:false,icon:L.divIcon({className:'',iconSize:[1,1],iconAnchor:[-10,6],
     html:'<div class="gcod">'+esc(k)+'</div>'})}).addTo(g);
   pts.push([r.la,r.ln]);});
  g.addTo(map);capaDatos=g;
  if((datos.lug||[]).length){
    const tipo=filtroA.startsWith('t:')?filtroA.slice(2):null;
    capaLugares=lugares(tipo);
    const chk=document.getElementById('chkLug');if(!chk||chk.checked)capaLugares.addTo(map);}
  if(fit){pts.length?map.fitBounds(L.latLngBounds(pts),{padding:[50,50],maxZoom:15}):encuadrar();}
}
function kpisA(){
  const el=document.getElementById('kpis'),pg=porGrifo();
  let ab=0,res=0,sen=0,senDir=0;const pt={};Object.keys(TIPOS).forEach(t=>pt[t]={n:0,d:0});
  Object.keys(pg).forEach(k=>{const s=peorDe(pg[k]);if(s.resuelto){res++;return;}ab++;
    const ts=tiposCerca(k);if(ts.length){sen++;if(s.crit==='directa')senDir++;}
    ts.forEach(t=>{if(pt[t]){pt[t].n++;if(s.crit==='directa')pt[t].d++;}});});
  const dir=d=>d?'<i class="rd"></i>'+d+' con falla directa':'Sin falla directa';
  const card=(id,n,l,sub,col)=>'<button class="kpi'+(filtroA===id?' on':'')+'" data-f="'+id+'" aria-pressed="'+(filtroA===id)+'">'
    +'<span class="n">'+n+'</span><span class="l">'+(col?'<span class="dot" style="border-color:'+col+'"></span>':'')+l+'</span><span class="s">'+sub+'</span></button>';
  const hayCat=Object.keys(datos.cat||{}).length>0;
  el.innerHTML=card('todos',ab,'Grifos con falla abierta',res+' ya resueltos (en gris)')
   +(hayCat?card('sensible',sen,'Junto a un lugar sensible',dir(senDir))
     +Object.keys(TIPOS).filter(t=>pt[t].n).map(t=>card('t:'+t,pt[t].n,TIPOS[t].kpi,dir(pt[t].d),TIPOS[t].col)).join(''):'')
   +'<div class="ayuda">Toca una tarjeta para ver sólo esos grifos; tócala de nuevo para volver a todos. Cada punto abre la ficha del grifo.</div>';
  el.classList.add('on');
  el.querySelectorAll('.kpi').forEach(b=>b.onclick=()=>{
    const f=b.dataset.f;filtroA=(filtroA===f&&f!=='todos')?'todos':f;
    el.querySelectorAll('.kpi').forEach(x=>{const on=x.dataset.f===filtroA;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on);});
    pintarA(true);});
}

const OPCIONES=[
{id:'A',nom:'Mapa gris con lugares sensibles',
 resp:'Base gris y silenciosa. El color del punto es la criticidad del hallazgo abierto más grave y el relleno separa lo pendiente de lo que ya está en proceso. Los marcos son los colegios, centros de salud, edificios municipales y cárceles registrados en el catastro. Las tarjetas de arriba filtran el mapa; cada grifo abre su ficha.',
 si:'Responde la pregunta que hace la plana ejecutiva: cuántos grifos con falla están junto a un colegio, un centro de salud o una cárcel, y cuáles son. Base neutra, se imprime y se proyecta bien.',
 no:'Al zoom de resumen los puntos de Chicureo y Lampa se superponen; se resuelve con las tarjetas o acercando el mapa.',
 ve:'Qué grifos fallan y junto a qué lugar sensible',para:'Plana ejecutiva y jefatura operativa',
 dibuja(){base('gris');
  if((datos.lug||[]).length)toggleLugares();
  kpisA();pintarA(false);
  const pt=(c,h)=>'<i style="background:'+(h?'#fff':c)+';border-color:'+c+';border-width:'+(h?2:1.5)+'px"></i>';
  leyenda('<span class="tt">A · Grifos y lugares sensibles</span>'
   +pt(C.directa)+'Directa &nbsp;'+pt(C.indirecta)+'Indirecta &nbsp;'+pt(C.senaletica)+'Señalética<br>'
   +pt(C.directa,1)+'Relleno blanco = ya en proceso &nbsp;'+pt('#8FA3B8')+'Todo resuelto'
   +'<div style="margin-top:5px;border-top:1px solid #D6E2EC;padding-top:5px">'
   +Object.keys(TIPOS).map(t=>'<s style="border:2.5px solid '+TIPOS[t].col+'"></s>'+TIPOS[t].nom).join(' &nbsp;')+'</div>');}},

{id:'B',nom:'Mapa oscuro corporativo',
 resp:'La misma lectura por punto, pero sobre base oscura en la línea del tablero. Los colores encendidos resaltan y la ciudad queda en segundo plano.',
 si:'Combina con la portada azul del tablero. Máximo contraste del dato en pantalla y en proyector.',
 no:'En impresión en blanco y negro pierde; gasta mucha tinta si se imprime en color.',
 ve:'Dónde está cada grifo con problema',para:'Presentación en pantalla',
 dibuja(){base('oscuro');const g=L.layerGroup(),pg=porGrifo();
  Object.keys(pg).forEach(k=>{const rs=pg[k],s=peorDe(rs),r=rs[0],sen=s.crit==='senaletica';
   L.circleMarker([r.la,r.ln],{radius:sen?4:6.5,color:s.resuelto?'#64748B':'#0B1220',weight:1.4,
    fillColor:s.resuelto?'#475569':CB[s.crit],fillOpacity:s.resuelto?.6:.96})
    .bindTooltip('<b>'+k+'</b><br>'+s.n+' hallazgo(s) · '+s.abiertos+' abierto(s)',{direction:'top'}).addTo(g);});
  g.addTo(map);capaDatos=g;
  leyenda('<span class="tt">B · Mapa oscuro corporativo</span><i style="background:'+CB.directa+';border-color:#0B1220"></i>Directa &nbsp;<i style="background:'+CB.indirecta+';border-color:#0B1220"></i>Indirecta<br><i style="background:'+CB.senaletica+';border-color:#0B1220;width:7px;height:7px"></i>Señalética &nbsp;<i style="background:#475569;border-color:#64748B"></i>Todo resuelto',true);}},

{id:'C',nom:'Burbujas por comuna',
 resp:'Una burbuja por comuna. El tamaño es proporcional a los hallazgos abiertos (por área, no por radio) y el borde muestra cuántos son de operatividad directa.',
 si:'Responde en dos segundos dónde se concentra el problema. Nada se superpone. Funciona en una lámina.',
 no:'No sirve para ubicar un grifo puntual: es una vista de resumen, no de terreno.',
 ve:'En qué comuna se concentra el problema',para:'Plana ejecutiva',
 dibuja(){base('gris');const g=L.layerGroup(),com={};
  datos.hall.forEach(h=>{const k=h.co||'Sin comuna';const e=com[k]=com[k]||{n:0,ab:0,dir:0,la:0,ln:0};e.n++;e.la+=h.la;e.ln+=h.ln;
   if(h.e!=='resuelto'){e.ab++;if(h.cr==='directa')e.dir++;}});
  const maxAb=Math.max(...Object.values(com).map(c=>c.ab));
  Object.keys(com).forEach(k=>{const c=com[k];const r=20+44*Math.sqrt(c.ab/maxAb);
   L.circleMarker([c.la/c.n,c.ln/c.n],{radius:r,color:'#C8334D',weight:Math.max(2,Math.round(2+6*(c.dir/Math.max(c.ab,1)))),
     fillColor:'#01B3D7',fillOpacity:.32}).addTo(g);
   L.marker([c.la/c.n,c.ln/c.n],{interactive:false,icon:L.divIcon({className:'',iconSize:[150,46],iconAnchor:[75,23],
     html:'<div style="text-align:center;width:150px;font-family:Montserrat,sans-serif"><div style="font:800 24px Montserrat;color:#002359;text-shadow:0 1px 3px #fff,0 0 8px #fff">'+c.ab+'</div><div style="font:700 10.5px Montserrat;letter-spacing:.07em;color:#002359;text-shadow:0 1px 3px #fff,0 0 8px #fff">'+k+'</div><div style="font:600 10px Inter;color:#C8334D;text-shadow:0 1px 3px #fff,0 0 8px #fff">'+c.dir+' directa</div></div>'})}).addTo(g);});
  g.addTo(map);capaDatos=g;
  leyenda('<span class="tt">C · Burbujas por comuna</span>Tamaño = hallazgos abiertos (área proporcional)<br>Grosor del borde rojo = peso de la operatividad directa');}},

{id:'D',nom:'Concentración (mapa de calor)',
 resp:'Mancha de calor con los hallazgos abiertos. No muestra grifos uno a uno: muestra dónde se acumulan.',
 si:'Deja ver corredores y focos que con puntos sueltos no se notan. Muy claro en proyector.',
 no:'No permite contar ni identificar grifos. La intensidad depende del zoom, así que engaña si se compara entre vistas.',
 ve:'Dónde se acumulan los hallazgos',para:'Plana ejecutiva',
 dibuja(){base('gris');const g=L.layerGroup();
  const ab=datos.hall.filter(h=>h.e!=='resuelto');
  const paso=.004,cel={};
  ab.forEach(h=>{const k=Math.round(h.la/paso)+'|'+Math.round(h.ln/paso);(cel[k]=cel[k]||{n:0,la:0,ln:0,d:0});cel[k].n++;cel[k].la+=h.la;cel[k].ln+=h.ln;if(h.cr==='directa')cel[k].d++;});
  const mx=Math.max(...Object.values(cel).map(c=>c.n));
  const esc=[[0,'#FFE9B8'],[.25,'#FFC35A'],[.5,'#F08A22'],[.75,'#D6452F'],[1,'#8E1B2E']];
  const color=t=>{for(let i=esc.length-1;i>=0;i--)if(t>=esc[i][0])return esc[i][1];return esc[0][1];};
  Object.values(cel).sort((a,b)=>a.n-b.n).forEach(c=>{const t=c.n/mx;
   L.circleMarker([c.la/c.n,c.ln/c.n],{radius:9+26*Math.sqrt(t),color:'transparent',weight:0,fillColor:color(t),fillOpacity:.52})
    .bindTooltip(c.n+' hallazgos abiertos aquí',{direction:'top'}).addTo(g);});
  g.addTo(map);capaDatos=g;
  leyenda('<span class="tt">D · Concentración de hallazgos abiertos</span>'+esc.map(e=>'<i style="background:'+e[1]+';border:none"></i>').join('')+' de menos a más<br><span style="font-weight:500;color:#5A6F8C">Celdas de ~400 m · '+Object.keys(cel).length+' focos</span>');}},

{id:'E',nom:'Satélite (el actual)',
 resp:'Lo que hay hoy en el tablero: imagen satelital con un pin por grifo.',
 si:'Da contexto físico real: se ve el terreno, el camino y el entorno del grifo.',
 no:'La imagen compite con el dato. En una reunión cuesta leer dónde está el problema; los pines se pierden sobre el terreno.',
 ve:'Cómo es el entorno de cada grifo',para:'Revisión en terreno',
 dibuja(){base('satelite');const g=L.layerGroup(),pg=porGrifo();
  Object.keys(pg).forEach(k=>{const rs=pg[k],s=peorDe(rs),r=rs[0];
   L.circleMarker([r.la,r.ln],{radius:7,color:'#fff',weight:2,fillColor:s.resuelto?'#9FB0C6':CB[s.crit],fillOpacity:1})
    .bindTooltip('<b>'+k+'</b>',{direction:'top'}).addTo(g);});
  g.addTo(map);capaDatos=g;
  leyenda('<span class="tt">E · Satélite (el actual)</span><i style="background:'+CB.directa+';border-color:#fff"></i>Directa &nbsp;<i style="background:'+CB.indirecta+';border-color:#fff"></i>Indirecta &nbsp;<i style="background:'+CB.senaletica+';border-color:#fff"></i>Señalética');}}
];

function pintar(id){
  const o=OPCIONES.find(x=>x.id===id);
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.id===id));
  document.getElementById('tt').textContent=o.id+' · '+o.nom;
  document.getElementById('resp').textContent=o.resp;
  document.getElementById('si').textContent=o.si;
  document.getElementById('no').textContent=o.no;
  limpiar();o.dibuja();
  try{localStorage.setItem('propMapa',id);}catch(e){}
}
function arrancar(){
  document.getElementById('cargando').remove();
  const ab=datos.hall.filter(h=>h.e!=='resuelto').length;
  const sen=datos.hall.filter(h=>h.cr==='senaletica').length;
  document.getElementById('sub').textContent=datos.hall.length+' hallazgos con coordenada · '+ab+' abiertos · '+sen+' de señalética · '+datos.parque+' grifos en el parque · '+(datos.lug||[]).length+' lugares sensibles · datos reales del catastro';
  document.getElementById('tabs').innerHTML=OPCIONES.map(o=>'<button class="tab" data-id="'+o.id+'" onclick="pintar(\''+o.id+'\')"><b>'+o.id+'</b> '+o.nom+'</button>').join('');
  document.getElementById('cmp').innerHTML=OPCIONES.map(o=>'<tr><td><b>'+o.id+' · '+o.nom+'</b></td><td>'+o.ve+'</td><td>'+o.para+'</td></tr>').join('');
  document.getElementById('recomendacion').textContent='A (mapa gris con lugares sensibles) es la vista de trabajo del tablero: dice qué grifo falla, en qué estado está y junto a qué colegio, centro de salud o cárcel. C (burbujas por comuna) sirve como lámina de apertura cuando sólo hay que mostrar dónde se concentra el problema. El satélite conviene dejarlo como opción, no como vista por defecto: en reunión compite con el dato.';
  map=L.map('mapa',{zoomControl:true,maxZoom:19});
  map.createPane('lugares');map.getPane('lugares').style.zIndex=390;
  const elMapa=document.getElementById('mapa');
  const nombres=()=>{const z=map.getZoom();elMapa.classList.toggle('lejos',z<13);elMapa.classList.toggle('cerca',z>=16);};
  map.on('zoomend',nombres);
  encuadrar();
  map.setMinZoom(Math.max(8,map.getZoom()-1));
  map.setMaxBounds(L.latLngBounds(datos.hall.map(h=>[h.la,h.ln])).pad(.6));
  let ini='A'; try{ini=localStorage.getItem('propMapa')||'A';}catch(e){}
  pintar(OPCIONES.some(o=>o.id===ini)?ini:'A');
  nombres();
}
(function cargar(){
  try{ const s=sessionStorage.getItem('propMapaDatos'); if(s){ datos=JSON.parse(s); return arrancar(); } }catch(e){}
  try{
    firebase.initializeApp({apiKey:"AIzaSyApa-zy4sV8iM1-MNgtIvRcev9j8CAve10",authDomain:"hallazgos-grifos-app.firebaseapp.com",
      projectId:"hallazgos-grifos-app",storageBucket:"hallazgos-grifos-app.firebasestorage.app",
      messagingSenderId:"156705018338",appId:"1:156705018338:web:9c35d7983923aaa123e9bb"});
    const db=firebase.firestore();
    Promise.all([db.collection('hallazgos').get(),db.collection('catalogo_grifos').get()]).then(([h,c])=>{
      const LEG={inmediato:'directa',corto:'indirecta',mediano:'senaletica'};
      const hall=[];
      h.forEach(d=>{const x=d.data();
        const det=Array.isArray(x.hallazgos_detalle)?x.hallazgos_detalle:[];
        if(!det.length && !x.tipo_hallazgo) return;
        if(typeof x.lat!=='number'||typeof x.lng!=='number') return;
        let cr=LEG[x.prioridad]||x.prioridad||'senaletica';
        if(det.length && det.every(d2=>/pintura/i.test(d2.tipo_hallazgo||''))) cr='senaletica';
        const t=det.length?det.map(d2=>d2&&d2.tipo_hallazgo).filter(Boolean).map(String):(x.tipo_hallazgo?[String(x.tipo_hallazgo)]:[]);
        hall.push({id:d.id,c:(x.codigo_grifo||'').toUpperCase(),co:x.comuna||'',cr:cr,e:x.estado||'pendiente',la:x.lat,ln:x.lng,t:t});});
      const vistos={},lug=[],cat={};
      c.forEach(d=>{const x=d.data(),L2=x.zona_prioritaria_lugares;
        const ficha={co:x.comuna||'',lug:(Array.isArray(L2)?L2:[]).filter(p=>p&&p.nombre)
          .map(p=>({nombre:p.nombre,tipo:p.tipo||'otro',d:Number(p.d)||0}))};
        cat[String(d.id).toUpperCase()]=ficha;
        if(x.codigo)cat[String(x.codigo).toUpperCase()]=ficha;
        if(!Array.isArray(L2))return;
        L2.forEach(p=>{if(typeof p.lat!=='number'||typeof p.lng!=='number')return;
          const k=(p.nombre||'')+'|'+p.lat.toFixed(5)+'|'+p.lng.toFixed(5);
          if(vistos[k])return;vistos[k]=1;
          lug.push({nombre:p.nombre||'Sin nombre',tipo:p.tipo||'otro',lat:p.lat,lng:p.lng});});});
      datos={hall,parque:c.size,lug,cat};arrancar();
    }).catch(e=>{document.getElementById('cargando').textContent='No se pudo leer el catastro: '+e.message;});
  }catch(e){document.getElementById('cargando').textContent='No se pudo iniciar Firebase: '+e.message;}
})();
</script></body></html>
