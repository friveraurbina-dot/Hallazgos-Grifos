<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catastro de Grifos — Singemelec / Sacyr Aguas</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-storage-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16323A;
  --ink-2:#1F4350;
  --concrete:#EDE7DC;
  --concrete-2:#F7F4ED;
  --paper:#FFFFFF;
  --hidrante:#C8334D;
  --senal:#E2A33D;
  --tuberia:#3B6E8F;
  --musgo:#5C8A60;
  --line:#D9D2C2;
  --text:#1B2A2E;
  --text-soft:#5C6B6E;
  --radius:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'IBM Plex Sans',sans-serif;
  background:var(--concrete);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.02em;}
.mono{font-family:'IBM Plex Mono',monospace;}
#app{display:flex;flex-direction:column;height:100vh;}

/* HEADER */
header.topbar{
  background:var(--ink);
  color:#fff;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;height:64px;flex-shrink:0;
  border-bottom:3px solid var(--senal);
}
.brand{display:flex;align-items:center;gap:14px;}
.brand .mark{
  width:36px;height:36px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, var(--hidrante), #8c1f33 80%);
  display:flex;align-items:center;justify-content:center;
  font-family:'Oswald',sans-serif;font-weight:700;color:#fff;font-size:14px;
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.25);
}
.brand .name{font-family:'Oswald',sans-serif;font-size:17px;letter-spacing:.04em;line-height:1.1;}
.brand .name small{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#9fb3b9;text-transform:none;letter-spacing:.02em;}
.role-switch{display:flex;align-items:center;gap:10px;}
.role-pill{
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.05em;
  padding:6px 12px;border-radius:20px;border:1px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.06);color:#cfe3e7;cursor:pointer;transition:.15s;
}
.role-pill.active{background:var(--senal);color:#231a02;border-color:var(--senal);font-weight:600;}

/* LAYOUT */
.body-grid{display:flex;flex:1;min-height:0;}
nav.rail{
  width:190px;background:var(--ink-2);color:#dfe9eb;flex-shrink:0;
  padding:18px 0;display:flex;flex-direction:column;gap:2px;
}
nav.rail button{
  all:unset;cursor:pointer;padding:13px 22px;font-family:'IBM Plex Sans',sans-serif;
  font-size:13.5px;font-weight:500;color:#bcd0d4;border-left:3px solid transparent;
}
nav.rail button:hover{background:rgba(255,255,255,.05);color:#fff;}
nav.rail button.active{background:rgba(255,255,255,.08);color:#fff;border-left-color:var(--senal);}
nav.rail .rail-foot{margin-top:auto;padding:14px 22px;font-size:10.5px;color:#7d979b;font-family:'IBM Plex Mono',monospace;line-height:1.5;}

main{flex:1;overflow-y:auto;padding:24px 28px 60px;}
.page{max-width:1300px;margin:0 auto;}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.page-head h1{font-size:24px;margin:0;color:var(--ink);}
.page-head p{margin:2px 0 0;color:var(--text-soft);font-size:13px;}

/* CARDS / KPI */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px;}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;position:relative;overflow:hidden;}
.kpi .tab{position:absolute;left:0;top:0;bottom:0;width:5px;}
.kpi .num{font-family:'Oswald',sans-serif;font-size:30px;line-height:1;color:var(--ink);}
.kpi .lbl{font-size:11.5px;color:var(--text-soft);margin-top:6px;text-transform:uppercase;letter-spacing:.04em;}

.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:18px;}
.panel h3{font-size:14px;margin:0 0 12px;color:var(--ink);}
.grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;}
@media(max-width:980px){.grid-2{grid-template-columns:1fr;}}

#dashMap{height:430px;border-radius:8px;overflow:hidden;border:1px solid var(--line);}
.chart-wrap{position:relative;height:200px;margin-bottom:10px;}

/* LEGEND */
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--text-soft);}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block;}

/* FORM */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:820px){.form-grid{grid-template-columns:1fr;}}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.field label{font-size:12px;font-weight:600;color:var(--ink);text-transform:uppercase;letter-spacing:.03em;}
.field input,.field select,.field textarea{
  font-family:'IBM Plex Sans',sans-serif;padding:9px 11px;border:1px solid var(--line);
  border-radius:6px;font-size:13.5px;background:#fff;color:var(--text);
}
.field textarea{resize:vertical;min-height:70px;}
.field small{color:var(--text-soft);font-size:11px;}
.btn{
  font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:13px;
  padding:10px 18px;border-radius:7px;border:none;cursor:pointer;transition:.15s;
}
.btn-primary{background:var(--ink);color:#fff;}
.btn-primary:hover{background:var(--ink-2);}
.btn-amber{background:var(--senal);color:#241a01;}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--text);}
.btn-sm{padding:6px 12px;font-size:12px;}
.btn[disabled]{opacity:.5;cursor:not-allowed;}

.geo-map-mini{height:240px;border-radius:8px;border:1px solid var(--line);margin-top:6px;}
.photo-box{
  border:1.5px dashed var(--line);border-radius:8px;padding:10px;text-align:center;
  background:var(--concrete-2);cursor:pointer;position:relative;min-height:140px;
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;
}
.photo-box img{max-width:100%;max-height:160px;border-radius:6px;}
.photo-box span{font-size:11.5px;color:var(--text-soft);}

.multi-foto-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
.multi-foto-item{position:relative;width:88px;height:88px;border-radius:8px;overflow:hidden;border:1px solid var(--line);}
.multi-foto-item img{width:100%;height:100%;object-fit:cover;display:block;}
.multi-foto-x{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,0.65);color:#fff;border:none;font-size:14px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;}
.multi-foto-x:hover{background:var(--hidrante);}
.multi-foto-add{width:88px;height:88px;border-radius:8px;border:1.5px dashed var(--line);background:var(--concrete-2);display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;color:var(--text-soft);cursor:pointer;padding:4px;}
.multi-foto-add:hover{border-color:var(--tuberia);color:var(--tuberia);}

/* LIST */
.findings-list{display:flex;flex-direction:column;gap:10px;}
.fcard{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
.fcard .tag{width:7px;flex-shrink:0;}
.fcard .fbody{padding:13px 16px;flex:1;}
.fcard .frow1{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;}
.fcard .fid{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-soft);}
.fcard .faddr{font-weight:600;font-size:14.5px;color:var(--ink);}
.fcard .fmeta{font-size:11.5px;color:var(--text-soft);margin-top:3px;}
.fcard .fselect{display:flex;align-items:center;padding:0 2px 0 12px;}
.fcard .fselect input{width:17px;height:17px;cursor:pointer;}
.fcard.selected{outline:2px solid var(--hidrante);outline-offset:-2px;}
.list-actions{display:flex;align-items:center;gap:12px;background:#fdecef;border:1px solid var(--hidrante);border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:12.5px;color:var(--hidrante);font-weight:700;flex-wrap:wrap;}
.zone-tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.zone-tab{font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:12.5px;padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--text-soft);cursor:pointer;transition:.15s;}
.zone-tab.active{background:var(--ink);border-color:var(--ink);color:#fff;}
.list-filters{display:flex;gap:18px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
.list-filters .filter-group{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;}
.list-filters label{font-size:11.5px;font-weight:600;color:var(--ink);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;}
.list-filters input[type="text"],.list-filters select{
  font-family:'IBM Plex Sans',sans-serif;padding:8px 12px;border:1px solid var(--line);
  border-radius:6px;font-size:13px;background:#fff;color:var(--text);min-width:190px;
}
.btn-danger{background:var(--hidrante);color:#fff;}
.btn-danger:hover{background:#a82440;}
.estado-board{display:flex;flex-direction:column;gap:24px;}
.estado-col h2{font-size:15px;margin:0 0 2px;color:var(--ink);display:flex;align-items:center;gap:8px;}
.estado-col h2 .count{font-size:11.5px;font-weight:600;color:var(--text-soft);background:var(--concrete-2);padding:2px 9px;border-radius:12px;}
.estado-col .sub{font-size:12px;color:var(--text-soft);margin:0 0 8px;}
.estado-table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);}
.estado-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.estado-table th,.estado-table td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;white-space:nowrap;}
.estado-table th{font-family:'IBM Plex Mono',monospace;font-size:9.5px;text-transform:uppercase;color:var(--text-soft);letter-spacing:.03em;background:var(--concrete-2);}
.estado-table tbody tr:last-child td{border-bottom:none;}
.estado-table tbody tr:hover{background:var(--concrete-2);}
.estado-table .faddr-cell{white-space:normal;font-weight:600;color:var(--ink);}
.estado-table tr.selected{background:#fdecef;}
.estado-table .empty-row td{color:var(--text-soft);font-style:italic;white-space:normal;}
.revision-box{background:var(--concrete-2);padding:10px 14px;border-radius:8px;border:1px solid var(--line);}
.revision-box label{display:flex;align-items:center;gap:8px;cursor:pointer;text-transform:none;font-size:13px;font-weight:500;color:var(--text);}
.revision-box input{width:16px;height:16px;cursor:pointer;}
.chips-list{display:flex;flex-wrap:wrap;gap:0;}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--concrete-2);border:1px solid var(--line);border-radius:16px;padding:5px 8px 5px 12px;font-size:12px;margin:0 6px 6px 0;color:var(--text);}
.chip button{background:none;border:none;cursor:pointer;color:var(--hidrante);font-weight:700;font-size:15px;line-height:1;padding:0 2px;}
.chip .dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.criticidad-auto{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-soft);margin-top:6px;}
.badge{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:14px;text-transform:uppercase;letter-spacing:.03em;}
.badge.inmediato,.badge.directa{background:#fdecef;color:var(--hidrante);}
.badge.corto,.badge.indirecta{background:#fdf3e1;color:#8a6109;}
.badge.mediano,.badge.senaletica{background:#e9f1f5;color:var(--tuberia);}
.badge.pendiente{background:#f1eee6;color:#7a7263;}
.badge.en_proceso{background:#eaf1ec;color:#3f6e46;}
.badge.resuelto{background:#e3f0e4;color:var(--musgo);}
.fcard .factions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.empty{padding:40px 20px;text-align:center;color:var(--text-soft);}
.empty .display{font-size:18px;color:var(--ink);margin-bottom:6px;}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(22,50,58,.55);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px;}
.modal-bg.open{display:flex;}
.modal{background:#fff;border-radius:12px;max-width:760px;width:100%;max-height:88vh;overflow-y:auto;padding:22px 24px;}
.modal h2{font-size:19px;margin:0 0 4px;color:var(--ink);}
.modal .closeX{float:right;cursor:pointer;font-size:20px;color:var(--text-soft);background:none;border:none;}
.detail-imgs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0;}
.detail-imgs figure{margin:0;}
.detail-imgs img{width:100%;border-radius:8px;border:1px solid var(--line);}
.detail-imgs figcaption{font-size:11px;color:var(--text-soft);margin-top:4px;}
#detailMap{height:220px;border-radius:8px;border:1px solid var(--line);margin:10px 0;}
.comment{background:var(--concrete-2);border-radius:8px;padding:9px 11px;margin-bottom:8px;font-size:13px;}
.comment .ca{font-size:11px;color:var(--text-soft);font-family:'IBM Plex Mono',monospace;margin-bottom:3px;}

.toast{position:fixed;bottom:22px;right:22px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:8px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:2000;opacity:0;transform:translateY(10px);transition:.25s;}
.toast.show{opacity:1;transform:translateY(0);}

.loading{padding:40px;text-align:center;color:var(--text-soft);}

/* ---------------- MOBILE ---------------- */
@media(max-width:720px){
  header.topbar{flex-wrap:wrap;height:auto;padding:10px 14px;gap:8px;}
  .brand .name{font-size:14px;}
  .role-switch{width:100%;justify-content:flex-end;}
  .body-grid{flex-direction:column;}
  nav.rail{
    width:100%;flex-direction:row;overflow-x:auto;padding:6px 10px;gap:4px;
    border-bottom:1px solid rgba(255,255,255,.1);
  }
  nav.rail button{padding:9px 14px;white-space:nowrap;border-left:none;border-bottom:3px solid transparent;}
  nav.rail button.active{border-left-color:transparent;border-bottom-color:var(--senal);}
  nav.rail .rail-foot{display:none;}
  main{padding:14px 12px 50px;}
  .page-head h1{font-size:19px;}
  .kpi-row{grid-template-columns:repeat(2,1fr);}
  .kpi .num{font-size:24px;}
  #dashMap{height:280px;}
  .form-grid{grid-template-columns:1fr;}
  .detail-imgs{grid-template-columns:1fr;}
  .modal{padding:16px;max-height:92vh;}
  .fcard .frow1{flex-direction:column;align-items:flex-start;gap:4px;}
}
</style>
</head>
<body>
<div id="lockScreen" style="position:fixed;inset:0;background:var(--ink);display:flex;align-items:center;justify-content:center;z-index:5000;padding:20px;">
  <div style="background:#fff;border-radius:12px;padding:32px 30px;max-width:340px;width:100%;text-align:center;">
    <div style="width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #C8334D, #8c1f33 80%);margin:0 auto 16px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.25);"></div>
    <h2 style="font-family:'Oswald',sans-serif;text-transform:uppercase;margin:0 0 6px;font-size:17px;color:#16323A;">Catastro de Grifos</h2>
    <p style="font-size:12.5px;color:#5C6B6E;margin:0 0 18px;">Ingresa la clave de tu empresa para continuar.</p>
    <input type="password" id="accessInput" placeholder="Clave de acceso" style="width:100%;padding:10px 12px;border:1px solid #D9D2C2;border-radius:7px;font-size:14px;margin-bottom:10px;text-align:center;box-sizing:border-box;" onkeydown="if(event.key==='Enter') verificarAcceso();">
    <button style="width:100%;font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:13px;padding:10px 18px;border-radius:7px;border:none;cursor:pointer;background:#16323A;color:#fff;" onclick="verificarAcceso()">Ingresar</button>
    <div id="accessError" style="color:#C8334D;font-size:12px;margin-top:10px;display:none;">Clave incorrecta. Intenta nuevamente.</div>
  </div>
</div>
<script>
/* ====================================================================
   CLAVES DE ACCESO — cámbialas antes de publicar la app.
   Cada clave identifica automáticamente a la empresa que ingresa.
   ==================================================================== */
const ACCESS_CODES = {
  "SINGEMELEC2026": "singemelec",
  "SACYR2026": "sacyr"
};
function verificarAcceso(){
  const val = document.getElementById('accessInput').value;
  const rolDetectado = ACCESS_CODES[val];
  if(rolDetectado){
    sessionStorage.setItem('grifos_access_ok','1');
    sessionStorage.setItem('grifos_session_role', rolDetectado);
    localStorage.setItem('grifos_role', rolDetectado);
    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('app').style.display = '';
    if(typeof setRole === 'function') setRole(rolDetectado);
  } else {
    document.getElementById('accessError').style.display = 'block';
  }
}
/* OJO: la restauración automática de sesión (si sessionStorage ya tiene
   'grifos_access_ok') se hace en el SEGUNDO bloque <script>, más abajo —
   NO acá. En este punto del HTML el <div id="app"> todavía no existe (se
   define después de este script), así que intentar hacer
   document.getElementById('app').style.display aquí devuelve null y
   revienta con "Cannot read properties of null (reading 'style')" cada vez
   que un usuario que ya inició sesión antes recarga la página. */
</script>
<div id="app" style="display:none;">

  <header class="topbar">
    <div class="brand">
      <div class="mark">SG</div>
      <div class="name">Catastro de Grifos<small>Singemelec — Sacyr Aguas</small></div>
    </div>
    <div class="role-switch">
      <span style="font-size:11px;color:#9fb3b9;font-family:'IBM Plex Mono',monospace;">CONECTADO COMO</span>
      <span class="role-pill active" id="roleLabel">—</span>
      <button class="role-pill" id="logoutBtn" onclick="cerrarSesion()" style="border-color:rgba(255,255,255,.3);">Salir</button>
    </div>
  </header>

  <div class="body-grid">
    <nav class="rail">
      <button class="navbtn active" data-page="dashboard" onclick="goPage('dashboard')">Tablero ejecutivo</button>
      <button class="navbtn" data-page="inspecciones" onclick="goPage('inspecciones')">Inspecciones</button>
      <button class="navbtn" data-page="nuevo" id="navNuevo" onclick="goPage('nuevo')">Nuevo hallazgo</button>
      <button class="navbtn" data-page="lista" onclick="goPage('lista')">Hallazgos</button>
      <div class="rail-foot" id="railFoot">v1.0 · datos compartidos<br>entre ambas empresas</div>
    </nav>

    <main id="main"><div class="loading">Cargando catastro…</div></main>
  </div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalContent"></div></div>
<div class="toast" id="toast"></div>

<script>
/* Restaura la sesión si ya se inició acceso antes en esta pestaña
   (sessionStorage sobrevive a un refresco de página, incluso uno forzado
   con Ctrl+Shift+R). Tiene que ir acá, en este segundo bloque <script> —
   en este punto del HTML el <div id="app"> ya existe (se define arriba,
   antes de este script), así que es seguro tocar su .style. Ver la nota en
   el primer <script> de más arriba: hacer esto ahí revienta con
   "Cannot read properties of null (reading 'style')" porque #app todavía
   no existía en el DOM en ese punto. */
if(sessionStorage.getItem('grifos_access_ok')==='1'){
  const lockScreenEl = document.getElementById('lockScreen');
  const appEl = document.getElementById('app');
  if(lockScreenEl) lockScreenEl.style.display = 'none';
  if(appEl) appEl.style.display = '';
}

/* ---------------- STATE ---------------- */
let ROLE = localStorage.getItem('grifos_role') || 'singemelec';
let HALLAZGOS = [];
let dashMapInstance = null;
let dashChart1 = null, dashChart2 = null;
let formMarkerActual = null, formMarkerIdeal = null, formMap = null;
let pendingFotos = {grifo:null, hallazgo:null};
let CATALOGO_GRIFOS = {}; // catastro oficial de grifos (Sacyr), por código, cargado desde Firestore
let catalogoGrifosListo = false;

/* Determina la zona de un hallazgo según la comuna del grifo en el catastro
   (LAMPA => zona Lampa; LO BARNECHEA / COLINA => zona Metropolitana).
   Los hallazgos sin código de grifo (o cuyo código no está en el catastro)
   no tienen comuna registrada y quedan como "sin_zona". */
function zonaDeHallazgo(h){
  if(!h.comuna) return 'sin_zona';
  return h.comuna === 'LAMPA' ? 'lampa' : 'metropolitana';
}

// Los 3 niveles de criticidad. Se incluyen también las claves antiguas
// (inmediato/corto/mediano) apuntando a los mismos textos/colores que su
// equivalente nuevo, para que los hallazgos guardados antes de este cambio
// se seleccionen y muestren bien sin tener que migrar datos en Firestore.
const PRIORIDAD_LABEL = {
  directa:'Operatividad directa', indirecta:'Operatividad indirecta / mecánica', senaletica:'Señalética / visibilidad',
  inmediato:'Operatividad directa', corto:'Operatividad indirecta / mecánica', mediano:'Señalética / visibilidad'
};
const PRIORIDAD_COLOR = {
  directa:'#C8334D', indirecta:'#E2A33D', senaletica:'#3B6E8F',
  inmediato:'#C8334D', corto:'#E2A33D', mediano:'#3B6E8F'
};
const ORDEN_CRITICIDAD = ['directa','indirecta','senaletica']; // de mayor a menor severidad
const CRITICIDAD_LEGACY = {inmediato:'directa', corto:'indirecta', mediano:'senaletica'};
const ESTADO_LABEL = {pendiente:'Pendiente', en_proceso:'En proceso', resuelto:'Resuelto'};

// Catálogo único de hallazgos: cada uno ya trae fijos su criticidad y su
// tipo de elemento, así ya no se elige "Tipo de elemento" a mano ni la
// prioridad del registro — se calculan solas a partir de lo seleccionado.
const CATALOGO_HALLAZGOS = [
  {nombre:'Válvula de pie cerrada', criticidad:'directa', tipo_elemento:'grifo'},
  {nombre:'Obturador agripado', criticidad:'directa', tipo_elemento:'grifo'},
  {nombre:'Vástago inoperativo', criticidad:'directa', tipo_elemento:'grifo'},
  {nombre:'Robo de agua', criticidad:'directa', tipo_elemento:'grifo'},
  {nombre:'Vástago rodado', criticidad:'directa', tipo_elemento:'grifo'},
  {nombre:'Filtración de agua', criticidad:'directa', tipo_elemento:'grifo'},
  {nombre:'Grifo dañado', criticidad:'directa', tipo_elemento:'grifo'},
  {nombre:'Tapa de cámara agripada', criticidad:'indirecta', tipo_elemento:'camara'},
  {nombre:'Cámara no visible', criticidad:'indirecta', tipo_elemento:'camara'},
  {nombre:'Cámara con basura', criticidad:'indirecta', tipo_elemento:'camara'},
  {nombre:'Cámara dañada', criticidad:'indirecta', tipo_elemento:'camara'},
  {nombre:'Cámara Inundada', criticidad:'indirecta', tipo_elemento:'camara'},
  {nombre:'Tapa boquilla mal estado', criticidad:'indirecta', tipo_elemento:'grifo'},
  {nombre:'Pintura en mal estado', criticidad:'senaletica', tipo_elemento:'grifo'}
];
const CATEGORIAS_CRITICIDAD = [
  {clave:'directa', titulo:'OPERATIVIDAD DIRECTA'},
  {clave:'indirecta', titulo:'OPERATIVIDAD INDIRECTA / MECÁNICA'},
  {clave:'senaletica', titulo:'SEÑALÉTICA / VISIBILIDAD'}
];
function hallazgoInfo(nombre){ return CATALOGO_HALLAZGOS.find(x=>x.nombre===nombre); }

/* Criticidad "peor caso" entre varios hallazgos agregados a un mismo
   registro — así el registro completo queda con la criticidad más alta
   entre todos sus hallazgos, sin que nadie tenga que elegirla a mano. */
function criticidadMasSevera(lista){
  let peor = null;
  (lista||[]).forEach(d=>{
    const idx = ORDEN_CRITICIDAD.indexOf(d && d.criticidad);
    if(idx>-1 && (peor===null || idx < ORDEN_CRITICIDAD.indexOf(peor))) peor = d.criticidad;
  });
  return peor || 'senaletica';
}

/* Normaliza la criticidad de un registro completo (campo h.prioridad),
   traduciendo las claves antiguas (inmediato/corto/mediano) a las nuevas,
   para poder agrupar/contar sin duplicar categorías. */
function criticidadDeRegistro(h){
  return CRITICIDAD_LEGACY[h.prioridad] || h.prioridad || 'senaletica';
}

/* Criticidad de un hallazgo individual dentro de un registro: usa la que
   quedó guardada en el propio detalle si existe: si no (hallazgos
   guardados antes de este cambio), la busca por nombre en el catálogo
   actual; si tampoco la encuentra, usa la del registro completo como
   respaldo final. */
function criticidadDeDetalle(d, h){
  if(d && d.criticidad) return d.criticidad;
  const info = d && hallazgoInfo(d.tipo_hallazgo);
  if(info) return info.criticidad;
  return criticidadDeRegistro(h);
}

// Un registro puede venir del flujo de "Inspecciones" (chequeo diario, con o
// sin hallazgo) o del flujo directo de "Nuevo hallazgo" (siempre con
// hallazgo). Ambos se guardan en la misma colección `hallazgos`, con el
// mismo esquema — así toda la información del grifo queda en un solo lugar.
function esInspeccion(h){ return h.origen === 'inspeccion'; }
// Un registro "cuenta" como hallazgo real (para el tablero, el tablero
// ejecutivo, los reportes y el Excel) solo si trae al menos un hallazgo
// categorizado — descarta las inspecciones sin hallazgo, que no necesitan
// seguimiento de resolución.
function tieneHallazgoReal(h){ return obtenerDetalleHallazgos(h).length > 0; }

function uid(){ return 'H-' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2,6).toUpperCase(); }
function fmtDate(d){ const dt=new Date(d); return dt.toLocaleString('es-CL',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
// Días completos transcurridos desde una fecha hasta ahora — usado en el
// Tablero ejecutivo para mostrar hace cuánto está pendiente cada hallazgo.
function diasTranscurridos(fecha){
  if(!fecha) return 0;
  const ms = new Date() - new Date(fecha);
  return Math.max(0, Math.floor(ms / (1000*60*60*24)));
}
function toast(msg){ const t=document.getElementById('toast'); if(!t) return; t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }

/* ---------------- STORAGE (Firestore, tiempo real + Storage para fotos) ----------------
   Cada hallazgo es un documento propio en la colección "hallazgos" (no un único
   documento gigante con todo el catastro), para no chocar con el límite de 1MB
   por documento de Firestore a medida que crece el catastro. Las fotos se suben
   a Firebase Storage y en el documento solo se guarda la URL. */
let STORAGE_MODE = 'local'; // se cambia a 'remote' si Firebase queda bien configurado
const LOCAL_KEY = 'grifos_hallazgos_local';
let db = null;
let storageRef = null;
let firebaseReady = false;
let unsubscribeHallazgos = null;

function initFirebase(){
  try{
    if(!firebaseConfig.apiKey || firebaseConfig.apiKey.indexOf('TU_API_KEY')>-1) throw new Error('sin-configurar');
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    storageRef = firebase.storage();
    firebaseReady = true;
    STORAGE_MODE = 'remote';
  }catch(e){
    firebaseReady = false;
    STORAGE_MODE = 'local';
  }
}

function suscribirHallazgos(onChange){
  if(!firebaseReady){
    try{
      const local = localStorage.getItem(LOCAL_KEY);
      HALLAZGOS = local ? JSON.parse(local) : [];
    }catch(e){ HALLAZGOS = []; }
    onChange();
    return;
  }
  if(unsubscribeHallazgos) unsubscribeHallazgos();
  unsubscribeHallazgos = db.collection('hallazgos').orderBy('fecha_creacion','desc').onSnapshot(
    (snap)=>{
      HALLAZGOS = snap.docs.map(d=>({id:d.id, ...d.data()}));
      onChange();
    },
    (err)=>{
      console.error(err);
      STORAGE_MODE = 'local';
      try{
        const local = localStorage.getItem(LOCAL_KEY);
        HALLAZGOS = local ? JSON.parse(local) : [];
      }catch(e2){ HALLAZGOS = []; }
      onChange();
    }
  );
}

/* Guarda solo en este dispositivo (modo local / sin conexión / Firebase no configurado). */
function guardarLocal(){
  try{
    localStorage.setItem(LOCAL_KEY, JSON.stringify(HALLAZGOS));
    render();
  }catch(e){ toast('Error al guardar. Intenta nuevamente.'); console.error(e); }
}

/* Carga el catastro oficial de grifos (Sacyr) desde Firestore, una sola vez, y lo
   deja en memoria (CATALOGO_GRIFOS) para autocompletar el formulario de "Nuevo
   hallazgo" al ingresar el código de grifo. Si no hay conexión remota, el
   formulario simplemente no autocompleta y se puede seguir llenando a mano. */
async function cargarCatalogoGrifos(){
  if(!(STORAGE_MODE === 'remote' && firebaseReady)) return;
  try{
    const snap = await db.collection('catalogo_grifos').get();
    const catalogo = {};
    snap.forEach(doc=>{ catalogo[doc.id] = doc.data(); });
    CATALOGO_GRIFOS = catalogo;
    catalogoGrifosListo = true;
    // Si el usuario ya estaba en "Nuevo hallazgo" cuando terminó de cargar el
    // catastro (carga en paralelo al render), refresca la lista de sugerencias.
    if(currentPage === 'nuevo'){
      const dl = document.getElementById('listaCodigosGrifo');
      if(dl) dl.innerHTML = Object.keys(CATALOGO_GRIFOS).sort().map(c=>`<option value="${c}">`).join('');
      const info = document.getElementById('catalogoInfo');
      if(info && !document.getElementById('fCodigoGrifo').value){
        info.textContent = `Si el código está en el catastro (${Object.keys(CATALOGO_GRIFOS).length} grifos cargados), se completan automáticamente dirección y ubicación.`;
      }
    }
  }catch(e){
    console.error('No se pudo cargar el catastro de grifos', e);
  }
}

/* Sube una foto (dataURL) a Firebase Storage y devuelve la URL pública de descarga.
   Si Firebase no está configurado, devuelve el dataURL tal cual (queda embebido
   localmente, como antes). */
async function subirFoto(dataUrl, path){
  if(!dataUrl) return null;
  if(!firebaseReady || !storageRef) return dataUrl;
  try{
    const blob = await (await fetch(dataUrl)).blob();
    const ref = storageRef.ref().child(path);
    await ref.put(blob);
    return await ref.getDownloadURL();
  }catch(e){
    console.error('Error subiendo foto a Storage', e);
    toast('No se pudo subir la foto a la nube; se guardó solo en este dispositivo');
    return dataUrl;
  }
}

/* ================= DASHBOARD ================= */
// Recuadro amplio que cubre toda la zona de concesión (Lampa, Colina,
// Santiago) — el mapa del tablero ejecutivo siempre parte con esta vista
// general como mínimo, y solo se amplía más si hay hallazgos fuera de ella.
// Referencial (no exacto): esquina suroeste ~ Santiago poniente, esquina
// noreste ~ Lampa/Colina norte.
const ZONA_CONCESION_BOUNDS = [[-33.62, -71.02], [-33.05, -70.48]];

function renderDashboard(){
  const main = document.getElementById('main');
  const conHallazgo = HALLAZGOS.filter(tieneHallazgoReal);

  // Sectores (comunas) disponibles para el filtro del tablero — se calculan
  // desde los datos reales, no están fijos, porque el catastro de grifos se
  // carga dinámicamente desde Firestore/CSV.
  const sectores = Array.from(new Set(conHallazgo.map(h=>h.comuna).filter(Boolean))).sort();
  if(FILTRO_SECTOR_DASHBOARD!=='todos' && !sectores.includes(FILTRO_SECTOR_DASHBOARD)) FILTRO_SECTOR_DASHBOARD='todos';

  // Todo el tablero (KPIs, mapa, gráficos y el TOP de críticos) respeta el
  // sector elegido, igual que las pestañas de zona en Hallazgos.
  const hallazgosSector = FILTRO_SECTOR_DASHBOARD==='todos' ? conHallazgo : conHallazgo.filter(h=>h.comuna===FILTRO_SECTOR_DASHBOARD);
  const total = hallazgosSector.length;
  const totalInspecciones = HALLAZGOS.filter(h => esInspeccion(h) && (FILTRO_SECTOR_DASHBOARD==='todos' || h.comuna===FILTRO_SECTOR_DASHBOARD)).length;
  const counts = {directa:0, indirecta:0, senaletica:0};
  const estados = {pendiente:0, en_proceso:0, resuelto:0};
  hallazgosSector.forEach(h=>{ const c=criticidadDeRegistro(h); counts[c]=(counts[c]||0)+1; estados[h.estado]=(estados[h.estado]||0)+1; });

  // Hallazgos pendientes por resolver: se muestran TODOS (no un "top" acotado
  // a unos pocos) porque toda operatividad directa debe resolverse, no solo
  // los primeros — ordenados por riesgo: severidad primero (directa >
  // indirecta > señalética) y dentro de cada severidad, antigüedad (los
  // pendientes desde hace más tiempo primero, porque acumulan más riesgo).
  const pendientesPorRiesgo = hallazgosSector
    .filter(h=>h.estado!=='resuelto')
    .slice()
    .sort((a,b)=>{
      const ca = ORDEN_CRITICIDAD.indexOf(criticidadDeRegistro(a));
      const cb = ORDEN_CRITICIDAD.indexOf(criticidadDeRegistro(b));
      if(ca!==cb) return ca-cb;
      return new Date(a.fecha_creacion) - new Date(b.fecha_creacion);
    });

  main.innerHTML = `
  <div class="page">
    <div class="page-head">
      <div>
        <h1>Tablero ejecutivo</h1>
        <p>Resumen de hallazgos en grifos · catastro Singemelec / Sacyr Aguas</p>
      </div>
      <div>
        <button class="btn btn-amber btn-sm" onclick="descargarReporteEjecutivo()">📄 Reporte ejecutivo (HTML)</button>
        <button class="btn btn-amber btn-sm" onclick="imprimirReportePDF()">🖨️ Reporte ejecutivo (PDF)</button>
        <button class="btn btn-ghost btn-sm" onclick="document.getElementById('csvInput').click()">⬆ Importar base de grifos (CSV)</button>
        <input type="file" id="csvInput" accept=".csv" style="display:none" onchange="handleCSVImport(event)">
      </div>
    </div>

    <div class="list-filters">
      <div class="filter-group">
        <label for="filtroSectorSelect">Sector</label>
        <select id="filtroSectorSelect" onchange="cambiarFiltroSectorDashboard(this.value)">
          <option value="todos" ${FILTRO_SECTOR_DASHBOARD==='todos'?'selected':''}>Todos los sectores (${conHallazgo.length})</option>
          ${sectores.map(s=>`<option value="${s}" ${FILTRO_SECTOR_DASHBOARD===s?'selected':''}>${s} (${conHallazgo.filter(h=>h.comuna===s).length})</option>`).join('')}
        </select>
      </div>
    </div>

    <div class="kpi-row">
      <div class="kpi"><div class="tab" style="background:var(--ink)"></div><div class="num">${total}</div><div class="lbl">Hallazgos totales</div></div>
      <div class="kpi"><div class="tab" style="background:var(--hidrante)"></div><div class="num">${counts.directa||0}</div><div class="lbl">Operatividad directa</div></div>
      <div class="kpi"><div class="tab" style="background:var(--senal)"></div><div class="num">${counts.indirecta||0}</div><div class="lbl">Operatividad indirecta/mec.</div></div>
      <div class="kpi"><div class="tab" style="background:var(--tuberia)"></div><div class="num">${counts.senaletica||0}</div><div class="lbl">Señalética/visibilidad</div></div>
      <div class="kpi"><div class="tab" style="background:var(--musgo)"></div><div class="num">${estados.resuelto||0}</div><div class="lbl">Resueltos</div></div>
      <div class="kpi"><div class="tab" style="background:var(--acero,#5a7d9a)"></div><div class="num">${totalInspecciones}</div><div class="lbl">Inspecciones registradas</div></div>
    </div>

    <div class="grid-2">
      <div class="panel">
        <h3>Mapa georeferenciado de hallazgos</h3>
        <div id="dashMap"></div>
        <div class="legend">
          <span><i style="background:var(--hidrante)"></i>Operatividad directa</span>
          <span><i style="background:var(--senal)"></i>Operatividad indirecta/mec.</span>
          <span><i style="background:var(--tuberia)"></i>Señalética/visibilidad</span>
        </div>
      </div>
      <div>
        <div class="panel">
          <h3>Hallazgos por criticidad</h3>
          <div class="chart-wrap"><canvas id="chartPrioridad"></canvas></div>
        </div>
        <div class="panel">
          <h3>Avance de resolución</h3>
          <div class="chart-wrap"><canvas id="chartEstado"></canvas></div>
        </div>
      </div>
    </div>

    <div class="panel">
      <h3>⚠️ Hallazgos pendientes por resolver, ordenados por riesgo</h3>
      <p class="sub">Todos los hallazgos aún no resueltos (no solo un "top") — primero los de operatividad directa, ya que todos deben resolverse; dentro de cada criticidad, los pendientes desde hace más tiempo primero.</p>
      <div class="estado-table-wrap">
        <table class="estado-table">
          <thead><tr><th>Código</th><th>Comuna</th><th>Dirección</th><th>Criticidad</th><th>Estado</th><th>Pendiente hace</th><th></th></tr></thead>
          <tbody>${pendientesPorRiesgo.length ? pendientesPorRiesgo.map(h=>{
            const dias = diasTranscurridos(h.fecha_creacion);
            return `<tr>
            <td class="mono" style="font-weight:700;color:var(--ink);">${h.codigo_grifo || '—'}</td>
            <td>${h.comuna || '—'}</td>
            <td class="faddr-cell">${h.direccion || 'Sin dirección registrada'}</td>
            <td><span class="badge ${criticidadDeRegistro(h)}">${PRIORIDAD_LABEL[criticidadDeRegistro(h)]}</span></td>
            <td><span class="badge ${h.estado}">${ESTADO_LABEL[h.estado]}</span></td>
            <td>${dias} día${dias===1?'':'s'}</td>
            <td><button class="btn btn-ghost btn-sm" onclick="openDetail('${h.id}')">Ver</button></td>
          </tr>`;}).join('') : `<tr class="empty-row"><td colspan="7">Sin hallazgos pendientes${FILTRO_SECTOR_DASHBOARD!=='todos' ? ` en ${FILTRO_SECTOR_DASHBOARD}` : ''}.</td></tr>`}</tbody>
        </table>
      </div>
    </div>
  </div>`;

  // Map — parte siempre con una vista amplia que cubre toda la zona de
  // concesión (Lampa / Colina / Santiago), no centrada/ajustada al primer

  // de la vista amplia se acerca a los puntos de ese sector — así el filtro
  // realmente sirve para "ir visualizando" sector por sector.
  if(dashMapInstance){ dashMapInstance.remove(); dashMapInstance=null; }
  dashMapInstance = L.map('dashMap').setView([-33.33, -70.75], 10); // vista provisoria; se reemplaza abajo con fitBounds
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(dashMapInstance);
  const puntosSector = hallazgosSector.filter(h=>typeof h.lat==='number' && typeof h.lng==='number');
  let bounds;
  if(FILTRO_SECTOR_DASHBOARD==='todos'){
    bounds = L.latLngBounds(ZONA_CONCESION_BOUNDS);
    puntosSector.forEach(h=>bounds.extend([h.lat,h.lng]));
  } else if(puntosSector.length){
    bounds = L.latLngBounds(puntosSector.map(h=>[h.lat,h.lng]));
  } else {
    bounds = L.latLngBounds(ZONA_CONCESION_BOUNDS);
  }
  dashMapInstance.fitBounds(bounds, {padding:[30,30], maxZoom:16});
  puntosSector.forEach(h=>{
    const color = PRIORIDAD_COLOR[h.prioridad] || '#999';
    const marker = L.circleMarker([h.lat,h.lng],{radius:9,color:'#fff',weight:2,fillColor:color,fillOpacity:1}).addTo(dashMapInstance);
    marker.bindPopup(`<strong>${h.direccion||'Sin dirección'}</strong><br>${PRIORIDAD_LABEL[h.prioridad]||'Sin criticidad'} · ${ESTADO_LABEL[h.estado]||'Sin estado'}<br><span style="font-family:monospace;font-size:11px">${h.id}</span>`);

/* Wiring compartido entre "Nuevo hallazgo" e "Inspecciones": ambas páginas
   usan los mismos IDs (#formMiniMap, #fDireccion, #addrSuggestions,
   #fCodigoGrifo, #listaHallazgosAgregados…) porque nunca están montadas al
   mismo tiempo — solo una ocupa #main a la vez — así que reutilizar el mismo
   wiring (mapa, autocompletado de dirección, catastro de grifos) es seguro y
   evita mantener dos copias del mismo código. */
function inicializarFormularioGrifo(fotosIniciales){
  pendingFotos = fotosIniciales;
  pendingFotosMulti = {grifo:[], hallazgo:[], despues:[]};
  renderGridFotosMulti('grifo');
  renderGridFotosMulti('hallazgo');
  formMarkerActual = null; formMarkerIdeal = null;
  catalogoMatchActual = null;
  hallazgosAgregados = [];

  if(formMap){ formMap.remove(); formMap=null; }
  formMap = L.map('formMiniMap').setView([-33.0245,-71.5518], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(formMap);

  formMap.on('click', (e)=>{
    if(e.originalEvent.shiftKey){
      if(formMarkerIdeal) formMap.removeLayer(formMarkerIdeal);
      formMarkerIdeal = L.circleMarker(e.latlng,{radius:8,color:'#fff',weight:2,fillColor:'#3B6E8F',fillOpacity:1}).addTo(formMap);
      formMarkerIdeal.bindTooltip('Ideal').openTooltip();
    } else {
      if(formMarkerActual) formMap.removeLayer(formMarkerActual);
      formMarkerActual = L.circleMarker(e.latlng,{radius:8,color:'#fff',weight:2,fillColor:'#C8334D',fillOpacity:1}).addTo(formMap);
      formMarkerActual.bindTooltip('Grifo').openTooltip();
      reverseGeocode(e.latlng.lat, e.latlng.lng);
    }
    updateCoordsInfo();
  });

  // Address autocomplete
  let debounceT;
  document.getElementById('fDireccion').addEventListener('input', (e)=>{
    clearTimeout(debounceT);
    const q = e.target.value;
    if(q.length<4){ document.getElementById('addrSuggestions').innerHTML=''; return; }
    debounceT = setTimeout(()=>searchAddress(q), 450);
  });

  // Código de grifo → autocompleta con el catastro oficial (Sacyr)
  document.getElementById('fCodigoGrifo').addEventListener('input', (e)=>{
    aplicarCatalogoGrifo(e.target.value.trim().toUpperCase());
  });
  document.getElementById('fCodigoGrifo').addEventListener('blur', (e)=>{
    e.target.value = e.target.value.trim().toUpperCase();
  });

  renderListaHallazgosAgregados();
}

/* Un mismo registro (una misma visita a un grifo) puede tener más de un
   hallazgo. Cada clic en "+ Agregar hallazgo a este registro" suma el
   hallazgo actualmente seleccionado a `hallazgosAgregados` (junto con su
   tipo de elemento y su criticidad, ambos ya fijos en CATALOGO_HALLAZGOS,
   no elegidos a mano), y se guarda completo al presionar "Guardar hallazgo". */
function agregarHallazgoDetalle(){
  const tipo_hallazgo = document.getElementById('fTipoHallazgo').value;
  const info = hallazgoInfo(tipo_hallazgo);
  if(!info) return;
  const yaExiste = hallazgosAgregados.some(h=>h.tipo_hallazgo===tipo_hallazgo);
  if(yaExiste){ toast('Ese hallazgo ya fue agregado a este registro'); return; }
  hallazgosAgregados.push({tipo_elemento: info.tipo_elemento, tipo_hallazgo, criticidad: info.criticidad});
  renderListaHallazgosAgregados();
  toast('Hallazgo agregado al registro');
}

function quitarHallazgoDetalle(i){
  hallazgosAgregados.splice(i,1);
  renderListaHallazgosAgregados();
}

function renderListaHallazgosAgregados(){
  const cont = document.getElementById('listaHallazgosAgregados');
  const info = document.getElementById('criticidadAutoInfo');
  if(!cont) return;
  if(hallazgosAgregados.length===0){
    cont.innerHTML = '<em style="font-size:12px;color:var(--text-soft);">Aún no se ha agregado ningún hallazgo. Agrega al menos uno antes de guardar.</em>';
    if(info) info.innerHTML = '';
    return;
  }
  cont.innerHTML = hallazgosAgregados.map((h,i)=>`
    <span class="chip"><i class="dot" style="background:${PRIORIDAD_COLOR[h.criticidad]}"></i>${h.tipo_elemento==='camara'?'Cámara':'Grifo'} · ${h.tipo_hallazgo}
      <button type="button" onclick="quitarHallazgoDetalle(${i})" title="Quitar">&times;</button>
    </span>
  `).join('');
  if(info){
    const peor = criticidadMasSevera(hallazgosAgregados);
    info.innerHTML = `Criticidad de este registro (automática): <span class="badge ${peor}">${PRIORIDAD_LABEL[peor]}</span>`;
  }
}

   información inconsistente. */
function toggleBloqueHallazgoInsp(){
  const val = document.getElementById('fTieneHallazgo').value;
  const bloque = document.getElementById('bloqueHallazgoInsp');
  if(bloque) bloque.style.display = (val==='si') ? '' : 'none';
  if(val==='no' && hallazgosAgregados.length){
    hallazgosAgregados = [];
    renderListaHallazgosAgregados();
  }
}

async function guardarInspeccion(){
  if(!document.getElementById('fRevisionOkInsp').checked){ toast('Marca la casilla de revisión antes de guardar'); return; }
  if(!formMarkerActual){ toast('Marca la ubicación real del grifo en el mapa'); return; }
  const fechaEjecucion = document.getElementById('fFechaEjecucion').value;
  const horarioEjecucion = document.getElementById('fHorarioEjecucion').value;
  if(!fechaEjecucion || !horarioEjecucion){ toast('Indica la fecha y el horario de ejecución'); return; }
  const presionRaw = document.getElementById('fPresionGrifo').value;
  if(presionRaw===''){ toast('Indica la presión del grifo'); return; }
  const tieneHallazgo = document.getElementById('fTieneHallazgo').value;
  if(tieneHallazgo==='si' && hallazgosAgregados.length===0){ toast('Agrega al menos un hallazgo, o marca "No" si la inspección no encontró novedades'); return; }

  const llActual = formMarkerActual.getLatLng();
  const llIdeal = formMarkerIdeal ? formMarkerIdeal.getLatLng() : null;
  const id = uid();
  const btn = document.getElementById('btnGuardarInspeccion');
  if(btn){ btn.disabled = true; btn.textContent = 'Guardando…'; }

  const [fotoGrifoUrl, fotoOperativoUrl, fotoPresionUrl, fotoCamaraUrl] = await Promise.all([
    subirFoto(pendingFotos.grifo, `hallazgos/${id}/grifo.jpg`),
    subirFoto(pendingFotos.operativo, `hallazgos/${id}/operativo.jpg`),
    subirFoto(pendingFotos.presion, `hallazgos/${id}/presion.jpg`),
    subirFoto(pendingFotos.camara, `hallazgos/${id}/camara.jpg`)
  ]);

  const codigoGrifo = document.getElementById('fCodigoGrifo').value.trim().toUpperCase() || null;
  const prioridad = tieneHallazgo==='si' ? criticidadMasSevera(hallazgosAgregados) : null;

  const nuevo = {
    id,
    origen: 'inspeccion',
    fecha_creacion: new Date().toISOString(),
    creado_por: 'Singemelec',
    codigo_grifo: codigoGrifo,
    comuna: catalogoMatchActual ? catalogoMatchActual.comuna : null,
    localidad: catalogoMatchActual ? catalogoMatchActual.localidad : null,
    modelo_grifo: catalogoMatchActual ? catalogoMatchActual.modelo : null,
    diametro_conexion: catalogoMatchActual ? catalogoMatchActual.diametro_conexion : null,
    ano_instalacion: catalogoMatchActual ? catalogoMatchActual.ano_instalacion : null,
    fecha_ejecucion: fechaEjecucion,
    horario_ejecucion: horarioEjecucion,
    presion_grifo: presionRaw,
    tiene_hallazgo: tieneHallazgo,

    descripcion: document.getElementById('fDescripcion').value,

    comentarios: tieneHallazgo==='si' ? [{autor:'Singemelec', fecha:new Date().toISOString(), texto:'Hallazgo detectado durante inspección diaria.', estado_anterior:null, estado_nuevo:'pendiente', foto_antes:null, foto_despues:null}] : []
  };

  if(STORAGE_MODE === 'remote' && firebaseReady){
    try{
      const {id: _omit, ...datos} = nuevo;
      await db.collection('hallazgos').doc(id).set(datos);
    }catch(e){

      HALLAZGOS.unshift(nuevo);
      guardarLocal();

  } else {

    guardarLocal();
  }

  toast(tieneHallazgo==='si' ? 'Inspección guardada — hallazgo registrado' : 'Inspección guardada — sin novedad');

/* Devuelve la lista de hallazgos (grifo/cámara) de un registro, sea que
   use el esquema nuevo (hallazgos_detalle: array) o el esquema anterior
   de campos planos (tipo_hallazgo/tipo_elemento/requiere_pintura), para
   que la lista, el detalle y el reporte funcionen igual con documentos
   guardados antes de este cambio. */
function obtenerDetalleHallazgos(h){
  if(h.hallazgos_detalle && h.hallazgos_detalle.length) return h.hallazgos_detalle;
  if(h.tipo_hallazgo) return [{tipo_elemento:h.tipo_elemento, tipo_hallazgo:h.tipo_hallazgo, requiere_pintura:h.requiere_pintura}];
  return [];
}

/* Busca el código de grifo en el catastro cargado y, si existe, autocompleta
   dirección y ubicación (marcador "ideal") en el formulario de Nuevo hallazgo.
   Si el marcador "real" todavía no se ha puesto a mano, también lo deja ahí
   como punto de partida — el usuario lo puede reubicar haciendo clic en el
   mapa si el grifo está físicamente en otro punto. */
function aplicarCatalogoGrifo(code){
  const info = document.getElementById('catalogoInfo');
  if(!code){
    catalogoMatchActual = null;
    if(info){ info.style.color = ''; info.textContent = catalogoGrifosListo ? `Si el código está en el catastro (${Object.keys(CATALOGO_GRIFOS).length} grifos cargados), se completan automáticamente dirección y ubicación.` : 'Catastro de grifos no disponible sin conexión: puedes completar los datos manualmente.'; }
    return;
  }
  const match = CATALOGO_GRIFOS[code];
  if(!match){
    catalogoMatchActual = null;
    if(info){ info.style.color = 'var(--senal)'; info.textContent = '⚠ Código no encontrado en el catastro. Puedes continuar y completar los datos manualmente.'; }
    return;
  }
  catalogoMatchActual = match;
  if(info){
    info.style.color = 'var(--musgo)';
    info.textContent = `✓ ${match.modelo || 'Grifo'} · Ø${match.diametro_conexion || '?'}mm · ${match.localidad}, ${match.comuna}${match.ano_instalacion ? ` · instalado ${match.ano_instalacion}` : ''}`;
  }

  const dirCompuesta = [match.ubicacion, match.localidad, match.comuna].filter(Boolean).join(', ');
  document.getElementById('fDireccion').value = dirCompuesta;

  const ll = {lat: match.lat, lng: match.lng};
  if(formMarkerIdeal) formMap.removeLayer(formMarkerIdeal);
  formMarkerIdeal = L.circleMarker(ll,{radius:8,color:'#fff',weight:2,fillColor:'#3B6E8F',fillOpacity:1}).addTo(formMap);
  formMarkerIdeal.bindTooltip('Ideal (catastro)').openTooltip();

  if(!formMarkerActual){
    formMarkerActual = L.circleMarker(ll,{radius:8,color:'#fff',weight:2,fillColor:'#C8334D',fillOpacity:1}).addTo(formMap);
    formMarkerActual.bindTooltip('Grifo').openTooltip();
  }
  formMap.setView(ll, 17);
  updateCoordsInfo();
}

function updateCoordsInfo(){
  let txt = '';
  if(formMarkerActual){ const ll=formMarkerActual.getLatLng(); txt += `Grifo: ${ll.lat.toFixed(5)}, ${ll.lng.toFixed(5)}  `; }
  if(formMarkerIdeal){ const ll=formMarkerIdeal.getLatLng(); txt += `Ideal: ${ll.lat.toFixed(5)}, ${ll.lng.toFixed(5)}`; }
  document.getElementById('coordsInfo').textContent = txt;
}

async function searchAddress(q){
  try{
    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=5&q=${encodeURIComponent(q)}`);
    const data = await res.json();
    const box = document.getElementById('addrSuggestions');
    box.innerHTML = `<div style="position:absolute;z-index:500;background:#fff;border:1px solid var(--line);border-radius:6px;width:100%;max-height:180px;overflow-y:auto;box-shadow:0 6px 14px rgba(0,0,0,.1);">${
      data.map(d=>`<div style="padding:8px 10px;font-size:12.5px;cursor:pointer;border-bottom:1px solid var(--line);" onmousedown="selectAddress(${d.lat},${d.lon},'${(d.display_name||'').replace(/'/g,"\\'")}')">${d.display_name}</div>`).join('')
    }</div>`;
  }catch(e){ /* silent */ }
}
function selectAddress(lat, lon, label){
  document.getElementById('fDireccion').value = label;
  document.getElementById('addrSuggestions').innerHTML = '';
  if(formMarkerActual) formMap.removeLayer(formMarkerActual);
  formMarkerActual = L.circleMarker([lat,lon],{radius:8,color:'#fff',weight:2,fillColor:'#C8334D',fillOpacity:1}).addTo(formMap);
  formMap.setView([lat,lon], 16);
  updateCoordsInfo();
}
async function reverseGeocode(lat,lng){
  try{
    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
    const data = await res.json();
    if(data && data.display_name) document.getElementById('fDireccion').value = data.display_name;
  }catch(e){}
}
function useGPS(){
  if(!navigator.geolocation){ toast('GPS no disponible en este dispositivo'); return; }
  navigator.geolocation.getCurrentPosition((pos)=>{
    const {latitude, longitude} = pos.coords;
    if(formMarkerActual) formMap.removeLayer(formMarkerActual);
    formMarkerActual = L.circleMarker([latitude,longitude],{radius:8,color:'#fff',weight:2,fillColor:'#C8334D',fillOpacity:1}).addTo(formMap);
    formMap.setView([latitude,longitude],16);
    reverseGeocode(latitude,longitude);
    updateCoordsInfo();
    toast('Ubicación GPS capturada');
  }, ()=>toast('No se pudo obtener la ubicación GPS'));
}

/* Lee un archivo de imagen, le estampa la fecha/hora encima y devuelve el
   dataURL resultante. Factorizado como Promise para poder reutilizarlo
   tanto en la carga de una sola foto (handlePhoto) como en la de varias
   fotos a la vez (handleFotoMulti). */
function procesarFotoArchivo(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = function(e){
      const img = new Image();
      img.onload = function(){
        const canvas = document.createElement('canvas');
        canvas.width = img.width; canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0);
        const stamp = fmtDate(new Date());
        const fontSize = Math.max(18, Math.round(img.width/40));
        ctx.font = `600 ${fontSize}px IBM Plex Mono, monospace`;
        const padding = fontSize*0.6;
        const textW = ctx.measureText(stamp).width;
        ctx.fillStyle = 'rgba(0,0,0,0.55)';
        ctx.fillRect(0, img.height-fontSize-padding*2, textW+padding*2, fontSize+padding*2);
        ctx.fillStyle = '#fff';
        ctx.textBaseline = 'middle';
        ctx.fillText(stamp, padding, img.height-fontSize/2-padding);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = () => reject(new Error('No se pudo leer la imagen'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('No se pudo leer el archivo'));
    reader.readAsDataURL(file);
  });
}

function handlePhoto(evt, tipo){
  const file = evt.target.files[0];
  if(!file) return;
  procesarFotoArchivo(file).then(dataUrl=>{
    pendingFotos[tipo] = dataUrl;
    const BOX_IDS = {grifo:'boxGrifo', hallazgo:'boxHallazgo', operativo:'boxOperativo', presion:'boxPresion', camara:'boxCamara'};
    const box = document.getElementById(BOX_IDS[tipo] || ('box'+tipo));
    if(box) box.innerHTML = `<img src="${dataUrl}">`;
  });
}

/* Selector de VARIAS fotos para un mismo campo (a diferencia de
   pendingFotos/handlePhoto, que guardan una sola). Se usa al ingresar un
   hallazgo (fotos del grifo y del hallazgo) y al registrar una solución
   (fotos de respaldo). Cada campo acumula un arreglo de dataURLs en
   pendingFotosMulti[tipo], mostrado como una grilla de miniaturas con una
   casilla "+ Agregar foto" y una "x" para quitar cada una antes de guardar. */
let pendingFotosMulti = {grifo:[], hallazgo:[], despues:[]};

function handleFotoMulti(evt, tipo){
  const files = Array.from(evt.target.files || []);
  if(!files.length) return;
  Promise.all(files.map(procesarFotoArchivo)).then(urls=>{
    if(!pendingFotosMulti[tipo]) pendingFotosMulti[tipo] = [];
    pendingFotosMulti[tipo].push(...urls);
    renderGridFotosMulti(tipo);
  }).catch(()=> toast('No se pudo procesar una de las fotos'));
  evt.target.value = '';
}

function quitarFotoMulti(tipo, idx){
  if(!pendingFotosMulti[tipo]) return;
  pendingFotosMulti[tipo].splice(idx,1);
  renderGridFotosMulti(tipo);
}

function renderGridFotosMulti(tipo){
  const cont = document.getElementById('gridMulti_'+tipo);
  if(!cont) return;
  const items = pendingFotosMulti[tipo] || [];
  cont.innerHTML = items.map((url,i)=>`
    <div class="multi-foto-item">
      <img src="${url}">
      <button type="button" class="multi-foto-x" onclick="quitarFotoMulti('${tipo}', ${i})" title="Quitar foto">&times;</button>
    </div>`).join('') +
    `<div class="multi-foto-add" onclick="document.getElementById('inputMulti_${tipo}').click()">+ Agregar<br>foto</div>`;
}

async function guardarHallazgo(){
  if(hallazgosAgregados.length===0){ toast('Agrega al menos un hallazgo (grifo o cámara) antes de guardar'); return; }
  if(!document.getElementById('fRevisionOk').checked){ toast('Marca la casilla de revisión antes de guardar'); return; }
  if(!formMarkerActual){ toast('Marca la ubicación real del grifo en el mapa'); return; }
  // La criticidad ya no se elige a mano: es automática, la peor (más
  // severa) entre todos los hallazgos agregados a este registro.
  const prioridad = criticidadMasSevera(hallazgosAgregados);
  const llActual = formMarkerActual.getLatLng();
  const llIdeal = formMarkerIdeal ? formMarkerIdeal.getLatLng() : null;
  const id = uid();
  const btn = document.querySelector('#formNuevo button.btn-primary');
  if(btn){ btn.disabled = true; btn.textContent = 'Guardando…'; }

  const [fotosGrifoUrls, fotosHallazgoUrls] = await Promise.all([
    Promise.all((pendingFotosMulti.grifo||[]).map((url,i)=> subirFoto(url, `hallazgos/${id}/grifo_${i}.jpg`))),
    Promise.all((pendingFotosMulti.hallazgo||[]).map((url,i)=> subirFoto(url, `hallazgos/${id}/hallazgo_${i}.jpg`)))
  ]);

  const codigoGrifo = document.getElementById('fCodigoGrifo').value.trim().toUpperCase() || null;

  const nuevo = {
    id,
    fecha_creacion: new Date().toISOString(),
    creado_por: 'Singemelec',
    codigo_grifo: codigoGrifo,
    comuna: catalogoMatchActual ? catalogoMatchActual.comuna : null,
    localidad: catalogoMatchActual ? catalogoMatchActual.localidad : null,
    modelo_grifo: catalogoMatchActual ? catalogoMatchActual.modelo : null,
    diametro_conexion: catalogoMatchActual ? catalogoMatchActual.diametro_conexion : null,
    ano_instalacion: catalogoMatchActual ? catalogoMatchActual.ano_instalacion : null,
    hallazgos_detalle: hallazgosAgregados.slice(),
    direccion: document.getElementById('fDireccion').value || 'Sin dirección registrada',
    lat: llActual.lat, lng: llActual.lng,
    ideal_lat: llIdeal? llIdeal.lat : null, ideal_lng: llIdeal? llIdeal.lng : null,
    foto_grifo: fotosGrifoUrls[0] || null,
    fotos_grifo: fotosGrifoUrls,
    foto_hallazgo: fotosHallazgoUrls[0] || null,
    fotos_hallazgo: fotosHallazgoUrls,
    foto_respaldo: null,
    descripcion: document.getElementById('fDescripcion').value,
    prioridad,
    estado: 'pendiente',
    // El historial arranca con este primer registro para que la traza quede
    // completa desde el ingreso en terreno, no solo desde la primera
    // actualización de Sacyr.
    comentarios: [{autor:'Singemelec', fecha:new Date().toISOString(), texto:'Hallazgo ingresado en terreno.', estado_anterior:null, estado_nuevo:'pendiente', foto:null}]
  };

  if(STORAGE_MODE === 'remote' && firebaseReady){
    try{
      const {id: _omit, ...datos} = nuevo;
      await db.collection('hallazgos').doc(id).set(datos);
      // el listener en tiempo real (onSnapshot) actualiza la vista en todos los dispositivos
    }catch(e){
      console.error(e);
      toast('Sin conexión a la base de datos compartida: guardando solo en este dispositivo');
      HALLAZGOS.unshift(nuevo);
      guardarLocal();
    }
  } else {
    HALLAZGOS.unshift(nuevo);
    guardarLocal();
  }

  toast('Hallazgo guardado correctamente');
  goPage('lista');
}

    return `<div class="estado-col">

          <tbody>${items.length ? items.map(filaHallazgo).join('') : `<tr class="empty-row"><td colspan="8">Sin hallazgos aquí con los filtros activos.</td></tr>`}</tbody>
        </table>
      </div>
    </div>`;
  }).join('');

  actualizarBarraSeleccion();
}

function toggleSeleccion(id){
  if(SELECCION_LISTA.has(id)) SELECCION_LISTA.delete(id);
  else SELECCION_LISTA.add(id);
  const fila = document.querySelector(`tr[data-id="${id}"]`);
  if(fila) fila.classList.toggle('selected', SELECCION_LISTA.has(id));
  actualizarBarraSeleccion();
}

function limpiarSeleccion(){
  SELECCION_LISTA.clear();
  renderLista();
}

  renderLista();
}

function cambiarFiltroHallazgoTipo(valor){
  FILTRO_HALLAZGO_TIPO = valor;
  renderLista();
}

function cambiarFiltroPrioridadLista(valor){
  FILTRO_PRIORIDAD_LISTA = valor;
  renderLista();
}

// Filtro de texto libre por código de grifo en la pestaña Hallazgos. Como
// renderLista() vuelve a armar todo el HTML en cada tecla, hay que
// restaurar manualmente el foco y la posición del cursor del input después
// de re-renderizar, o el usuario perdería el foco a cada letra escrita.
function filtrarPorCodigo(valor){
  FILTRO_CODIGO = valor;
  const activo = document.activeElement;
  const teniaFoco = activo && activo.id === 'filtroCodigoInput';
  const cursor = teniaFoco ? activo.selectionStart : null;
  renderLista();
  if(teniaFoco){
    const el = document.getElementById('filtroCodigoInput');
    if(el){ el.focus(); if(cursor!=null) el.setSelectionRange(cursor, cursor); }
  }
}

// Un solo lugar que decide si un hallazgo pasa TODOS los filtros activos de
// la pestaña Hallazgos (zona, código, comuna, tipo de hallazgo y prioridad).
// Se usa tanto para pintar la lista como para saber qué exportar (informe
// HTML y los tres Excel) cuando hay filtros aplicados.
function pasaFiltrosLista(h){
  if(FILTRO_ZONA!=='todos' && zonaDeHallazgo(h)!==FILTRO_ZONA) return false;
  const codigoBuscado = FILTRO_CODIGO.trim().toUpperCase();
  if(codigoBuscado && !(h.codigo_grifo||'').toUpperCase().includes(codigoBuscado)) return false;
  if(FILTRO_COMUNA_LISTA!=='todos' && h.comuna!==FILTRO_COMUNA_LISTA) return false;
  if(FILTRO_PRIORIDAD_LISTA!=='todos' && criticidadDeRegistro(h)!==FILTRO_PRIORIDAD_LISTA) return false;
  if(FILTRO_HALLAZGO_TIPO!=='todos'){
    const tieneEseTipo = obtenerDetalleHallazgos(h).some(d=>d.tipo_hallazgo===FILTRO_HALLAZGO_TIPO);
    if(!tieneEseTipo) return false;
  }
  return true;
}

// Ids de los hallazgos que cumplen los filtros activos de la pestaña
// Hallazgos, o null si no hay ningún filtro aplicado (todos los filtros en
// su valor por defecto) — en ese caso el informe/Excel se genera con todo,
// igual que antes de que existieran estos filtros.
function idsSegunFiltrosActivos(){
  const sinFiltros = FILTRO_ZONA==='todos' && !FILTRO_CODIGO.trim() && FILTRO_COMUNA_LISTA==='todos' && FILTRO_PRIORIDAD_LISTA==='todos' && FILTRO_HALLAZGO_TIPO==='todos';
  if(sinFiltros) return null;
  return HALLAZGOS.filter(tieneHallazgoReal).filter(pasaFiltrosLista).map(h=>h.id);
}

function actualizarBarraSeleccion(){
  const bar = document.getElementById('listActions');
  if(!bar) return;
  const n = SELECCION_LISTA.size;
  bar.style.display = n>0 ? 'flex' : 'none';
  const count = document.getElementById('seleccionCount');
  if(count) count.textContent = `${n} hallazgo${n===1?'':'s'} seleccionado${n===1?'':'s'}`;
}

/* Doble confirmación (no usa confirm() nativo) antes de eliminar en forma
   permanente los hallazgos seleccionados: un primer paso muestra qué se va
   a borrar, y solo al confirmar ese paso aparece un segundo paso, más
   explícito, que es el que realmente dispara el borrado. Así se evita un
   clic accidental que elimine hallazgos sin querer. */
function confirmarEliminacion(){
  if(SELECCION_LISTA.size===0) return;
  const modalBg = document.getElementById('modalBg');
  const modal = document.getElementById('modalContent');
  if(!modalBg || !modal) return;
  const n = SELECCION_LISTA.size;
  const direcciones = Array.from(SELECCION_LISTA).map(id=>{
    const h = HALLAZGOS.find(x=>x.id===id);
    return h ? (h.codigo_grifo ? `Grifo ${h.codigo_grifo} — ${h.direccion||'sin dirección'}` : (h.direccion||'sin dirección')) : null;
  }).filter(Boolean);
  modal.innerHTML = `
    <button class="closeX" onclick="closeModal()">&times;</button>
    <h2>Eliminar hallazgo${n===1?'':'s'}</h2>
    <p style="font-size:13.5px;color:var(--text);">Vas a eliminar ${n} hallazgo${n===1?'':'s'} seleccionado${n===1?'':'s'}:</p>
    <ul style="font-size:12.5px;color:var(--text-soft);max-height:160px;overflow:auto;margin:0 0 12px;padding-left:18px;">
      ${direcciones.map(d=>`<li>${d}</li>`).join('')}
    </ul>
    <div style="display:flex;gap:8px;margin-top:16px;">
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-danger btn-sm" onclick="confirmarEliminacionPaso2()">Continuar</button>
    </div>
  `;
  modalBg.classList.add('open');
}

/* Segundo paso de la confirmación: recién acá se dispara el borrado real. */
function confirmarEliminacionPaso2(){
  const modal = document.getElementById('modalContent');
  if(!modal) return;
  const n = SELECCION_LISTA.size;
  modal.innerHTML = `
    <button class="closeX" onclick="closeModal()">&times;</button>
    <h2 style="color:var(--hidrante);">¿Confirmas definitivamente?</h2>
    <p style="font-size:13.5px;color:var(--text);">Esta es la confirmación final: ${n} hallazgo${n===1?'':'s'} se va${n===1?'':'n'} a eliminar de forma <strong>permanente</strong>, junto con sus fotos e historial. Esta acción no se puede deshacer.</p>
    <div style="display:flex;gap:8px;margin-top:16px;">
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-danger btn-sm" onclick="ejecutarEliminacion()">Sí, eliminar definitivamente</button>
    </div>
  `;
}

async function ejecutarEliminacion(){
  const ids = Array.from(SELECCION_LISTA);
  closeModal();
  if(ids.length===0) return;
  if(STORAGE_MODE === 'remote' && firebaseReady){
    try{
      const batch = db.batch();
      ids.forEach(id => batch.delete(db.collection('hallazgos').doc(id)));
      await batch.commit();
      ids.forEach(id => borrarFotosHallazgo(id)); // best-effort, no bloquea la UI
    }catch(e){
      console.error(e);
      toast('No se pudo eliminar: revisa tu conexión e intenta nuevamente');
      return;
    }
  } else {
    HALLAZGOS = HALLAZGOS.filter(h => !ids.includes(h.id));
    guardarLocal();
  }
  SELECCION_LISTA.clear();
  toast(`${ids.length} hallazgo${ids.length===1?'':'s'} eliminado${ids.length===1?'':'s'}`);
  render();
}

/* Borra las fotos asociadas a un hallazgo en Cloud Storage. Es "best effort":
   si falla (por ejemplo la carpeta no existe o hay un error de permisos)
   no interrumpe el resto del flujo de eliminación. */
async function borrarFotosHallazgo(id){
  if(!storageRef) return;
  try{
    const folder = storageRef.ref().child('hallazgos/'+id);
    const listado = await folder.listAll();
    await Promise.all(listado.items.map(item => item.delete().catch(()=>{})));
  }catch(e){
    // sin bloquear: puede que la carpeta no exista o no haya fotos
  }
}

function closeModal(){

async function actualizarHallazgo(id){
  const h = HALLAZGOS.find(x=>x.id===id);
  if(!h) return;

  const nuevoEstado = document.getElementById('estadoSelect').value;
  const txt = document.getElementById('nuevoComentario').value.trim();
  const estadoCambio = nuevoEstado !== h.estado;

  const fotosDespuesArr = pendingFotosMulti.despues || [];
  const fotosDespuesUrls = await Promise.all(fotosDespuesArr.map((url,i)=> subirFoto(url, `hallazgos/${id}/respaldo_despues_${Date.now()}_${i}.jpg`)));

  if(!txt && fotosDespuesUrls.length===0 && !estadoCambio){
    toast('No hay cambios que guardar');
    return;
  }

  // Cada actualización queda como una entrada nueva del historial (nunca se
  // sobrescribe ni se pierde una anterior), con su estado y sus fotos de
  // respaldo propias, para que la traza completa (ingreso → desarrollo →
  // ejecución) quede siempre disponible en el detalle del hallazgo.
  const nuevosComentarios = h.comentarios.slice();
  nuevosComentarios.push({
    autor: ROLE==='singemelec' ? 'Singemelec' : 'Sacyr Aguas',
    fecha: new Date().toISOString(),
    texto: txt || (estadoCambio ? `Estado actualizado a "${ESTADO_LABEL[nuevoEstado]}".` : 'Se agregó foto de respaldo.'),
    estado_anterior: estadoCambio ? h.estado : null,
    estado_nuevo: estadoCambio ? nuevoEstado : null,
    foto_antes: null,
    foto_despues: fotosDespuesUrls[0] || null,
    fotos_despues: fotosDespuesUrls
  });

  // foto_respaldo guarda siempre la más reciente que exista — se usa como
  // miniatura rápida en la lista, el detalle y el reporte; el historial de
  // arriba conserva todas las fotos de respaldo anteriores, ninguna se pierde.
  const fotoRespaldoUrl = fotosDespuesUrls[0] || h.foto_respaldo;

  const cambios = { estado: nuevoEstado, foto_respaldo: fotoRespaldoUrl, comentarios: nuevosComentarios };

  if(STORAGE_MODE === 'remote' && firebaseReady){
    try{
      await db.collection('hallazgos').doc(id).update(cambios);
    }catch(e){
      console.error(e);
      toast('Sin conexión: actualización guardada solo en este dispositivo');
      Object.assign(h, cambios);
      guardarLocal();
    }
  } else {
    Object.assign(h, cambios);
    guardarLocal();
  }

  pendingFotosMulti.despues = [];
  toast('Actualización guardada');
  closeModal();
  render();
}

   guardadas. Solo disponible para Singemelec, que es quien registra e
   ingresa los hallazgos en terreno. */

   edición) o lo cierre debe llamar esto primero: si queda un mapa Leaflet

   se limpió a tiempo), Leaflet puede fallar más tarde al intentar
   reposicionar un tile/marker sobre un elemento que ya no existe
   ("Cannot read properties of null (reading 'style')"). Se limpia siempre
   de forma síncrona ANTES de reemplazar el HTML, nunca después. */

  if(detailMap){ detailMap.remove(); detailMap=null; }

    </div>
    <div class="field">
      <label>Ubicación del grifo</label>
      <small>Clic normal = ubicación real del grifo · Clic con tecla Shift = ubicación ideal</small>
      <div id="editMiniMap" class="geo-map-mini"></div>
      <div class="legend">
        <span><i style="background:#C8334D"></i>Grifo (ubicación real)</span>
        <span><i style="background:#3B6E8F"></i>Ubicación ideal</span>
      </div>
    </div>
    <div style="display:flex;gap:8px;margin-top:12px;">
      <button class="btn btn-ghost btn-sm" onclick="openDetail('${h.id}')">Cancelar</button>
      <button class="btn btn-primary btn-sm" onclick="guardarEdicionHallazgo('${h.id}')">Guardar cambios</button>
    </div>
  `;
  renderListaHallazgosEdicion();
  setTimeout(()=>{
    // El modal pudo haberse cerrado o reemplazado (p.ej. "Cancelar" o
    // "Guardar cambios" ya volvieron al detalle) antes de que esto corriera.
    if(!document.getElementById('editMiniMap')) return;
    if(editMap){ editMap.remove(); editMap=null; }
    const centro = (typeof h.lat==='number' && typeof h.lng==='number') ? [h.lat,h.lng] : [-33.0245,-71.5518];
    editMap = L.map('editMiniMap').setView(centro, (typeof h.lat==='number')?16:13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(editMap);
    editMarkerActual = (typeof h.lat==='number') ? L.circleMarker(centro,{radius:8,color:'#fff',weight:2,fillColor:'#C8334D',fillOpacity:1}).addTo(editMap) : null;
    if(editMarkerActual) editMarkerActual.bindTooltip('Grifo');
    editMarkerIdeal = (typeof h.ideal_lat==='number') ? L.circleMarker([h.ideal_lat,h.ideal_lng],{radius:8,color:'#fff',weight:2,fillColor:'#3B6E8F',fillOpacity:1}).addTo(editMap) : null;
    if(editMarkerIdeal) editMarkerIdeal.bindTooltip('Ideal');
    editMap.on('click', (e)=>{
      if(e.originalEvent.shiftKey){
        if(editMarkerIdeal) editMap.removeLayer(editMarkerIdeal);
        editMarkerIdeal = L.circleMarker(e.latlng,{radius:8,color:'#fff',weight:2,fillColor:'#3B6E8F',fillOpacity:1}).addTo(editMap);
        editMarkerIdeal.bindTooltip('Ideal').openTooltip();
      } else {
        if(editMarkerActual) editMap.removeLayer(editMarkerActual);
        editMarkerActual = L.circleMarker(e.latlng,{radius:8,color:'#fff',weight:2,fillColor:'#C8334D',fillOpacity:1}).addTo(editMap);
        editMarkerActual.bindTooltip('Grifo').openTooltip();
      }
    });
  }, 50);
}

function agregarHallazgoDetalleEdicion(){
  const tipo_hallazgo = document.getElementById('eTipoHallazgo').value;
  const info = hallazgoInfo(tipo_hallazgo);
  if(!info) return;
  const yaExiste = editHallazgosDetalle.some(h=>h.tipo_hallazgo===tipo_hallazgo);
  if(yaExiste){ toast('Ese hallazgo ya está agregado a este registro'); return; }
  editHallazgosDetalle.push({tipo_elemento: info.tipo_elemento, tipo_hallazgo, criticidad: info.criticidad});
  renderListaHallazgosEdicion();
}

function quitarHallazgoDetalleEdicion(i){
  editHallazgosDetalle.splice(i,1);
  renderListaHallazgosEdicion();
}

function renderListaHallazgosEdicion(){
  const cont = document.getElementById('listaHallazgosEdicion');
  if(!cont) return;
  if(editHallazgosDetalle.length===0){
    cont.innerHTML = '<em style="font-size:12px;color:var(--text-soft);">Sin hallazgos agregados — agrega al menos uno.</em>';
    return;
  }
  cont.innerHTML = editHallazgosDetalle.map((h,i)=>`
    <span class="chip"><i class="dot" style="background:${PRIORIDAD_COLOR[h.criticidad]}"></i>${h.tipo_elemento==='camara'?'Cámara':'Grifo'} · ${h.tipo_hallazgo}
      <button type="button" onclick="quitarHallazgoDetalleEdicion(${i})" title="Quitar">&times;</button>
    </span>
  `).join('');
}

async function guardarEdicionHallazgo(id){
  const h = HALLAZGOS.find(x=>x.id===id);
  if(!h) return;
  const puedeEditarHallazgos = !esInspeccion(h) || tieneHallazgoReal(h);
  if(puedeEditarHallazgos && editHallazgosDetalle.length===0){
    toast('Debe quedar al menos un hallazgo agregado');
    return;
  }
  const codigoGrifo = document.getElementById('eCodigoGrifo').value.trim().toUpperCase() || null;
  const direccion = document.getElementById('eDireccion').value.trim() || 'Sin dirección registrada';
  const descripcion = document.getElementById('eDescripcion').value;

  const cambios = { codigo_grifo: codigoGrifo, direccion, descripcion };
  if(puedeEditarHallazgos){
    cambios.hallazgos_detalle = editHallazgosDetalle.slice();
    cambios.prioridad = criticidadMasSevera(editHallazgosDetalle);
  }
  if(editMarkerActual){
    const ll = editMarkerActual.getLatLng();
    cambios.lat = ll.lat; cambios.lng = ll.lng;
  }
  if(editMarkerIdeal){
    const ll = editMarkerIdeal.getLatLng();
    cambios.ideal_lat = ll.lat; cambios.ideal_lng = ll.lng;
  } else {
    cambios.ideal_lat = null; cambios.ideal_lng = null;
  }

  if(STORAGE_MODE === 'remote' && firebaseReady){
    try{
      await db.collection('hallazgos').doc(id).update(cambios);
    }catch(e){
      console.error(e);
      toast('Sin conexión: cambios guardados solo en este dispositivo');
      Object.assign(h, cambios);
      guardarLocal();
    }
  } else {
    Object.assign(h, cambios);
    guardarLocal();
  }

  toast('Hallazgo actualizado');
  openDetail(id);
}
