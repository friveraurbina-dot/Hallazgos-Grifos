<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catastro de Grifos — Singemelec / Sacyr Aguas</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-storage-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16323A;
  --ink-2:#1F4350;
  --concrete:#EDE7DC;
  --concrete-2:#F7F4ED;
  --paper:#FFFFFF;
  --hidrante:#C8334D;
  --senal:#E2A33D;
  --tuberia:#3B6E8F;
  --musgo:#5C8A60;
  --line:#D9D2C2;
  --text:#1B2A2E;
  --text-soft:#5C6B6E;
  --radius:10px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'IBM Plex Sans',sans-serif;
  background:var(--concrete);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.02em;}
.mono{font-family:'IBM Plex Mono',monospace;}
#app{display:flex;flex-direction:column;height:100vh;}

/* HEADER */
header.topbar{
  background:var(--ink);
  color:#fff;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;height:64px;flex-shrink:0;
  border-bottom:3px solid var(--senal);
}
.brand{display:flex;align-items:center;gap:14px;}
.brand .mark{
  width:36px;height:36px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, var(--hidrante), #8c1f33 80%);
  display:flex;align-items:center;justify-content:center;
  font-family:'Oswald',sans-serif;font-weight:700;color:#fff;font-size:14px;
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.25);
}
.brand .name{font-family:'Oswald',sans-serif;font-size:17px;letter-spacing:.04em;line-height:1.1;}
.brand .name small{display:block;font-family:'IBM Plex Mono',monospace;font-size:10px;color:#9fb3b9;text-transform:none;letter-spacing:.02em;}
.role-switch{display:flex;align-items:center;gap:10px;}
.role-pill{
  font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.05em;
  padding:6px 12px;border-radius:20px;border:1px solid rgba(255,255,255,.25);
  background:rgba(255,255,255,.06);color:#cfe3e7;cursor:pointer;transition:.15s;
}
.role-pill.active{background:var(--senal);color:#231a02;border-color:var(--senal);font-weight:600;}

/* LAYOUT */
.body-grid{display:flex;flex:1;min-height:0;}
nav.rail{
  width:190px;background:var(--ink-2);color:#dfe9eb;flex-shrink:0;
  padding:18px 0;display:flex;flex-direction:column;gap:2px;
}
nav.rail button{
  all:unset;cursor:pointer;padding:13px 22px;font-family:'IBM Plex Sans',sans-serif;
  font-size:13.5px;font-weight:500;color:#bcd0d4;border-left:3px solid transparent;
}
nav.rail button:hover{background:rgba(255,255,255,.05);color:#fff;}
nav.rail button.active{background:rgba(255,255,255,.08);color:#fff;border-left-color:var(--senal);}
nav.rail .rail-foot{margin-top:auto;padding:14px 22px;font-size:10.5px;color:#7d979b;font-family:'IBM Plex Mono',monospace;line-height:1.5;}

main{flex:1;overflow-y:auto;padding:24px 28px 60px;}
.page{max-width:1300px;margin:0 auto;}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.page-head h1{font-size:24px;margin:0;color:var(--ink);}
.page-head p{margin:2px 0 0;color:var(--text-soft);font-size:13px;}

/* CARDS / KPI */
.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px;}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;position:relative;overflow:hidden;}
.kpi .tab{position:absolute;left:0;top:0;bottom:0;width:5px;}
.kpi .num{font-family:'Oswald',sans-serif;font-size:30px;line-height:1;color:var(--ink);}
.kpi .lbl{font-size:11.5px;color:var(--text-soft);margin-top:6px;text-transform:uppercase;letter-spacing:.04em;}

.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:18px;}
.panel h3{font-size:14px;margin:0 0 12px;color:var(--ink);}
.grid-2{display:grid;grid-template-columns:1.4fr 1fr;gap:18px;}
@media(max-width:980px){.grid-2{grid-template-columns:1fr;}}

#dashMap{height:430px;border-radius:8px;overflow:hidden;border:1px solid var(--line);}
.chart-wrap{position:relative;height:200px;margin-bottom:10px;}

/* LEGEND */
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--text-soft);}
.legend span{display:inline-flex;align-items:center;gap:6px;}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block;}

/* FORM */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:820px){.form-grid{grid-template-columns:1fr;}}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.field label{font-size:12px;font-weight:600;color:var(--ink);text-transform:uppercase;letter-spacing:.03em;}
.field input,.field select,.field textarea{
  font-family:'IBM Plex Sans',sans-serif;padding:9px 11px;border:1px solid var(--line);
  border-radius:6px;font-size:13.5px;background:#fff;color:var(--text);
}
.field textarea{resize:vertical;min-height:70px;}
.field small{color:var(--text-soft);font-size:11px;}
.btn{
  font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:13px;
  padding:10px 18px;border-radius:7px;border:none;cursor:pointer;transition:.15s;
}
.btn-primary{background:var(--ink);color:#fff;}
.btn-primary:hover{background:var(--ink-2);}
.btn-amber{background:var(--senal);color:#241a01;}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--text);}
.btn-sm{padding:6px 12px;font-size:12px;}
.btn[disabled]{opacity:.5;cursor:not-allowed;}

.geo-map-mini{height:240px;border-radius:8px;border:1px solid var(--line);margin-top:6px;}
.photo-box{
  border:1.5px dashed var(--line);border-radius:8px;padding:10px;text-align:center;
  background:var(--concrete-2);cursor:pointer;position:relative;min-height:140px;
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;
}
.photo-box img{max-width:100%;max-height:160px;border-radius:6px;}
.photo-box span{font-size:11.5px;color:var(--text-soft);}
.priority-opts{display:flex;gap:8px;}
.priority-opts label{flex:1;}
.priority-opts input{display:none;}
.priority-opts .opt{
  display:block;text-align:center;padding:9px 6px;border-radius:7px;border:2px solid var(--line);
  font-size:12px;font-weight:600;cursor:pointer;color:var(--text-soft);background:#fff;
}
.priority-opts input:checked + .opt.inmediato{border-color:var(--hidrante);background:#fdecef;color:var(--hidrante);}
.priority-opts input:checked + .opt.corto{border-color:var(--senal);background:#fdf3e1;color:#8a6109;}
.priority-opts input:checked + .opt.mediano{border-color:var(--tuberia);background:#e9f1f5;color:var(--tuberia);}

/* LIST */
.findings-list{display:flex;flex-direction:column;gap:10px;}
.fcard{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
.fcard .tag{width:7px;flex-shrink:0;}
.fcard .fbody{padding:13px 16px;flex:1;}
.fcard .frow1{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;}
.fcard .fid{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-soft);}
.fcard .faddr{font-weight:600;font-size:14.5px;color:var(--ink);}
.fcard .fmeta{font-size:11.5px;color:var(--text-soft);margin-top:3px;}
.fcard .fselect{display:flex;align-items:center;padding:0 2px 0 12px;}
.fcard .fselect input{width:17px;height:17px;cursor:pointer;}
.fcard.selected{outline:2px solid var(--hidrante);outline-offset:-2px;}
.list-actions{display:flex;align-items:center;gap:12px;background:#fdecef;border:1px solid var(--hidrante);border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:12.5px;color:var(--hidrante);font-weight:700;flex-wrap:wrap;}
.zone-tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.zone-tab{font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:12.5px;padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--text-soft);cursor:pointer;transition:.15s;}
.zone-tab.active{background:var(--ink);border-color:var(--ink);color:#fff;}
.btn-danger{background:var(--hidrante);color:#fff;}
.btn-danger:hover{background:#a82440;}
.revision-box{background:var(--concrete-2);padding:10px 14px;border-radius:8px;border:1px solid var(--line);}
.revision-box label{display:flex;align-items:center;gap:8px;cursor:pointer;text-transform:none;font-size:13px;font-weight:500;color:var(--text);}
.revision-box input{width:16px;height:16px;cursor:pointer;}
.chips-list{display:flex;flex-wrap:wrap;gap:0;}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--concrete-2);border:1px solid var(--line);border-radius:16px;padding:5px 8px 5px 12px;font-size:12px;margin:0 6px 6px 0;color:var(--text);}
.chip button{background:none;border:none;cursor:pointer;color:var(--hidrante);font-weight:700;font-size:15px;line-height:1;padding:0 2px;}
.badge{font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:14px;text-transform:uppercase;letter-spacing:.03em;}
.badge.inmediato{background:#fdecef;color:var(--hidrante);}
.badge.corto{background:#fdf3e1;color:#8a6109;}
.badge.mediano{background:#e9f1f5;color:var(--tuberia);}
.badge.pendiente{background:#f1eee6;color:#7a7263;}
.badge.en_proceso{background:#eaf1ec;color:#3f6e46;}
.badge.resuelto{background:#e3f0e4;color:var(--musgo);}
.fcard .factions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.empty{padding:40px 20px;text-align:center;color:var(--text-soft);}
.empty .display{font-size:18px;color:var(--ink);margin-bottom:6px;}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(22,50,58,.55);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px;}
.modal-bg.open{display:flex;}
.modal{background:#fff;border-radius:12px;max-width:760px;width:100%;max-height:88vh;overflow-y:auto;padding:22px 24px;}
.modal h2{font-size:19px;margin:0 0 4px;color:var(--ink);}
.modal .closeX{float:right;cursor:pointer;font-size:20px;color:var(--text-soft);background:none;border:none;}
.detail-imgs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0;}
.detail-imgs figure{margin:0;}
.detail-imgs img{width:100%;border-radius:8px;border:1px solid var(--line);}
.detail-imgs figcaption{font-size:11px;color:var(--text-soft);margin-top:4px;}
#detailMap{height:220px;border-radius:8px;border:1px solid var(--line);margin:10px 0;}
.comment{background:var(--concrete-2);border-radius:8px;padding:9px 11px;margin-bottom:8px;font-size:13px;}
.comment .ca{font-size:11px;color:var(--text-soft);font-family:'IBM Plex Mono',monospace;margin-bottom:3px;}

.toast{position:fixed;bottom:22px;right:22px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:8px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:2000;opacity:0;transform:translateY(10px);transition:.25s;}
.toast.show{opacity:1;transform:translateY(0);}

.loading{padding:40px;text-align:center;color:var(--text-soft);}

/* ---------------- MOBILE ---------------- */
@media(max-width:720px){
  header.topbar{flex-wrap:wrap;height:auto;padding:10px 14px;gap:8px;}
  .brand .name{font-size:14px;}
  .role-switch{width:100%;justify-content:flex-end;}
  .body-grid{flex-direction:column;}
  nav.rail{
    width:100%;flex-direction:row;overflow-x:auto;padding:6px 10px;gap:4px;
    border-bottom:1px solid rgba(255,255,255,.1);
  }
  nav.rail button{padding:9px 14px;white-space:nowrap;border-left:none;border-bottom:3px solid transparent;}
  nav.rail button.active{border-left-color:transparent;border-bottom-color:var(--senal);}
  nav.rail .rail-foot{display:none;}
  main{padding:14px 12px 50px;}
  .page-head h1{font-size:19px;}
  .kpi-row{grid-template-columns:repeat(2,1fr);}
  .kpi .num{font-size:24px;}
  #dashMap{height:280px;}
  .form-grid{grid-template-columns:1fr;}
  .detail-imgs{grid-template-columns:1fr;}
  .modal{padding:16px;max-height:92vh;}
  .fcard .frow1{flex-direction:column;align-items:flex-start;gap:4px;}
}
</style>
</head>
<body>
<div id="lockScreen" style="position:fixed;inset:0;background:var(--ink);display:flex;align-items:center;justify-content:center;z-index:5000;padding:20px;">
  <div style="background:#fff;border-radius:12px;padding:32px 30px;max-width:340px;width:100%;text-align:center;">
    <div style="width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #C8334D, #8c1f33 80%);margin:0 auto 16px;box-shadow:inset 0 0 0 3px rgba(255,255,255,.25);"></div>
    <h2 style="font-family:'Oswald',sans-serif;text-transform:uppercase;margin:0 0 6px;font-size:17px;color:#16323A;">Catastro de Grifos</h2>
    <p style="font-size:12.5px;color:#5C6B6E;margin:0 0 18px;">Ingresa la clave de tu empresa para continuar.</p>
    <input type="password" id="accessInput" placeholder="Clave de acceso" style="width:100%;padding:10px 12px;border:1px solid #D9D2C2;border-radius:7px;font-size:14px;margin-bottom:10px;text-align:center;box-sizing:border-box;" onkeydown="if(event.key==='Enter') verificarAcceso();">
    <button style="width:100%;font-family:'IBM Plex Sans',sans-serif;font-weight:600;font-size:13px;padding:10px 18px;border-radius:7px;border:none;cursor:pointer;background:#16323A;color:#fff;" onclick="verificarAcceso()">Ingresar</button>
    <div id="accessError" style="color:#C8334D;font-size:12px;margin-top:10px;display:none;">Clave incorrecta. Intenta nuevamente.</div>
  </div>
</div>
<script>
/* ====================================================================
   CLAVES DE ACCESO — cámbialas antes de publicar la app.
   Cada clave identifica automáticamente a la empresa que ingresa.
   ==================================================================== */
const ACCESS_CODES = {
  "SINGEMELEC2026": "singemelec",
  "SACYR2026": "sacyr"
};
function verificarAcceso(){
  const val = document.getElementById('accessInput').value;
  const rolDetectado = ACCESS_CODES[val];
  if(rolDetectado){
    sessionStorage.setItem('grifos_access_ok','1');
    sessionStorage.setItem('grifos_session_role', rolDetectado);
    localStorage.setItem('grifos_role', rolDetectado);
    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('app').style.display = '';
    if(typeof setRole === 'function') setRole(rolDetectado);
  } else {
    document.getElementById('accessError').style.display = 'block';
  }
}
if(sessionStorage.getItem('grifos_access_ok')==='1'){
  document.getElementById('lockScreen').style.display = 'none';
  document.getElementById('app').style.display = '';
}
</script>
<div id="app" style="display:none;">

  <header class="topbar">
    <div class="brand">
      <div class="mark">SG</div>
      <div class="name">Catastro de Grifos<small>Singemelec — Sacyr Aguas</small></div>
    </div>
    <div class="role-switch">
      <span style="font-size:11px;color:#9fb3b9;font-family:'IBM Plex Mono',monospace;">CONECTADO COMO</span>
      <span class="role-pill active" id="roleLabel">—</span>
      <button class="role-pill" id="logoutBtn" onclick="cerrarSesion()" style="border-color:rgba(255,255,255,.3);">Salir</button>
    </div>
  </header>

  <div class="body-grid">
    <nav class="rail">
      <button class="navbtn active" data-page="dashboard" onclick="goPage('dashboard')">Tablero ejecutivo</button>
      <button class="navbtn" data-page="nuevo" id="navNuevo" onclick="goPage('nuevo')">Nuevo hallazgo</button>
      <button class="navbtn" data-page="lista" onclick="goPage('lista')">Hallazgos</button>
      <div class="rail-foot" id="railFoot">v1.0 · datos compartidos<br>entre ambas empresas</div>
    </nav>

    <main id="main"><div class="loading">Cargando catastro…</div></main>
  </div>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalContent"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ---------------- STATE ---------------- */
let ROLE = localStorage.getItem('grifos_role') || 'singemelec';
let HALLAZGOS = [];
let dashMapInstance = null;
let dashChart1 = null, dashChart2 = null;
let formMarkerActual = null, formMarkerIdeal = null, formMap = null;
let pendingFotos = {grifo:null, hallazgo:null};
let CATALOGO_GRIFOS = {}; // catastro oficial de grifos (Sacyr), por código, cargado desde Firestore
let catalogoGrifosListo = false;
let catalogoMatchActual = null; // datos del catastro para el código de grifo ingresado en el formulario actual
let SELECCION_LISTA = new Set(); // ids de hallazgos marcados para eliminar en la lista
let hallazgosAgregados = []; // hallazgos (grifo/cámara) agregados al registro que se está creando
let FILTRO_ZONA = 'todos'; // 'todos' | 'lampa' | 'metropolitana' — filtro de la pestaña Hallazgos

/* Determina la zona de un hallazgo según la comuna del grifo en el catastro
   (LAMPA => zona Lampa; LO BARNECHEA / COLINA => zona Metropolitana).
   Los hallazgos sin código de grifo (o cuyo código no está en el catastro)
   no tienen comuna registrada y quedan como "sin_zona". */
function zonaDeHallazgo(h){
  if(!h.comuna) return 'sin_zona';
  return h.comuna === 'LAMPA' ? 'lampa' : 'metropolitana';
}

const PRIORIDAD_LABEL = {inmediato:'Inmediato', corto:'Corto plazo', mediano:'Mediano plazo'};
const PRIORIDAD_COLOR = {inmediato:'#C8334D', corto:'#E2A33D', mediano:'#3B6E8F'};
const ESTADO_LABEL = {pendiente:'Pendiente', en_proceso:'En proceso', resuelto:'Resuelto'};
const HALLAZGOS_GRIFO = ['Vástago agripado','Obturador agripado','Válvula de pie cerrada','Filtración agua','Robo agua','Sin observación'];
const HALLAZGOS_CAMARA = ['Cámara no visible','Cámara con basura','Tapa cámara agripada','Cámara dañada','Cámara inundada','Sin observación'];

function uid(){ return 'H-' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2,6).toUpperCase(); }
function fmtDate(d){ const dt=new Date(d); return dt.toLocaleString('es-CL',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function toast(msg){ const t=document.getElementById('toast'); if(!t) return; t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }

/* ====================================================================
   CONFIGURACIÓN DE FIREBASE
   Reemplaza estos valores por los de tu propio proyecto de Firebase
   (Firebase Console → Configuración del proyecto → Tus apps → SDK).
   Mientras dejes "TU_API_KEY" la app funcionará en modo local
   (solo en este dispositivo, sin compartir datos entre empresas).
   Ver la guía adjunta para crear el proyecto, activar Firestore + Storage
   (plan Blaze) y las reglas de seguridad a pegar.
   ==================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyApa-zy4sV8iM1-MNgtIvRcev9j8CAve10",
  authDomain: "hallazgos-grifos-app.firebaseapp.com",
  projectId: "hallazgos-grifos-app",
  storageBucket: "hallazgos-grifos-app.firebasestorage.app",
  messagingSenderId: "156705018338",
  appId: "1:156705018338:web:9c35d7983923aaa123e9bb"
};

/* ---------------- STORAGE (Firestore, tiempo real + Storage para fotos) ----------------
   Cada hallazgo es un documento propio en la colección "hallazgos" (no un único
   documento gigante con todo el catastro), para no chocar con el límite de 1MB
   por documento de Firestore a medida que crece el catastro. Las fotos se suben
   a Firebase Storage y en el documento solo se guarda la URL. */
let STORAGE_MODE = 'local'; // se cambia a 'remote' si Firebase queda bien configurado
const LOCAL_KEY = 'grifos_hallazgos_local';
let db = null;
let storageRef = null;
let firebaseReady = false;
let unsubscribeHallazgos = null;

function initFirebase(){
  try{
    if(!firebaseConfig.apiKey || firebaseConfig.apiKey.indexOf('TU_API_KEY')>-1) throw new Error('sin-configurar');
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    storageRef = firebase.storage();
    firebaseReady = true;
    STORAGE_MODE = 'remote';
  }catch(e){
    firebaseReady = false;
    STORAGE_MODE = 'local';
  }
}

function suscribirHallazgos(onChange){
  if(!firebaseReady){
    try{
      const local = localStorage.getItem(LOCAL_KEY);
      HALLAZGOS = local ? JSON.parse(local) : [];
    }catch(e){ HALLAZGOS = []; }
    onChange();
    return;
  }
  if(unsubscribeHallazgos) unsubscribeHallazgos();
  unsubscribeHallazgos = db.collection('hallazgos').orderBy('fecha_creacion','desc').onSnapshot(
    (snap)=>{
      HALLAZGOS = snap.docs.map(d=>({id:d.id, ...d.data()}));
      onChange();
    },
    (err)=>{
      console.error(err);
      STORAGE_MODE = 'local';
      try{
        const local = localStorage.getItem(LOCAL_KEY);
        HALLAZGOS = local ? JSON.parse(local) : [];
      }catch(e2){ HALLAZGOS = []; }
      onChange();
    }
  );
}

/* Guarda solo en este dispositivo (modo local / sin conexión / Firebase no configurado). */
function guardarLocal(){
  try{
    localStorage.setItem(LOCAL_KEY, JSON.stringify(HALLAZGOS));
    render();
  }catch(e){ toast('Error al guardar. Intenta nuevamente.'); console.error(e); }
}

/* Carga el catastro oficial de grifos (Sacyr) desde Firestore, una sola vez, y lo
   deja en memoria (CATALOGO_GRIFOS) para autocompletar el formulario de "Nuevo
   hallazgo" al ingresar el código de grifo. Si no hay conexión remota, el
   formulario simplemente no autocompleta y se puede seguir llenando a mano. */
async function cargarCatalogoGrifos(){
  if(!(STORAGE_MODE === 'remote' && firebaseReady)) return;
  try{
    const snap = await db.collection('catalogo_grifos').get();
    const catalogo = {};
    snap.forEach(doc=>{ catalogo[doc.id] = doc.data(); });
    CATALOGO_GRIFOS = catalogo;
    catalogoGrifosListo = true;
    // Si el usuario ya estaba en "Nuevo hallazgo" cuando terminó de cargar el
    // catastro (carga en paralelo al render), refresca la lista de sugerencias.
    if(currentPage === 'nuevo'){
      const dl = document.getElementById('listaCodigosGrifo');
      if(dl) dl.innerHTML = Object.keys(CATALOGO_GRIFOS).sort().map(c=>`<option value="${c}">`).join('');
      const info = document.getElementById('catalogoInfo');
      if(info && !document.getElementById('fCodigoGrifo').value){
        info.textContent = `Si el código está en el catastro (${Object.keys(CATALOGO_GRIFOS).length} grifos cargados), se completan automáticamente dirección y ubicación.`;
      }
    }
  }catch(e){
    console.error('No se pudo cargar el catastro de grifos', e);
  }
}

/* Sube una foto (dataURL) a Firebase Storage y devuelve la URL pública de descarga.
   Si Firebase no está configurado, devuelve el dataURL tal cual (queda embebido
   localmente, como antes). */
async function subirFoto(dataUrl, path){
  if(!dataUrl) return null;
  if(!firebaseReady || !storageRef) return dataUrl;
  try{
    const blob = await (await fetch(dataUrl)).blob();
    const ref = storageRef.ref().child(path);
    await ref.put(blob);
    return await ref.getDownloadURL();
  }catch(e){
    console.error('Error subiendo foto a Storage', e);
    toast('No se pudo subir la foto a la nube; se guardó solo en este dispositivo');
    return dataUrl;
  }
}

/* Un mismo registro (una misma visita a un grifo) puede tener más de un
   hallazgo — por ejemplo uno de grifo y otro de cámara. Cada clic en
   "+ Agregar hallazgo a este registro" suma la combinación tipo+hallazgo
   actualmente seleccionada a `hallazgosAgregados`, que se guarda completa
   al presionar "Guardar hallazgo". El estado de pintura NO se adjunta acá:
   se agrega aparte, como su propio hallazgo (ver agregarPinturaDetalle). */
function agregarHallazgoDetalle(){
  const tipo_elemento = document.getElementById('fTipoElemento').value;
  const tipo_hallazgo = document.getElementById('fTipoHallazgo').value;
  const yaExiste = hallazgosAgregados.some(h=>h.tipo_elemento===tipo_elemento && h.tipo_hallazgo===tipo_hallazgo);
  if(yaExiste){ toast('Ese hallazgo ya fue agregado a este registro'); return; }
  hallazgosAgregados.push({tipo_elemento, tipo_hallazgo, requiere_pintura:null});
  renderListaHallazgosAgregados();
  toast('Hallazgo agregado al registro');
}

/* Agrega el estado de pintura del grifo como un hallazgo propio e
   independiente (p.ej. "Grifo · Requiere pintura"), sin mezclarlo con
   ningún otro hallazgo de grifo que se haya agregado (Vástago agripado,
   Filtración agua, etc.). Solo puede haber un estado de pintura por
   registro — para cambiarlo, se quita el chip existente y se agrega de nuevo. */
function agregarPinturaDetalle(){
  const valor = document.getElementById('fRequierePintura').value; // 'si' | 'no'
  const tipo_hallazgo = valor === 'si' ? 'Requiere pintura' : 'No requiere pintura';
  const yaExiste = hallazgosAgregados.some(h=>h.tipo_hallazgo==='Requiere pintura' || h.tipo_hallazgo==='No requiere pintura');
  if(yaExiste){ toast('Ya agregaste el estado de pintura a este registro; quítalo si quieres cambiarlo'); return; }
  hallazgosAgregados.push({tipo_elemento:'grifo', tipo_hallazgo, requiere_pintura:valor});
  renderListaHallazgosAgregados();
  toast('Hallazgo agregado al registro');
}

function quitarHallazgoDetalle(i){
  hallazgosAgregados.splice(i,1);
  renderListaHallazgosAgregados();
}

function renderListaHallazgosAgregados(){
  const cont = document.getElementById('listaHallazgosAgregados');
  if(!cont) return;
  if(hallazgosAgregados.length===0){
    cont.innerHTML = '<em style="font-size:12px;color:var(--text-soft);">Aún no se ha agregado ningún hallazgo. Agrega al menos uno antes de guardar.</em>';
    return;
  }
  cont.innerHTML = hallazgosAgregados.map((h,i)=>`
    <span class="chip">${h.tipo_elemento==='camara'?'Cámara':'Grifo'} · ${h.tipo_hallazgo}
      <button type="button" onclick="quitarHallazgoDetalle(${i})" title="Quitar">&times;</button>
    </span>
  `).join('');

/* Devuelve la lista de hallazgos (grifo/cámara) de un registro, sea que
   use el esquema nuevo (hallazgos_detalle: array) o el esquema anterior
   de campos planos (tipo_hallazgo/tipo_elemento/requiere_pintura), para
   que la lista, el detalle y el reporte funcionen igual con documentos
   guardados antes de este cambio. */
function obtenerDetalleHallazgos(h){
  if(h.hallazgos_detalle && h.hallazgos_detalle.length) return h.hallazgos_detalle;
  if(h.tipo_hallazgo) return [{tipo_elemento:h.tipo_elemento, tipo_hallazgo:h.tipo_hallazgo, requiere_pintura:h.requiere_pintura}];
  return [];
}

/* Busca el código de grifo en el catastro cargado y, si existe, autocompleta
   dirección y ubicación (marcador "ideal") en el formulario de Nuevo hallazgo.
   Si el marcador "real" todavía no se ha puesto a mano, también lo deja ahí
   como punto de partida — el usuario lo puede reubicar haciendo clic en el
   mapa si el grifo está físicamente en otro punto. */
function aplicarCatalogoGrifo(code){
  const info = document.getElementById('catalogoInfo');
  if(!code){
    catalogoMatchActual = null;
    if(info){ info.style.color = ''; info.textContent = catalogoGrifosListo ? `Si el código está en el catastro (${Object.keys(CATALOGO_GRIFOS).length} grifos cargados), se completan automáticamente dirección y ubicación.` : 'Catastro de grifos no disponible sin conexión: puedes completar los datos manualmente.'; }
    return;
  }
  const match = CATALOGO_GRIFOS[code];
  if(!match){
    catalogoMatchActual = null;
    if(info){ info.style.color = 'var(--senal)'; info.textContent = '⚠ Código no encontrado en el catastro. Puedes continuar y completar los datos manualmente.'; }
    return;
  }
  catalogoMatchActual = match;
  if(info){
    info.style.color = 'var(--musgo)';
    info.textContent = `✓ ${match.modelo || 'Grifo'} · Ø${match.diametro_conexion || '?'}mm · ${match.localidad}, ${match.comuna}${match.ano_instalacion ? ` · instalado ${match.ano_instalacion}` : ''}`;
  }

  const dirCompuesta = [match.ubicacion, match.localidad, match.comuna].filter(Boolean).join(', ');
  document.getElementById('fDireccion').value = dirCompuesta;

  const ll = {lat: match.lat, lng: match.lng};
  if(formMarkerIdeal) formMap.removeLayer(formMarkerIdeal);
  formMarkerIdeal = L.circleMarker(ll,{radius:8,color:'#fff',weight:2,fillColor:'#3B6E8F',fillOpacity:1}).addTo(formMap);
  formMarkerIdeal.bindTooltip('Ideal (catastro)').openTooltip();

  if(!formMarkerActual){
    formMarkerActual = L.circleMarker(ll,{radius:8,color:'#fff',weight:2,fillColor:'#C8334D',fillOpacity:1}).addTo(formMap);
    formMarkerActual.bindTooltip('Grifo').openTooltip();
  }
  formMap.setView(ll, 17);
  updateCoordsInfo();
}

function updateCoordsInfo(){
  let txt = '';
  if(formMarkerActual){ const ll=formMarkerActual.getLatLng(); txt += `Grifo: ${ll.lat.toFixed(5)}, ${ll.lng.toFixed(5)}  `; }
  if(formMarkerIdeal){ const ll=formMarkerIdeal.getLatLng(); txt += `Ideal: ${ll.lat.toFixed(5)}, ${ll.lng.toFixed(5)}`; }
  document.getElementById('coordsInfo').textContent = txt;
}

async function searchAddress(q){
  try{
    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=5&q=${encodeURIComponent(q)}`);
    const data = await res.json();
    const box = document.getElementById('addrSuggestions');
    box.innerHTML = `<div style="position:absolute;z-index:500;background:#fff;border:1px solid var(--line);border-radius:6px;width:100%;max-height:180px;overflow-y:auto;box-shadow:0 6px 14px rgba(0,0,0,.1);">${
      data.map(d=>`<div style="padding:8px 10px;font-size:12.5px;cursor:pointer;border-bottom:1px solid var(--line);" onmousedown="selectAddress(${d.lat},${d.lon},'${(d.display_name||'').replace(/'/g,"\\'")}')">${d.display_name}</div>`).join('')
    }</div>`;
  }catch(e){ /* silent */ }
}
function selectAddress(lat, lon, label){
  document.getElementById('fDireccion').value = label;
  document.getElementById('addrSuggestions').innerHTML = '';
  if(formMarkerActual) formMap.removeLayer(formMarkerActual);
  formMarkerActual = L.circleMarker([lat,lon],{radius:8,color:'#fff',weight:2,fillColor:'#C8334D',fillOpacity:1}).addTo(formMap);
  formMap.setView([lat,lon], 16);

async function reverseGeocode(lat,lng){
  try{
    const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`);
    const data = await res.json();
    if(data && data.display_name) document.getElementById('fDireccion').value = data.display_name;
  }catch(e){}
}
function useGPS(){
  if(!navigator.geolocation){ toast('GPS no disponible en este dispositivo'); return; }
  navigator.geolocation.getCurrentPosition((pos)=>{
    const {latitude, longitude} = pos.coords;
    if(formMarkerActual) formMap.removeLayer(formMarkerActual);
    formMarkerActual = L.circleMarker([latitude,longitude],{radius:8,color:'#fff',weight:2,fillColor:'#C8334D',fillOpacity:1}).addTo(formMap);
    formMap.setView([latitude,longitude],16);
    reverseGeocode(latitude,longitude);
    updateCoordsInfo();
    toast('Ubicación GPS capturada');
  }, ()=>toast('No se pudo obtener la ubicación GPS'));
}

function handlePhoto(evt, tipo){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const canvas = document.createElement('canvas');
      canvas.width = img.width; canvas.height = img.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0);
      // stamp timestamp
      const stamp = fmtDate(new Date());
      const fontSize = Math.max(18, Math.round(img.width/40));
      ctx.font = `600 ${fontSize}px IBM Plex Mono, monospace`;
      const padding = fontSize*0.6;
      const textW = ctx.measureText(stamp).width;
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(0, img.height-fontSize-padding*2, textW+padding*2, fontSize+padding*2);
      ctx.fillStyle = '#fff';
      ctx.textBaseline = 'middle';
      ctx.fillText(stamp, padding, img.height-fontSize/2-padding);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
      pendingFotos[tipo] = dataUrl;
      const box = document.getElementById(tipo==='grifo'?'boxGrifo':'boxHallazgo');
      box.innerHTML = `<img src="${dataUrl}">`;
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

async function guardarHallazgo(){
  if(hallazgosAgregados.length===0){ toast('Agrega al menos un hallazgo (grifo o cámara) antes de guardar'); return; }
  if(!document.getElementById('fRevisionOk').checked){ toast('Marca la casilla de revisión antes de guardar'); return; }
  if(!formMarkerActual){ toast('Marca la ubicación real del grifo en el mapa'); return; }
  const prioridad = document.querySelector('input[name="prioridad"]:checked').value;
  const llActual = formMarkerActual.getLatLng();
  const llIdeal = formMarkerIdeal ? formMarkerIdeal.getLatLng() : null;
  const id = uid();
  const btn = document.querySelector('#formNuevo button.btn-primary');
  if(btn){ btn.disabled = true; btn.textContent = 'Guardando…'; }

  const [fotoGrifoUrl, fotoHallazgoUrl] = await Promise.all([
    subirFoto(pendingFotos.grifo, `hallazgos/${id}/grifo.jpg`),
    subirFoto(pendingFotos.hallazgo, `hallazgos/${id}/hallazgo.jpg`)
  ]);

  const codigoGrifo = document.getElementById('fCodigoGrifo').value.trim().toUpperCase() || null;

  const nuevo = {
    id,
    fecha_creacion: new Date().toISOString(),
    creado_por: 'Singemelec',
    codigo_grifo: codigoGrifo,
    comuna: catalogoMatchActual ? catalogoMatchActual.comuna : null,
    localidad: catalogoMatchActual ? catalogoMatchActual.localidad : null,
    modelo_grifo: catalogoMatchActual ? catalogoMatchActual.modelo : null,
    diametro_conexion: catalogoMatchActual ? catalogoMatchActual.diametro_conexion : null,
    ano_instalacion: catalogoMatchActual ? catalogoMatchActual.ano_instalacion : null,
    hallazgos_detalle: hallazgosAgregados.slice(),
    direccion: document.getElementById('fDireccion').value || 'Sin dirección registrada',
    lat: llActual.lat, lng: llActual.lng,
    ideal_lat: llIdeal? llIdeal.lat : null, ideal_lng: llIdeal? llIdeal.lng : null,
    foto_grifo: fotoGrifoUrl,
    foto_hallazgo: fotoHallazgoUrl,
    foto_respaldo: null,
    descripcion: document.getElementById('fDescripcion').value,
    prioridad,
    estado: 'pendiente',
    comentarios: []
  };

  if(STORAGE_MODE === 'remote' && firebaseReady){
    try{
      const {id: _omit, ...datos} = nuevo;
      await db.collection('hallazgos').doc(id).set(datos);
      // el listener en tiempo real (onSnapshot) actualiza la vista en todos los dispositivos
    }catch(e){
      console.error(e);
      toast('Sin conexión a la base de datos compartida: guardando solo en este dispositivo');
      HALLAZGOS.unshift(nuevo);
      guardarLocal();
    }
  } else {
    HALLAZGOS.unshift(nuevo);
    guardarLocal();
  }

  toast('Hallazgo guardado correctamente');
  goPage('lista');
}

/* Muestra un modal de confirmación (no usa confirm() nativo) antes de
   eliminar en forma permanente los hallazgos seleccionados. */
function confirmarEliminacion(){
  if(SELECCION_LISTA.size===0) return;
  const modalBg = document.getElementById('modalBg');
  const modal = document.getElementById('modalContent');
  if(!modalBg || !modal) return;
  const n = SELECCION_LISTA.size;
  modal.innerHTML = `
    <button class="closeX" onclick="closeModal()">&times;</button>
    <h2>Eliminar hallazgo${n===1?'':'s'}</h2>
    <p style="font-size:13.5px;color:var(--text);">¿Confirmas eliminar ${n} hallazgo${n===1?'':'s'} seleccionado${n===1?'':'s'}? Esta acción no se puede deshacer.</p>
    <div style="display:flex;gap:8px;margin-top:16px;">
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-danger btn-sm" onclick="ejecutarEliminacion()">Eliminar definitivamente</button>
    </div>
  `;
  modalBg.classList.add('open');
}

async function ejecutarEliminacion(){
  const ids = Array.from(SELECCION_LISTA);
  closeModal();
  if(ids.length===0) return;
  if(STORAGE_MODE === 'remote' && firebaseReady){
    try{
      const batch = db.batch();
      ids.forEach(id => batch.delete(db.collection('hallazgos').doc(id)));
      await batch.commit();
      ids.forEach(id => borrarFotosHallazgo(id)); // best-effort, no bloquea la UI
    }catch(e){
      console.error(e);
      toast('No se pudo eliminar: revisa tu conexión e intenta nuevamente');
      return;
    }
  } else {
    HALLAZGOS = HALLAZGOS.filter(h => !ids.includes(h.id));
    guardarLocal();
  }
  SELECCION_LISTA.clear();
  toast(`${ids.length} hallazgo${ids.length===1?'':'s'} eliminado${ids.length===1?'':'s'}`);
  render();
}

/* Borra las fotos asociadas a un hallazgo en Cloud Storage. Es "best effort":
   si falla (por ejemplo la carpeta no existe o hay un error de permisos)
   no interrumpe el resto del flujo de eliminación. */
async function borrarFotosHallazgo(id){
  if(!storageRef) return;
  try{
    const folder = storageRef.ref().child('hallazgos/'+id);
    const listado = await folder.listAll();
    await Promise.all(listado.items.map(item => item.delete().catch(()=>{})));
  }catch(e){
    // sin bloquear: puede que la carpeta no exista o no haya fotos
  }
}

async function actualizarHallazgo(id){
  const h = HALLAZGOS.find(x=>x.id===id);
  if(!h) return;

  const nuevoEstado = document.getElementById('estadoSelect').value;
  const txt = document.getElementById('nuevoComentario').value.trim();
  const nuevosComentarios = h.comentarios.slice();
  if(txt) nuevosComentarios.push({autor:'Sacyr Aguas', fecha:new Date().toISOString(), texto:txt});

  let fotoRespaldoUrl = h.foto_respaldo;
  if(pendingRespaldo){
    fotoRespaldoUrl = await subirFoto(pendingRespaldo, `hallazgos/${id}/respaldo_${Date.now()}.jpg`);
  }

  const cambios = { estado: nuevoEstado, foto_respaldo: fotoRespaldoUrl, comentarios: nuevosComentarios };

  if(STORAGE_MODE === 'remote' && firebaseReady){
    try{
      await db.collection('hallazgos').doc(id).update(cambios);
    }catch(e){
      console.error(e);
      toast('Sin conexión: actualización guardada solo en este dispositivo');
      Object.assign(h, cambios);

/* Construye el HTML del informe ejecutivo (se reutiliza tanto para la
   descarga en HTML como para la generación de PDF vía impresión). */
function construirReporteHTML(){
  const total = HALLAZGOS.length;
  const counts = {inmediato:0, corto:0, mediano:0};
  const estados = {pendiente:0, en_proceso:0, resuelto:0};
  HALLAZGOS.forEach(h=>{ counts[h.prioridad]=(counts[h.prioridad]||0)+1; estados[h.estado]=(estados[h.estado]||0)+1; });
  const fechaReporte = fmtDate(new Date());
  const pctResuelto = total ? Math.round((estados.resuelto||0)/total*100) : 0;
  const dataJson = JSON.stringify(HALLAZGOS).replace(/</g,'\\u003c');

  // Texto de introducción
  const introTexto = `Singemelec, en su rol de empresa de servicio de inspección de grifos, ha desarrollado un proceso sistemático de levantamiento de hallazgos en terreno para la red de grifos contraparte de Sacyr Aguas. El presente informe resume el estado del catastro a la fecha de emisión, presentando la categorización y priorización de los hallazgos detectados, así como el avance en su resolución por parte de la empresa mandante.`;

  // Tablas por prioridad para el desarrollo
  function bloquePrioridad(clave, etiqueta, color){
    const items = HALLAZGOS.filter(h=>h.prioridad===clave);
    if(items.length===0) return `<h3 style="color:${color}">${etiqueta} <span class="mono" style="font-size:12px;color:var(--text-soft);font-weight:400;">(0 hallazgos)</span></h3><p style="font-size:13px;color:var(--text-soft);">Sin hallazgos registrados en esta categoría.</p>`;
    const rows = items.map(h=>{
      const detalle = obtenerDetalleHallazgos(h);
      const detalleTxt = detalle.length ? detalle.map(d=>`${d.tipo_elemento==='camara'?'Cámara':'Grifo'}: ${d.tipo_hallazgo}`).join('; ') : '—';
      return `
      <tr>
        <td class="mono">${h.id}</td>
        <td class="mono">${h.codigo_grifo || '—'}</td>
        <td>${detalleTxt}</td>
        <td>${h.direccion}</td>
        <td><span class="badge ${h.estado}">${ESTADO_LABEL[h.estado]}</span></td>
        <td>${fmtDate(h.fecha_creacion)}</td>
        <td>${h.comentarios.length ? h.comentarios[h.comentarios.length-1].texto : '—'}</td>
      </tr>`;}).join('');
    return `<h3 style="color:${color}">${etiqueta} <span class="mono" style="font-size:12px;color:var(--text-soft);font-weight:400;">(${items.length} hallazgo${items.length===1?'':'s'})</span></h3>
      <table><thead><tr><th>ID</th><th>Grifo</th><th>Hallazgo</th><th>Dirección</th><th>Estado</th><th>Registrado</th><th>Último avance</th></tr></thead>
      <tbody>${rows}</tbody></table>`;
  }

  // Resumen agrupado por código de grifo: cuántos registros y cuántos
  // hallazgos (de grifo y de cámara) se han levantado por cada grifo.
  function bloqueResumenPorGrifo(){
    const porCodigo = {};
    HALLAZGOS.forEach(h=>{
      const cod = h.codigo_grifo || 'Sin código';
      if(!porCodigo[cod]) porCodigo[cod] = {registros:0, hallazgos:0, comuna:h.comuna||'', localidad:h.localidad||''};
      porCodigo[cod].registros += 1;
      porCodigo[cod].hallazgos += obtenerDetalleHallazgos(h).length;
    });
    const codigos = Object.keys(porCodigo).sort();
    if(codigos.length===0) return '';
    const rows = codigos.map(cod=>{
      const d = porCodigo[cod];
      const ubic = [d.localidad, d.comuna].filter(Boolean).join(', ');
      return `<tr><td class="mono">${cod}</td><td>${ubic || '—'}</td><td>${d.registros}</td><td>${d.hallazgos}</td></tr>`;
    }).join('');
    return `<div class="panel">
      <h3 style="margin-top:0;">Resumen por grifo</h3>
      <table><thead><tr><th>Código de grifo</th><th>Ubicación</th><th>Registros</th><th>Hallazgos totales</th></tr></thead>
      <tbody>${rows}</tbody></table>
    </div>`;
  }

  // Texto de conclusión, generado a partir del estado real del catastro
  let conclusionTexto = `Del total de ${total} hallazgo${total===1?'':'s'} registrado${total===1?'':'s'} en el catastro, ${estados.resuelto||0} (${pctResuelto}%) se encuentra${(estados.resuelto||0)===1?'':'n'} resuelto${(estados.resuelto||0)===1?'':'s'} por Sacyr Aguas, mientras que ${(estados.pendiente||0)+(estados.en_proceso||0)} permanece${((estados.pendiente||0)+(estados.en_proceso||0))===1?'':'n'} en gestión. `;
  if((counts.inmediato||0) > 0){
    conclusionTexto += `Se identifican ${counts.inmediato} hallazgo${counts.inmediato===1?'':'s'} de prioridad inmediata, los cuales requieren atención prioritaria por el riesgo operacional que representan para la red. `;
  } else {
    conclusionTexto += `No se registran hallazgos de prioridad inmediata pendientes a la fecha. `;
  }
  conclusionTexto += `Se recomienda mantener la actualización periódica del catastro y dar seguimiento continuo a los hallazgos de corto y mediano plazo para evitar su escalamiento.`;

DATA.forEach(h=>{

  const a = document.createElement('a');

}

  return `<!DOCTYPE html>

/* ---------------- EXPORTAR A EXCEL ----------------
   La construcción de las filas está separada de la llamada a la librería
   XLSX a propósito, para poder probar (offline, sin la librería real) que
   los datos quedan bien armados antes de generar el archivo. */
function construirFilasExcel(){
  const filas = [];
  HALLAZGOS.forEach(h=>{
    const detalle = obtenerDetalleHallazgos(h);
    const zona = zonaDeHallazgo(h)==='lampa' ? 'Lampa' : zonaDeHallazgo(h)==='metropolitana' ? 'Metropolitana' : 'Sin zona';
    const base = {
      'ID registro': h.id,
      'Fecha registro': fmtDate(h.fecha_creacion),
      'Creado por': h.creado_por || '',
      'Zona': zona,
      'Código de grifo': h.codigo_grifo || '',
      'Comuna': h.comuna || '',
      'Localidad': h.localidad || '',
      'Dirección': h.direccion || '',
      'Modelo grifo': h.modelo_grifo || '',
      'Diámetro conexión (mm)': h.diametro_conexion || '',
      'Año instalación': h.ano_instalacion || '',
      'Latitud': h.lat || '', 'Longitud': h.lng || '',
      'Latitud ideal': h.ideal_lat || '', 'Longitud ideal': h.ideal_lng || '',
      'Prioridad': PRIORIDAD_LABEL[h.prioridad] || h.prioridad || '',
      'Estado': ESTADO_LABEL[h.estado] || h.estado || '',
      'Descripción': h.descripcion || '',
      'Último comentario': (h.comentarios && h.comentarios.length) ? h.comentarios[h.comentarios.length-1].texto : '',
      'Fotos adjuntas': [h.foto_grifo,h.foto_hallazgo,h.foto_respaldo].filter(Boolean).length
    };
    if(detalle.length===0){
      filas.push(Object.assign({}, base, {'Tipo de elemento':'', 'Hallazgo':''}));
    } else {
      detalle.forEach(d=>{
        filas.push(Object.assign({}, base, {'Tipo de elemento': d.tipo_elemento==='camara'?'Cámara':'Grifo', 'Hallazgo': d.tipo_hallazgo}));
      });
    }
  });
  return filas;
}

function construirFilasResumenExcel(){
  const porCodigo = {};
  HALLAZGOS.forEach(h=>{
    const cod = h.codigo_grifo || 'Sin código';
    if(!porCodigo[cod]){
      const zona = zonaDeHallazgo(h)==='lampa' ? 'Lampa' : zonaDeHallazgo(h)==='metropolitana' ? 'Metropolitana' : 'Sin zona';
      porCodigo[cod] = {zona, comuna:h.comuna||'', localidad:h.localidad||'', registros:0, hallazgos:0};
    }
    porCodigo[cod].registros += 1;
    porCodigo[cod].hallazgos += obtenerDetalleHallazgos(h).length;
  });
  return Object.keys(porCodigo).sort().map(cod=>({
    'Código de grifo': cod,
    'Zona': porCodigo[cod].zona,
    'Localidad': porCodigo[cod].localidad,
    'Comuna': porCodigo[cod].comuna,
    'Registros': porCodigo[cod].registros,
    'Hallazgos totales': porCodigo[cod].hallazgos
  }));
}

function exportarExcel(){
  if(typeof XLSX === 'undefined'){ toast('No se pudo cargar el módulo de Excel. Revisa tu conexión e intenta nuevamente.'); return; }
  if(HALLAZGOS.length===0){ toast('No hay hallazgos para exportar'); return; }
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.json_to_sheet(construirFilasExcel());
  XLSX.utils.book_append_sheet(wb, ws, 'Hallazgos');
  const wsResumen = XLSX.utils.json_to_sheet(construirFilasResumenExcel());
  XLSX.utils.book_append_sheet(wb, wsResumen, 'Resumen por grifo');
  const stamp = new Date().toISOString().slice(0,16).replace(/[:T]/g,'-');
  XLSX.writeFile(wb, `hallazgos-grifos-${stamp}.xlsx`);
  toast('Excel generado');
}

/* Genera el informe ejecutivo en PDF: abre el mismo informe en una pestaña
   nueva y dispara el diálogo de impresión nativo del navegador (el usuario
   elige "Guardar como PDF"). Se usa impresión nativa en vez de una librería
   tipo html2canvas porque las imágenes del mapa (OpenStreetMap) son de otro
   origen y suelen fallar al capturarlas como imagen/canvas; la impresión
   nativa no tiene ese problema. */
function imprimirReportePDF(){
  const html = construirReporteHTML();
  const w = window.open('', '_blank');
  if(!w){ toast('Habilita las ventanas emergentes del navegador para generar el PDF'); return; }
  w.document.open();
  w.document.write(html);
  w.document.close();
  toast('Elige "Guardar como PDF" en el diálogo de impresión que se abrirá');
  setTimeout(()=>{ try{ w.focus(); w.print(); }catch(e){ console.error(e); } }, 1200);
}

/* ---------------- IMPORTAR CSV ---------------- */
function handleCSVImport(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async function(e){
    const text = e.target.result;
    const lines = text.split(/\r?\n/).filter(l=>l.trim().length>0);
    if(lines.length<2){ toast('El archivo CSV está vacío'); return; }
    const headers = lines[0].split(',').map(h=>h.trim().toLowerCase());
    const idx = {
      direccion: headers.indexOf('direccion'),
      lat: headers.indexOf('lat'),
      lng: headers.indexOf('lng'),
      prioridad: headers.indexOf('prioridad'),
      estado: headers.indexOf('estado'),
      descripcion: headers.indexOf('descripcion')
    };
    if(idx.lat===-1 || idx.lng===-1){
      toast('El CSV debe tener al menos columnas: direccion, lat, lng');
      return;
    }
    const nuevos = [];
    for(let i=1;i<lines.length;i++){
      const cols = lines[i].split(',');
      const lat = parseFloat(cols[idx.lat]);
      const lng = parseFloat(cols[idx.lng]);
      if(isNaN(lat) || isNaN(lng)) continue;
      const prioridadRaw = (idx.prioridad>-1 ? cols[idx.prioridad] : '').trim().toLowerCase();
      const prioridad = ['inmediato','corto','mediano'].includes(prioridadRaw) ? prioridadRaw : 'mediano';
      const estadoRaw = (idx.estado>-1 ? cols[idx.estado] : '').trim().toLowerCase();
      const estado = ['pendiente','en_proceso','resuelto'].includes(estadoRaw) ? estadoRaw : 'pendiente';
      nuevos.push({
        id: uid(),
        fecha_creacion: new Date().toISOString(),
        creado_por: 'Importado (base de datos)',
        direccion: idx.direccion>-1 ? (cols[idx.direccion]||'').trim() : `Grifo ${lat.toFixed(4)}, ${lng.toFixed(4)}`,
        lat, lng, ideal_lat:null, ideal_lng:null,
        foto_grifo:null, foto_hallazgo:null, foto_respaldo:null,
        descripcion: idx.descripcion>-1 ? (cols[idx.descripcion]||'').trim() : '',
        prioridad, estado, comentarios:[]
      });
    }

    if(nuevos.length===0){ toast('No se encontraron filas válidas para importar'); return; }

    if(STORAGE_MODE === 'remote' && firebaseReady){
      try{
        const CHUNK = 400; // límite de 500 operaciones por batch en Firestore
        for(let i=0;i<nuevos.length;i+=CHUNK){
          const batch = db.batch();
          nuevos.slice(i,i+CHUNK).forEach(n=>{
            const {id, ...datos} = n;
            batch.set(db.collection('hallazgos').doc(id), datos);
          });
          await batch.commit();
        }
      }catch(e){
        console.error(e);
        toast('Sin conexión a la base de datos compartida: importando solo en este dispositivo');
        HALLAZGOS.unshift(...nuevos);
        guardarLocal();
      }
    } else {
      HALLAZGOS.unshift(...nuevos);
      guardarLocal();
    }

    toast(`${nuevos.length} grifos importados correctamente`);
    evt.target.value = '';
    renderDashboard();
  };
  reader.readAsText(file);
}

      <div class="display">No se pudo cargar el catastro</div>
      Recarga la página. Si el problema persiste, revisa tu conexión a internet.
      <br><button class="btn btn-primary btn-sm" style="margin-top:14px;" onclick="location.reload()">Reintentar</button>
    </div></div>`;
  }
})();
