/* Construye el HTML del informe ejecutivo (se reutiliza tanto para la
   descarga en HTML como para la generación de PDF vía impresión). */
function construirReporteHTML(soloIds){
  const baseHallazgos = HALLAZGOS.filter(tieneHallazgoReal);
  const conHallazgo = soloIds ? baseHallazgos.filter(h=>soloIds.includes(h.id)) : baseHallazgos;
  const total = conHallazgo.length;
  const counts = {directa:0, indirecta:0, senaletica:0};
  const estados = {pendiente:0, en_proceso:0, resuelto:0};
  conHallazgo.forEach(h=>{ const c=criticidadDeRegistro(h); counts[c]=(counts[c]||0)+1; estados[h.estado]=(estados[h.estado]||0)+1; });
  const fechaReporte = fmtDate(new Date());
  const pctResuelto = total ? Math.round((estados.resuelto||0)/total*100) : 0;
  const dataJson = JSON.stringify(conHallazgo).replace(/</g,'\\u003c');

  // Texto de introducción
  const introTexto = `Singemelec, en su rol de empresa de servicio de inspección de grifos, ha desarrollado un proceso sistemático de levantamiento de hallazgos en terreno para la red de grifos contraparte de Sacyr Aguas. El presente informe resume el estado del catastro a la fecha de emisión, presentando la categorización y criticidad de los hallazgos detectados, así como el avance en su resolución por parte de la empresa mandante.`;

  // Tablas por criticidad para el desarrollo
  function bloquePrioridad(clave, etiqueta, color){
    const items = conHallazgo.filter(h=>criticidadDeRegistro(h)===clave);
    if(items.length===0) return `<h3 style="color:${color}">${etiqueta} <span class="mono" style="font-size:12px;color:var(--text-soft);font-weight:400;">(0 hallazgos)</span></h3><p style="font-size:13px;color:var(--text-soft);">Sin hallazgos registrados en esta categoría.</p>`;
    const rows = items.map(h=>{
      const detalle = obtenerDetalleHallazgos(h);
      const detalleTxt = detalle.length ? detalle.map(d=>`${d.tipo_elemento==='camara'?'Cámara':'Grifo'}: ${d.tipo_hallazgo}`).join('; ') : '—';
      const fotoPrincipal = h.foto_hallazgo || h.foto_grifo;
      const ultimoComentario = h.comentarios && h.comentarios.length ? h.comentarios[h.comentarios.length-1] : null;
      const fotoAvance = ultimoComentario ? (ultimoComentario.foto_despues || ultimoComentario.foto_antes || ultimoComentario.foto) : null;
      return `
      <tr>
        <td class="mono" style="font-weight:700;color:var(--ink);">${h.codigo_grifo || '—'}</td>
        <td style="font-weight:600;">${detalleTxt}</td>
        <td class="fotos-cell">${fotoPrincipal ? `<a href="${fotoPrincipal}" target="_blank" rel="noopener"><img class="mini-foto" src="${fotoPrincipal}" alt="Foto del hallazgo"></a>` : '<span class="sinfoto">Sin foto</span>'}</td>
        <td>${h.direccion}</td>
        <td><span class="badge ${h.estado}">${ESTADO_LABEL[h.estado]}</span></td>
        <td>${fmtDate(h.fecha_creacion)}</td>
        <td>${ultimoComentario ? `${ultimoComentario.texto || '—'}${fotoAvance ? `<br><a href="${fotoAvance}" target="_blank" rel="noopener"><img class="mini-foto" src="${fotoAvance}" alt="Avance más reciente"></a>` : ''}` : 'Sin avances registrados'}</td>
      </tr>`;}).join('');
    return `<h3 style="color:${color}">${etiqueta} <span class="mono" style="font-size:12px;color:var(--text-soft);font-weight:400;">(${items.length} hallazgo${items.length===1?'':'s'})</span></h3>
      <table><thead><tr><th>Grifo</th><th>Hallazgo</th><th>Foto</th><th>Dirección</th><th>Estado</th><th>Registrado</th><th>Proceso de solución (último avance)</th></tr></thead>
      <tbody>${rows}</tbody></table>`;
  }

  // Resumen agrupado por código de grifo: cuántos registros y cuántos
  // hallazgos (de grifo y de cámara) se han levantado por cada grifo.
  function bloqueResumenPorGrifo(){
    const porCodigo = {};
    conHallazgo.forEach(h=>{
      const cod = h.codigo_grifo || 'Sin código';
      if(!porCodigo[cod]) porCodigo[cod] = {registros:0, hallazgos:0, comuna:h.comuna||'', localidad:h.localidad||''};
      porCodigo[cod].registros += 1;
      porCodigo[cod].hallazgos += obtenerDetalleHallazgos(h).length;
    });
    const codigos = Object.keys(porCodigo).sort();
    if(codigos.length===0) return '';
    const rows = codigos.map(cod=>{
      const d = porCodigo[cod];
      const ubic = [d.localidad, d.comuna].filter(Boolean).join(', ');
      return `<tr><td class="mono">${cod}</td><td>${ubic || '—'}</td><td>${d.registros}</td><td>${d.hallazgos}</td></tr>`;
    }).join('');
    return `<div class="panel">
      <h3 style="margin-top:0;">Resumen por grifo</h3>
      <table><thead><tr><th>Código de grifo</th><th>Ubicación</th><th>Registros</th><th>Hallazgos totales</th></tr></thead>
      <tbody>${rows}</tbody></table>
    </div>`;
  }

  // Texto de conclusión, generado a partir del estado real del catastro
  let conclusionTexto = `Del total de ${total} hallazgo${total===1?'':'s'} registrado${total===1?'':'s'} en el catastro, ${estados.resuelto||0} (${pctResuelto}%) se encuentra${(estados.resuelto||0)===1?'':'n'} resuelto${(estados.resuelto||0)===1?'':'s'} por Sacyr Aguas, mientras que ${(estados.pendiente||0)+(estados.en_proceso||0)} permanece${((estados.pendiente||0)+(estados.en_proceso||0))===1?'':'n'} en gestión. `;
  if((counts.directa||0) > 0){
    conclusionTexto += `Se identifican ${counts.directa} hallazgo${counts.directa===1?'':'s'} de operatividad directa, los cuales requieren atención prioritaria por el riesgo operacional que representan para la red. `;
  } else {
    conclusionTexto += `No se registran hallazgos de operatividad directa pendientes a la fecha. `;
  }
  conclusionTexto += `Se recomienda mantener la actualización periódica del catastro y dar seguimiento continuo a los hallazgos de operatividad indirecta/mecánica y de señalética/visibilidad para evitar su escalamiento.`;

  const html = `<!DOCTYPE html>

<script>
const DATA = ${dataJson};
const PRIORIDAD_COLOR = {directa:'#C8334D', indirecta:'#E2A33D', senaletica:'#3B6E8F', inmediato:'#C8334D', corto:'#E2A33D', mediano:'#3B6E8F'};

const CRITICIDAD_LEGACY = {inmediato:'directa', corto:'indirecta', mediano:'senaletica'};
const ESTADO_LABEL = {pendiente:'Pendiente', en_proceso:'En proceso', resuelto:'Resuelto'};
const counts = {directa:0,indirecta:0,senaletica:0}, estados={pendiente:0,en_proceso:0,resuelto:0};
DATA.forEach(h=>{const c=CRITICIDAD_LEGACY[h.prioridad]||h.prioridad; counts[c]=(counts[c]||0)+1; estados[h.estado]=(estados[h.estado]||0)+1;});
const center = DATA.length ? [DATA[0].lat, DATA[0].lng] : [-33.0245,-71.5518];
const map = L.map('repMap').setView(center, DATA.length?12:13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);
DATA.forEach(h=>{
  const c = PRIORIDAD_COLOR[h.prioridad]||'#999';
  L.circleMarker([h.lat,h.lng],{radius:9,color:'#fff',weight:2,fillColor:c,fillOpacity:1}).addTo(map)
    .bindPopup('<strong>'+h.direccion+'</strong><br>'+PRIORIDAD_LABEL[h.prioridad]+' · '+ESTADO_LABEL[h.estado]);
});
new Chart(document.getElementById('repChart1'), {type:'doughnut',
  data:{labels:['Operatividad directa','Operatividad indirecta/mecánica','Señalética/visibilidad'],datasets:[{data:[counts.directa||0,counts.indirecta||0,counts.senaletica||0],backgroundColor:['#C8334D','#E2A33D','#3B6E8F'],borderWidth:2,borderColor:'#fff'}]},
  options:{plugins:{legend:{position:'bottom',labels:{font:{size:11}}}},cutout:'62%',maintainAspectRatio:false}});
new Chart(document.getElementById('repChart2'), {type:'bar',
  data:{labels:['Pendiente','En proceso','Resuelto'],datasets:[{data:[estados.pendiente||0,estados.en_proceso||0,estados.resuelto||0],backgroundColor:['#cabfa1','#7fa688','#5C8A60'],borderRadius:6}]},
  options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{precision:0}}},maintainAspectRatio:false}});
<\/script>
</body></html>`;

  return html;
}

/* Descarga el informe ejecutivo como archivo .html */
function descargarReporteEjecutivo(){
  const html = construirReporteHTML();
  const blob = new Blob([html], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,16).replace(/[:T]/g,'-');
  a.href = url;
  a.download = `informe-ejecutivo-grifos-${stamp}.html`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast('Informe ejecutivo descargado');
}

/* ---------------- REPORTE COMPLETO DE HALLAZGOS (pestaña Hallazgos) ----------------
   A diferencia del informe ejecutivo (que resume y prioriza para presentar a
   Sacyr Aguas), este reporte lista TODOS los hallazgos registrados, con todos
   sus datos, agrupados por zona (Lampa / Metropolitana). */
function construirReporteHallazgosHTML(soloIds){
  const fechaReporte = fmtDate(new Date());
  const baseHallazgosRep = HALLAZGOS.filter(tieneHallazgoReal);
  const conHallazgoRep = soloIds ? baseHallazgosRep.filter(h=>soloIds.includes(h.id)) : baseHallazgosRep;
  const totalRegistros = conHallazgoRep.length;
  const totalHallazgos = conHallazgoRep.reduce((acc,h)=>acc + Math.max(obtenerDetalleHallazgos(h).length,1), 0);

  /* Fotos del hallazgo propiamente dicho (el "proceso del hallazgo"): la
     foto del grifo y la del hallazgo detectado, más las fotos específicas
     de inspección cuando el registro viene de esa pestaña. Se guardan por
     registro, no por hallazgo individual, así que un mismo set de fotos
     puede repetirse en las tarjetas que vienen del mismo registro/visita —
     eso es intencional, son evidencia de esa visita. */
  function fotosHallazgoIniciales(h){
    const items = [];
    if(esInspeccion(h)){
      if(h.foto_grifo_operativo) items.push({url:h.foto_grifo_operativo, label:'Grifo operativo'});
      if(h.foto_presion) items.push({url:h.foto_presion, label:'Presión del grifo'});
      if(h.foto_camara) items.push({url:h.foto_camara, label:'Cámara'});
    }
    const fotosGrifo = (h.fotos_grifo && h.fotos_grifo.length) ? h.fotos_grifo : (h.foto_grifo ? [h.foto_grifo] : []);
    fotosGrifo.forEach((url,i)=> items.push({url, label: fotosGrifo.length>1 ? `Foto del grifo ${i+1}` : 'Foto del grifo'}));
    const fotosHallazgo = (h.fotos_hallazgo && h.fotos_hallazgo.length) ? h.fotos_hallazgo : (h.foto_hallazgo ? [h.foto_hallazgo] : []);
    fotosHallazgo.forEach((url,i)=> items.push({url, label: fotosHallazgo.length>1 ? `Foto del hallazgo ${i+1}` : 'Foto del hallazgo'}));
    return items;
  }

  function galeriaFotos(items){
    if(!items.length) return '<span class="sinfoto">Sin foto</span>';
    return `<div class="foto-galeria">${items.map(f=>`<a href="${f.url}" target="_blank" rel="noopener" class="foto-item" title="${f.label}"><img src="${f.url}" alt="${f.label}" loading="lazy"><span>${f.label}</span></a>`).join('')}</div>`;
  }

  /* La "solución ejecutada en terreno": solo el último avance registrado
     (el más reciente comentario/actualización), no la traza completa —
     así el informe queda limpio con la solución final, en vez de mezclarla
     con entradas intermedias como el log automático de "ingresado en
     terreno". Trae su propia foto de respaldo ("después" de la solución). */
  function bloqueSolucionFinal(h){
    if(!h.comentarios || !h.comentarios.length) return '<p class="sin-historial">Sin solución registrada todavía.</p>';
    const ultimo = h.comentarios[h.comentarios.length-1];
    const fotos = [];
    const fotosDespues = (ultimo.fotos_despues && ultimo.fotos_despues.length) ? ultimo.fotos_despues : (ultimo.foto_despues ? [ultimo.foto_despues] : []);
    fotosDespues.forEach((url,i)=> fotos.push({url, label: fotosDespues.length>1 ? `Foto de la solución ${i+1}` : 'Foto de la solución'}));
    if(!fotosDespues.length && ultimo.foto) fotos.push({url:ultimo.foto, label:'Foto de la solución'});
    return `<div><span class="gi-label">Solución ejecutada en terreno</span><p class="hc-desc" style="margin:2px 0 8px;">${ultimo.texto || 'Sin descripción registrada.'}</p></div>${galeriaFotos(fotos)}`;
  }

  /* Agrupa los registros de una zona por código de grifo, para que la
     ubicación y dirección del catastro se muestren una sola vez por grifo
     en vez de repetirse en cada fila de hallazgo. */
  function agruparPorGrifo(items){
    const grupos = new Map();
    items.forEach(h=>{
      const key = h.codigo_grifo || ('__sin_codigo__'+h.id);
      if(!grupos.has(key)) grupos.set(key, {codigo: h.codigo_grifo || null, registros: []});
      grupos.get(key).registros.push(h);
    });
    return Array.from(grupos.values()).sort((a,b)=>{
      if(a.codigo && b.codigo) return a.codigo.localeCompare(b.codigo);
      if(a.codigo && !b.codigo) return -1;
      if(!a.codigo && b.codigo) return 1;
      return 0;
    });
  }

  /* Cada "informe" es un bloque por grifo: título, código + detalle
     (dirección/comuna/localidad/coordenadas/datos técnicos), el mapa de
     ese punto, y luego — por cada hallazgo de ese grifo — su hallazgo y,
     solo si ya tiene avance registrado, su solución. */
  function bloqueInforme(grupo){
    const registros = grupo.registros.slice().sort((a,b)=>{
      const fa = a.fecha_creacion && a.fecha_creacion.seconds ? a.fecha_creacion.seconds : (new Date(a.fecha_creacion||0).getTime()/1000)||0;
      const fb = b.fecha_creacion && b.fecha_creacion.seconds ? b.fecha_creacion.seconds : (new Date(b.fecha_creacion||0).getTime()/1000)||0;
      return fa - fb;
    });
    const filas = [];
    registros.forEach(h=>{
      const detalle = obtenerDetalleHallazgos(h);
      const items = detalle.length ? detalle : [{tipo_elemento:null, tipo_hallazgo:'Sin categorizar'}];
      items.forEach(d=> filas.push({h, d}));
    });
    const primero = registros[0];
    const direccion = primero.direccion || '—';
    const titulo = grupo.codigo ? grupo.codigo : `Sin código de grifo (registro ${primero.id})`;
    const coordenadas = (typeof primero.lat==='number' && typeof primero.lng==='number') ? `${primero.lat.toFixed(6)}, ${primero.lng.toFixed(6)}` : '—';

    let mapaPuntoHtml;
    if(typeof primero.lat==='number' && typeof primero.lng==='number'){
      const mapId = 'mapaPunto' + puntosMapData.length;
      puntosMapData.push({id:mapId, lat:primero.lat, lng:primero.lng, label:`${titulo} · ${direccion}`});
      mapaPuntoHtml = `<div class="mapa-punto" id="${mapId}"></div>`;
    } else {
      mapaPuntoHtml = `<p class="sin-mapa">Sin coordenadas registradas para este punto.</p>`;
    }

    const tarjetasHtml = filas.map((f,i)=>{
      const crit = criticidadDeDetalle(f.d, f.h);
      const tieneSolucion = f.h.estado==='en_proceso' || f.h.estado==='resuelto';
      return `<div class="hallazgo-card">
        <div class="hc-head">
          <span class="mono">#${i+1}</span>
          <span class="badge ${f.h.estado}">${ESTADO_LABEL[f.h.estado]}</span>
          <span class="hc-meta">${fmtDate(f.h.fecha_creacion)} · ${f.h.creado_por || '—'}</span>
        </div>
        <div class="hc-section hc-encontrado">
          <h5>① Detección</h5>
          <div class="det-fields">
            <div><span class="gi-label">Hallazgo</span><span class="gi-val">${f.d.tipo_elemento==='camara'?'Cámara':(f.d.tipo_elemento==='grifo'?'Grifo':'—')} · ${f.d.tipo_hallazgo}</span></div>
            <div><span class="gi-label">Criticidad</span><span class="gi-val"><span class="badge ${crit}">${PRIORIDAD_LABEL[crit]}</span></span></div>
          </div>
          ${f.h.descripcion ? `<div style="margin-top:8px;"><span class="gi-label">Descripción</span><p class="hc-desc" style="margin:2px 0 0;">${f.h.descripcion}</p></div>` : ''}
          <div style="margin-top:10px;"><span class="gi-label">Fotos de la detección</span><div style="margin-top:4px;">${galeriaFotos(fotosHallazgoIniciales(f.h))}</div></div>
        </div>
        ${tieneSolucion ? `<div class="hc-section hc-solucion">
          <h5>② Solución</h5>
          ${bloqueSolucionFinal(f.h)}
        </div>` : ''}
      </div>`;}).join('');

    return `<div class="grifo-block">
      <h4>Grifo <span class="mono">${titulo}</span> <span class="contador">(${filas.length} hallazgo${filas.length===1?'':'s'})</span></h4>
      <div class="grifo-header-row">
        <table class="grifo-info-table">
          <thead><tr><th>Código</th><th>Dirección</th><th>Comuna</th><th>Localidad</th><th>Modelo</th><th>Diámetro</th><th>Año instalación</th></tr></thead>
          <tbody><tr>
            <td class="mono">${titulo}</td>
            <td>${direccion}</td>
            <td>${primero.comuna || '—'}</td>
            <td>${primero.localidad || '—'}</td>
            <td>${primero.modelo_grifo || '—'}</td>
            <td>${primero.diametro_conexion ? `Ø${primero.diametro_conexion}mm` : '—'}</td>
            <td>${primero.ano_instalacion || '—'}</td>
          </tr></tbody>
        </table>
        <div class="mapa-referencial-wrap">
          <p class="mapa-caption">Mapa referencial del punto<br><span class="mono">${coordenadas}</span></p>
          ${mapaPuntoHtml}
        </div>
      </div>
      ${tarjetasHtml}
    </div>`;
  }

  // Mapas individuales "del punto" que bloqueInforme va llenando a medida
  // que se arma el HTML de cada grifo (uno por grifo con coordenadas válidas).
  const puntosMapData = [];

  const grupos = agruparPorGrifo(conHallazgoRep);

  return `<!DOCTYPE html>

/* soloIds: si se pasa (array), descarga el informe solo con esos hallazgos
   (selección múltiple, o uno solo). Si no se pasa, respeta TODOS los
   filtros activos de la pestaña Hallazgos (zona, código, comuna, tipo de
   hallazgo, prioridad) — comportamiento del botón general "Reporte de
   hallazgos" y de los tres botones de Excel. */
function descargarReporteHallazgos(soloIds){
  const ids = soloIds || idsSegunFiltrosActivos();
  const html = construirReporteHallazgosHTML(ids);
  const blob = new Blob([html], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,16).replace(/[:T]/g,'-');
  a.href = url;
  a.download = ids && ids.length===1 ? `informe-hallazgo-${stamp}.html` : `reporte-hallazgos-grifos-${stamp}.html`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast(ids && ids.length===1 ? 'Informe descargado' : 'Reporte de hallazgos descargado');
}

/* Abre el diálogo de impresión del navegador con el informe ya armado,
   igual que el PDF del reporte ejecutivo, sin descargar un archivo aparte. */
function abrirEImprimir(html){
  const w = window.open('', '_blank');
  if(!w){ toast('Habilita las ventanas emergentes del navegador para imprimir'); return; }
  w.document.open();
  w.document.write(html);
  w.document.close();
  toast('Elige "Guardar como PDF" o imprime desde el diálogo que se abrirá');
  setTimeout(()=>{ try{ w.focus(); w.print(); }catch(e){ console.error(e); } }, 1200);
}

/* Genera el reporte solo con los hallazgos marcados con las casillas del
   tablero, y abre directamente el diálogo de impresión. */
function imprimirReporteSeleccionados(){
  if(SELECCION_LISTA.size===0){ toast('Selecciona al menos un hallazgo para imprimir'); return; }
  abrirEImprimir(construirReporteHallazgosHTML(Array.from(SELECCION_LISTA)));
}

/* Informe "uno a uno": el mismo formato estructurado (encabezado, mapa,
   hallazgo detectado, proceso de solución), pero de un único registro —
   se usa desde el modal de detalle. */
function imprimirReporteIndividual(id){
  abrirEImprimir(construirReporteHallazgosHTML([id]));
}

/* ---------------- EXPORTAR A EXCEL ----------------
   La construcción de las filas está separada de la llamada a la librería
   XLSX a propósito, para poder probar (offline, sin la librería real) que
   los datos quedan bien armados antes de generar el archivo.
   soloIds (opcional, en las tres variantes de abajo): si se pasa, solo se
   incluyen esos hallazgos — se usa para que los tres Excel respeten los
   filtros activos de la pestaña Hallazgos (zona, código, comuna, tipo de
   hallazgo, prioridad), igual que ya hacía el informe HTML. */
function construirFilasExcel(soloIds){
  const idsSet = soloIds ? new Set(soloIds) : null;
  const filas = [];
  HALLAZGOS.filter(tieneHallazgoReal).filter(h => !idsSet || idsSet.has(h.id)).forEach(h=>{
    const detalle = obtenerDetalleHallazgos(h);
    const zona = zonaDeHallazgo(h)==='lampa' ? 'Lampa' : zonaDeHallazgo(h)==='metropolitana' ? 'Metropolitana' : 'Sin zona';
    const base = {
      'ID registro': h.id,
      'Fecha registro': fmtDate(h.fecha_creacion),
      'Creado por': h.creado_por || '',
      'Zona': zona,
      'Código de grifo': h.codigo_grifo || '',
      'Comuna': h.comuna || '',
      'Localidad': h.localidad || '',
      'Dirección': h.direccion || '',
      'Modelo grifo': h.modelo_grifo || '',
      'Diámetro conexión (mm)': h.diametro_conexion || '',
      'Año instalación': h.ano_instalacion || '',
      'Latitud': h.lat || '', 'Longitud': h.lng || '',
      'Latitud ideal': h.ideal_lat || '', 'Longitud ideal': h.ideal_lng || '',
      'Estado': ESTADO_LABEL[h.estado] || h.estado || '',
      'Descripción': h.descripcion || '',
      'Último comentario': (h.comentarios && h.comentarios.length) ? h.comentarios[h.comentarios.length-1].texto : '',
      'Fotos adjuntas': [h.foto_grifo,h.foto_hallazgo,h.foto_respaldo,h.foto_grifo_operativo,h.foto_presion,h.foto_camara].filter(Boolean).length
    };
    if(detalle.length===0){
      filas.push(Object.assign({}, base, {'Tipo de elemento':'', 'Hallazgo':'', 'Criticidad': PRIORIDAD_LABEL[criticidadDeRegistro(h)]}));
    } else {
      detalle.forEach(d=>{
        const crit = criticidadDeDetalle(d, h);
        filas.push(Object.assign({}, base, {'Tipo de elemento': d.tipo_elemento==='camara'?'Cámara':'Grifo', 'Hallazgo': d.tipo_hallazgo, 'Criticidad': PRIORIDAD_LABEL[crit]}));
      });
    }
  });
  return filas;
}

function construirFilasResumenExcel(soloIds){
  const idsSet = soloIds ? new Set(soloIds) : null;
  const porCodigo = {};
  HALLAZGOS.filter(tieneHallazgoReal).filter(h => !idsSet || idsSet.has(h.id)).forEach(h=>{
    const cod = h.codigo_grifo || 'Sin código';
    if(!porCodigo[cod]){
      const zona = zonaDeHallazgo(h)==='lampa' ? 'Lampa' : zonaDeHallazgo(h)==='metropolitana' ? 'Metropolitana' : 'Sin zona';
      porCodigo[cod] = {zona, comuna:h.comuna||'', localidad:h.localidad||'', registros:0, hallazgos:0};
    }
    porCodigo[cod].registros += 1;
    porCodigo[cod].hallazgos += obtenerDetalleHallazgos(h).length;
  });
  return Object.keys(porCodigo).sort().map(cod=>({
    'Código de grifo': cod,
    'Zona': porCodigo[cod].zona,
    'Localidad': porCodigo[cod].localidad,
    'Comuna': porCodigo[cod].comuna,
    'Registros': porCodigo[cod].registros,
    'Hallazgos totales': porCodigo[cod].hallazgos
  }));
}

const ZONA_LABEL = {lampa:'Lampa', metropolitana:'Metropolitana', sin_zona:'Sin zona'};
// Etiquetas de estado propias del Excel SACYR (distintas de ESTADO_LABEL usado
// en el resto de la app) — Sacyr saca esta base para ir a terreno, así que
// pidieron específicamente "Nuevo"/"En proceso"/"Ejecutado".
const ESTADO_LABEL_SACYR = {pendiente:'Nuevo', en_proceso:'En proceso', resuelto:'Ejecutado'};
// Los hallazgos de pintura (p.ej. "Pintura en mal estado", señalética/visibilidad)
// no se incluyen en el Excel SACYR — pedido explícito del usuario.
function esHallazgoDePintura(tipoHallazgo){
  return !!tipoHallazgo && tipoHallazgo.toUpperCase().includes('PINTURA');
}

/* Excel SACYR: otra variante reducida, pensada para el cliente, con las
   columnas Código Grifo, Zona, Comuna, Localidad, Dirección, Modelo,
   Hallazgo, Criticidad, Estado y el último comentario/avance registrado —
   en este orden exacto. Una fila por cada hallazgo detectado del registro
   (salvo los hallazgos de pintura, que se excluyen). */
function construirFilasExcelSacyr(soloIds){
  const idsSet = soloIds ? new Set(soloIds) : null;
  const filas = [];
  HALLAZGOS.filter(tieneHallazgoReal).filter(h => !idsSet || idsSet.has(h.id)).forEach(h=>{
    const detalle = obtenerDetalleHallazgos(h).filter(d => !esHallazgoDePintura(d.tipo_hallazgo));
    if(detalle.length===0) return; // registro que solo tenía hallazgo(s) de pintura: se omite entero del Excel SACYR
    const ultimoComentario = h.comentarios && h.comentarios.length ? h.comentarios[h.comentarios.length-1] : null;
    const base = {
      'Código Grifo': h.codigo_grifo || '',
      'Zona': ZONA_LABEL[zonaDeHallazgo(h)] || '',
      'Comuna': h.comuna || '',
      'Localidad': h.localidad || '',
      'Dirección': h.direccion || '',
      'Modelo': h.modelo_grifo || ''
    };
    const ultimo = ultimoComentario ? (ultimoComentario.texto || '') : 'Sin avances registrados';
    const estado = ESTADO_LABEL_SACYR[h.estado] || '';
    detalle.forEach(d=>{
      filas.push(Object.assign({}, base, {'Hallazgo Singemelec': d.tipo_hallazgo, 'Criticidad': PRIORIDAD_LABEL[criticidadDeDetalle(d,h)] || '', 'Estado': estado, 'Último comentario Sacyr': ultimo}));
    });
  });
  return filas;
}

function exportarExcelSacyr(){
  if(typeof XLSX === 'undefined'){ toast('No se pudo cargar el módulo de Excel. Revisa tu conexión e intenta nuevamente.'); return; }
  if(HALLAZGOS.length===0){ toast('No hay hallazgos para exportar'); return; }
  const ids = idsSegunFiltrosActivos();
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.json_to_sheet(construirFilasExcelSacyr(ids), {header:['Código Grifo','Zona','Comuna','Localidad','Dirección','Modelo','Hallazgo Singemelec','Criticidad','Estado','Último comentario Sacyr']});
  XLSX.utils.book_append_sheet(wb, ws, 'Hallazgos generales');
  const stamp = new Date().toISOString().slice(0,16).replace(/[:T]/g,'-');
  XLSX.writeFile(wb, `hallazgos-grifos-sacyr-${stamp}.xlsx`);
  toast(ids ? 'Excel SACYR generado (con los filtros activos)' : 'Excel SACYR generado');
}

/* Genera el informe ejecutivo en PDF: abre el mismo informe en una pestaña
   nueva y dispara el diálogo de impresión nativo del navegador (el usuario
   elige "Guardar como PDF"). Se usa impresión nativa en vez de una librería
   tipo html2canvas porque las imágenes del mapa (OpenStreetMap) son de otro
   origen y suelen fallar al capturarlas como imagen/canvas; la impresión
   nativa no tiene ese problema. */
function imprimirReportePDF(){
  const html = construirReporteHTML();
  const w = window.open('', '_blank');
  if(!w){ toast('Habilita las ventanas emergentes del navegador para generar el PDF'); return; }
  w.document.open();
  w.document.write(html);
  w.document.close();
  toast('Elige "Guardar como PDF" en el diálogo de impresión que se abrirá');
  setTimeout(()=>{ try{ w.focus(); w.print(); }catch(e){ console.error(e); } }, 1200);
}

/* ---------------- IMPORTAR CSV ---------------- */
function handleCSVImport(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async function(e){
    const text = e.target.result;
    const lines = text.split(/\r?\n/).filter(l=>l.trim().length>0);
    if(lines.length<2){ toast('El archivo CSV está vacío'); return; }
    const headers = lines[0].split(',').map(h=>h.trim().toLowerCase());
    const idx = {
      direccion: headers.indexOf('direccion'),
      lat: headers.indexOf('lat'),
      lng: headers.indexOf('lng'),
      prioridad: headers.indexOf('prioridad'),
      estado: headers.indexOf('estado'),
      descripcion: headers.indexOf('descripcion')
    };
    if(idx.lat===-1 || idx.lng===-1){
      toast('El CSV debe tener al menos columnas: direccion, lat, lng');
      return;
    }
    const nuevos = [];
    for(let i=1;i<lines.length;i++){
      const cols = lines[i].split(',');
      const lat = parseFloat(cols[idx.lat]);
      const lng = parseFloat(cols[idx.lng]);
      if(isNaN(lat) || isNaN(lng)) continue;
      const prioridadRaw = (idx.prioridad>-1 ? cols[idx.prioridad] : '').trim().toLowerCase();
      const prioridad = ['directa','indirecta','senaletica','inmediato','corto','mediano'].includes(prioridadRaw) ? prioridadRaw : 'indirecta';
      const estadoRaw = (idx.estado>-1 ? cols[idx.estado] : '').trim().toLowerCase();
      const estado = ['pendiente','en_proceso','resuelto'].includes(estadoRaw) ? estadoRaw : 'pendiente';
      nuevos.push({
        id: uid(),
        fecha_creacion: new Date().toISOString(),
        creado_por: 'Importado (base de datos)',
        direccion: idx.direccion>-1 ? (cols[idx.direccion]||'').trim() : `Grifo ${lat.toFixed(4)}, ${lng.toFixed(4)}`,
        lat, lng, ideal_lat:null, ideal_lng:null,
        foto_grifo:null, foto_hallazgo:null, foto_respaldo:null,
        descripcion: idx.descripcion>-1 ? (cols[idx.descripcion]||'').trim() : '',
        prioridad, estado, comentarios:[]
      });
    }

    if(nuevos.length===0){ toast('No se encontraron filas válidas para importar'); return; }

    if(STORAGE_MODE === 'remote' && firebaseReady){
      try{
        const CHUNK = 400; // límite de 500 operaciones por batch en Firestore
        for(let i=0;i<nuevos.length;i+=CHUNK){
          const batch = db.batch();
          nuevos.slice(i,i+CHUNK).forEach(n=>{
            const {id, ...datos} = n;
            batch.set(db.collection('hallazgos').doc(id), datos);
          });
          await batch.commit();
        }
      }catch(e){
        console.error(e);
        toast('Sin conexión a la base de datos compartida: importando solo en este dispositivo');
        HALLAZGOS.unshift(...nuevos);
        guardarLocal();
      }
    } else {
      HALLAZGOS.unshift(...nuevos);
      guardarLocal();
    }

    toast(`${nuevos.length} grifos importados correctamente`);
    evt.target.value = '';
    renderDashboard();
  };
  reader.readAsText(file);
}

})();
